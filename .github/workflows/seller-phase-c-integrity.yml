name: Seller Phase C Integrity Gate

on:
  pull_request:
    branches:
      - integration/vehicle-passport-v16-cert
    paths:
      - 'backend/services/marketplace/marketplaceClassificationRules.js'
      - 'backend/services/marketplace/listingSummaryService.js'
      - 'backend/services/marketplace/marketplaceListingDetailService.js'
      - 'backend/routes/marketplaceRoutes.js'
      - 'backend/tests/marketplace-classification-rules.test.js'
      - 'backend/tests/marketplace-listing-summary.test.js'
      - 'web/src/pages/Marketplace.tsx'
      - 'web/src/pages/VehicleDetail.tsx'
      - 'web/src/hooks/useCarUpApi.ts'
      - 'tests/agents/38-seller-staging-browser-golden.spec.ts'
      - '.github/workflows/seller-phase-c-integrity.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  focused-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Marketplace fixture authority tests
        run: node --test backend/tests/marketplace-classification-rules.test.js backend/tests/marketplace-listing-summary.test.js
      - name: Web typecheck/build
        run: npm run build --workspace=web
