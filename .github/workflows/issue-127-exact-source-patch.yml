name: Issue 127 exact source patch

on:
  push:
    branches:
      - fix/issue-127-uat-remediation
    paths:
      - .github/workflows/issue-127-exact-source-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-127-uat-remediation
          fetch-depth: 0

      - name: Apply asserted bounded replacements
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}: {old[:100]!r}')
              file.write_text(text.replace(old, new, 1))

          trade = 'web/src/pages/diaspora/DiasporaTrade.tsx'
          replace_once(
              trade,
              "import { buildLoginRedirect } from '@/lib/returnTo'\n",
              "import { buildLoginRedirect } from '@/lib/returnTo'\nimport { buildDiasporaRequiredDocumentChecklist } from '@/lib/diasporaDocumentChecklist'\n",
          )
          replace_once(
              trade,
              "const requiredDocuments = [\n  'Buyer identity document',\n  'Invoice or auction sheet',\n  'Export certificate',\n  'Bill of lading',\n  'ZIMRA duty assessment',\n]\n\n",
              "",
          )
          replace_once(
              trade,
              "function DocumentChecklist({ documents = [] }: { documents?: DiasporaTradeDocument[] }) {\n  const uploadedTypes = new Set(documents.map(document => labelize(document.document_type)))\n",
              "function DocumentChecklist({ documents = [] }: { documents?: DiasporaTradeDocument[] }) {\n  const checklist = buildDiasporaRequiredDocumentChecklist(documents)\n",
          )
          replace_once(
              trade,
              "        {requiredDocuments.map((documentName, index) => {\n          const uploaded = uploadedTypes.has(documentName)\n",
              "        {checklist.map(({ label: documentName, uploaded }, index) => {\n",
          )
          replace_once(
              trade,
              '<Link to="/diaspora">Cancel</Link>',
              '<Link to="/diaspora/imports">Cancel</Link>',
          )
          replace_once(
              trade,
              "              <Button asChild variant=\"outline\" data-testid=\"diaspora-open-shipment-button\">\n                <Link to={`/diaspora/imports/${order.id}/shipment`}>Shipment</Link>\n              </Button>\n",
              "              <Button asChild variant=\"outline\" data-testid=\"diaspora-open-shipment-button\">\n                <Link to={`/diaspora/imports/${order.id}/shipment`}>Shipment</Link>\n              </Button>\n              <Button asChild variant=\"outline\" data-testid=\"diaspora-open-passport-button\">\n                <Link to={`/diaspora/imports/${order.id}/passport`}>Passport</Link>\n              </Button>\n",
          )

          passport = 'web/src/pages/diaspora/DiasporaOrderPassport.tsx'
          replace_once(
              passport,
              "import { useAuth } from '@/context/AuthContext'\n",
              "import { useAuth } from '@/context/AuthContext'\nimport { buildLoginRedirect } from '@/lib/returnTo'\n",
          )
          replace_once(
              passport,
              '<Button asChild size="sm" variant="default" className="ml-2"><Link to="/login">Sign in</Link></Button>',
              '<Button asChild size="sm" variant="default" className="ml-2"><Link to={buildLoginRedirect(`/diaspora/imports/${id}/passport`)}>Sign in</Link></Button>',
          )
          replace_once(
              passport,
              '{fatal.kind === \'session\' && <Button asChild size="sm" variant="default"><Link to="/login" data-testid="order-passport-signin">Sign in</Link></Button>}',
              '{fatal.kind === \'session\' && <Button asChild size="sm" variant="default"><Link to={buildLoginRedirect(`/diaspora/imports/${id}/passport`)} data-testid="order-passport-signin">Sign in</Link></Button>}',
          )

          server = 'backend/server.js'
          replace_once(
              server,
              "app.get('/api/notifications/me', authorizeRole(['owner', 'dealer', 'admin']), async (req, res) => {\n  try {\n    const { data, error } = await supabase\n      .from('notification_queue')\n      .select('*')\n      .eq('recipient_id', req.userContext.id)\n      .order('created_at', { ascending: false })\n\n    if (error) throw error\n    res.json(data || [])\n  } catch (error) {",
              "app.get('/api/notifications/me', authorizeRole(['owner', 'dealer', 'mechanic', 'bank', 'insurance', 'government', 'admin', 'platform_admin', 'super_admin', 'reviewer']), async (req, res) => {\n  try {\n    const recipientId = req.userContext.id;\n    const [legacyResult, currentResult] = await Promise.all([\n      supabase\n        .from('notification_queue')\n        .select('*')\n        .eq('recipient_id', recipientId)\n        .order('created_at', { ascending: false }),\n      supabase\n        .from('notification_queue')\n        .select('*')\n        .eq('recipient_user_id', recipientId)\n        .order('created_at', { ascending: false }),\n    ]);\n\n    if (legacyResult.error) throw legacyResult.error;\n    if (currentResult.error) throw currentResult.error;\n\n    const byId = new Map();\n    for (const notification of [...(legacyResult.data || []), ...(currentResult.data || [])]) {\n      if (notification?.id) byId.set(notification.id, notification);\n    }\n    const data = [...byId.values()].sort((a, b) =>\n      new Date(b.created_at || 0).getTime() - new Date(a.created_at || 0).getTime()\n    );\n    res.json(data);\n  } catch (error) {",
          )

          Path('.github/workflows/issue-127-exact-source-patch.yml').unlink()
          PY

      - name: Verify patch integrity
        run: git diff --check

      - name: Commit bounded remediation patch
        shell: bash
        run: |
          git config user.name "carup-remediation-bot"
          git config user.email "carup-remediation-bot@users.noreply.github.com"
          git add web/src/pages/diaspora/DiasporaTrade.tsx \
                  web/src/pages/diaspora/DiasporaOrderPassport.tsx \
                  backend/server.js \
                  .github/workflows/issue-127-exact-source-patch.yml
          git commit -m "fix(diaspora): complete owner UAT core journey remediation"
          git push origin HEAD:fix/issue-127-uat-remediation
