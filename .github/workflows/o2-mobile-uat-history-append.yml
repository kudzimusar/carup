name: O2 Mobile UAT History Append

on:
  push:
    branches:
      - feat/operations-o2-people-compliance
    paths:
      - '.github/workflows/o2-mobile-uat-history-append.yml'

permissions:
  contents: write

jobs:
  append-history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/operations-o2-people-compliance
          fetch-depth: 0
      - name: Preserve failed mobile owner UAT history
        env:
          HISTORY_B64: 
        run: |
          DOC='docs/features/o2/CARUP_OPERATIONS_O2_OWNER_UAT_RESULT.md'
          if ! grep -Fq '# Owner mobile UAT — `a4b74fe7` (FAILED)' "$DOC"; then
            printf '%s' "$HISTORY_B64" | base64 --decode >> "$DOC"
          fi
          git diff --check
          if git diff --quiet -- "$DOC"; then
            echo 'History marker already present.'
            exit 0
          fi
          git config user.name 'CarUp O2 Mobile Remediation'
          git config user.email 'actions@users.noreply.github.com'
          git add "$DOC"
          git commit -m 'docs(o2): preserve failed a4b74fe7 mobile owner UAT'
          git push origin HEAD:feat/operations-o2-people-compliance
