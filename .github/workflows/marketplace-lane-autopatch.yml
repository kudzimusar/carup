name: Marketplace Lane One-Off Patch

on:
  push:
    branches:
      - feat/marketplace-reliability-reference-ux
    paths:
      - .github/workflows/marketplace-lane-autopatch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/marketplace-reliability-reference-ux
          fetch-depth: 0

      - name: Apply bounded Marketplace reliability edits
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          service = Path('backend/services/marketplace/listingSummaryService.js')
          src = service.read_text()

          helper_needle = """function summaryMatchesTags(summary, tags) {
            if (!tags || !tags.length) return true;
            return tags.every(tag => summary.marketplace_tags.includes(tag));
          }

          /**
           * Parse a `tag` filter"""
          helper_replacement = """function summaryMatchesTags(summary, tags) {
            if (!tags || !tags.length) return true;
            return tags.every(tag => summary.marketplace_tags.includes(tag));
          }

          /** Exact-match a canonical public text facet. Missing/withheld values never match. */
          export function summaryMatchesTextFacet(summary, value, field) {
            if (value === undefined || value === null || normalizeText(value) === '' || normalizeText(value) === 'all') return true;
            const actual = summary?.[field];
            if (!isRecordedValue(actual)) return false;
            return normalizeText(actual) === normalizeText(value);
          }

          /**
           * Location is provenance-gated. Match only recorded canonical location leaves, never a
           * raw registration/seller fallback. A composed full label may also match exactly.
           */
          export function summaryMatchesLocationFacet(summary, value) {
            if (value === undefined || value === null || normalizeText(value) === '' || normalizeText(value) === 'all') return true;
            if (summary?.location_state !== FIELD_STATES.RECORDED) return false;
            const wanted = normalizeText(value);
            if (normalizeText(summary?.location) === wanted) return true;
            const leaves = Object.values(summary?.claims?.location || {});
            return leaves.some(leaf => leaf?.state === FIELD_STATES.RECORDED && normalizeText(leaf?.value) === wanted);
          }

          /**
           * Parse a `tag` filter"""
          if helper_needle not in src:
              raise SystemExit('helper insertion anchor not found')
          src = src.replace(helper_needle, helper_replacement, 1)

          filter_needle = """  const filtered = summaries
            .filter(summary => summaryMatchesSearch(summary, params.q))
            .filter(summary => summaryMatchesCondition(summary, requestedCondition))
            .filter(summary => summaryMatchesTags(summary, requestedTags));

          const sorted = sortSummaries(filtered, params.sort);"""
          filter_replacement = """  // All buyer-facing facets operate on canonical public summaries BEFORE sort/limit. This avoids
            // the classic first-page bug where a valid vehicle outside the initial 48 could never be discovered.
            const filtered = summaries
              .filter(summary => summaryMatchesSearch(summary, params.q))
              .filter(summary => summaryMatchesCondition(summary, requestedCondition))
              .filter(summary => summaryMatchesTags(summary, requestedTags))
              .filter(summary => summaryMatchesLocationFacet(summary, params.location))
              .filter(summary => summaryMatchesTextFacet(summary, params.fuel, 'fuel_type'))
              .filter(summary => summaryMatchesTextFacet(summary, params.transmission, 'transmission'));

            const sorted = sortSummaries(filtered, params.sort);"""
          if filter_needle not in src:
              raise SystemExit('filter replacement anchor not found')
          src = src.replace(filter_needle, filter_replacement, 1)
          service.write_text(src)

          marketplace = Path('web/src/pages/Marketplace.tsx')
          web = marketplace.read_text()
          if 'ListingWithTrust' not in web:
              raise SystemExit('Marketplace type alias anchor not found')
          web = web.replace('ListingWithTrust', 'CanonicalListing')
          marketplace.write_text(web)
          PY

          git diff --check
          git diff -- backend/services/marketplace/listingSummaryService.js web/src/pages/Marketplace.tsx

      - name: Commit bounded patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "carup-marketplace-bot"
          git config user.email "actions@users.noreply.github.com"
          git add backend/services/marketplace/listingSummaryService.js web/src/pages/Marketplace.tsx
          git commit -m "fix(marketplace): apply canonical facets before result limiting"
          git push origin HEAD:feat/marketplace-reliability-reference-ux
