name: Diaspora Canonical Staging UAT

# Real Chromium acceptance against the CANONICAL staging aliases (owner-dispatched).
# Rotates the staging-only UAT identities in-job via the GitHub secret, so it is immune to
# concurrent identity rotations. Never touches production.
on:
  workflow_dispatch: {}

concurrency:
  # ONE staging project, ONE set of staging identities. Every workflow in this group rotates
  # `uat.reviewer@carup-staging.test` (and some also rotate the owner/buyer identity) to a fresh
  # per-run password and then uses it. A per-workflow group protects each workflow from ITSELF but
  # not from the others, so two of them could — and did — interleave: on 2026-09-03 the Serena UAT
  # rotated the reviewer at 02:59:48 and started its spec at 02:59:52, the Golden gate re-rotated the
  # same identity at 03:00:10, and the Serena run's reviewer login then failed 401 "Invalid
  # credentials" at 03:01:03. Run 33709565414. The product was fine; the gate was not.
  #
  # The shared resource is the staging PROJECT, which is global, so this group is deliberately NOT
  # keyed by PR or ref — keying it per-PR would recreate the same hole between branches.
  #
  # cancel-in-progress is false on purpose: these runs MUTATE shared staging state, and cancelling
  # one mid-flight leaves that state half-changed (a published listing, an unrestored credential),
  # which is a hazard this repository has already been bitten by. Queue, never cancel.
  group: carup-shared-staging-uat
  cancel-in-progress: false

jobs:
  canonical-staging-uat:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      STAGING_WEB_URL: https://staging.carup.dev
      STAGING_API_URL: https://api-staging.carup.dev/api
      STAGING_RUN_ID: canonical-${{ github.run_id }}
      DIASPORA_STAGING_DATABASE_URL: ${{ secrets.DIASPORA_STAGING_DATABASE_URL }}
      EXPECTED_STAGING_PROJECT_REF: eoyenigwevnxwwhyhaer
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Require the staging database operator secret
        run: |
          if [ -z "$DIASPORA_STAGING_DATABASE_URL" ]; then
            echo '::error::DIASPORA_STAGING_DATABASE_URL is not configured; deployed acceptance cannot run.'
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Freeze the exact candidate bundle for this run
        run: |
          html="$(curl --fail --silent --show-error --location "$STAGING_WEB_URL/")"
          bundle="$(printf '%s' "$html" | grep -oE 'index-[A-Za-z0-9_-]+\.js' | head -1)"
          if [ -z "$bundle" ]; then
            echo '::error::The canonical staging alias did not expose a Vite entry bundle.'
            exit 1
          fi
          echo "STAGING_EXPECTED_BUNDLE=$bundle" >> "$GITHUB_ENV"
          echo "Frozen the exact canonical staging bundle for this run: $bundle"

      - name: Rotate staging-only UAT identities for this run
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import crypto from 'node:crypto';
          import fs from 'node:fs';
          import pg from 'pg';

          const dbUrl = process.env.DIASPORA_STAGING_DATABASE_URL || '';
          const expectedRef = process.env.EXPECTED_STAGING_PROJECT_REF;
          if (!dbUrl.includes(expectedRef)) {
            throw new Error('Refusing identity setup: database URL is not the approved carup-staging project.');
          }

          const password = crypto.randomBytes(30).toString('base64url');
          const salt = crypto.randomBytes(16).toString('hex');
          const derived = await new Promise((resolve, reject) => {
            crypto.scrypt(password, salt, 64, (error, key) => error ? reject(error) : resolve(key));
          });
          const passwordHash = `scrypt:${salt}:${derived.toString('hex')}`;
          const identities = [
            ['uat.buyer@carup-staging.test', 'owner'],
            ['uat.seller@carup-staging.test', 'dealer'],
            ['uat.reviewer@carup-staging.test', 'admin'],
            ['uat.tenant-admin@carup-staging.test', 'admin'],
            ['uat.outsider@carup-staging.test', 'owner'],
          ];

          // Strip any sslmode query param: it would override the explicit ssl config below and make
          // pg verify Supabase's self-signed chain, failing the connection from CI runners.
          const cleanedDbUrl = dbUrl.replace(/([?&])sslmode=[^&]*&?/i, '$1').replace(/[?&]$/, '');
          const client = new pg.Client({ connectionString: cleanedDbUrl, ssl: { rejectUnauthorized: false } });
          await client.connect();
          try {
            await client.query('BEGIN');
            for (const [email, role] of identities) {
              const result = await client.query(
                'update public.users set password_hash = $1, role = $2 where email = $3 returning id',
                [passwordHash, role, email],
              );
              if (result.rowCount !== 1) throw new Error(`Missing staging UAT identity: ${email}`);
            }
            await client.query('COMMIT');
          } catch (error) {
            await client.query('ROLLBACK');
            throw error;
          } finally {
            await client.end();
          }

          const envNames = [
            'STAGING_UAT_BUYER_PASSWORD',
            'STAGING_UAT_SELLER_PASSWORD',
            'STAGING_UAT_REVIEWER_PASSWORD',
            'STAGING_UAT_TENANT_ADMIN_PASSWORD',
            'STAGING_UAT_OUTSIDER_PASSWORD',
          ];
          fs.appendFileSync(process.env.GITHUB_ENV, envNames.map((name) => `${name}=${password}`).join('\n') + '\n', { mode: 0o600 });
          console.log('Five staging-only UAT identities were rotated and role-verified without printing credentials.');
          NODE

      - name: Run deployed desktop and mobile Chromium acceptance
        run: npx playwright test --config=playwright.staging.config.ts

      - name: Upload deployed-UAT evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diaspora-canonical-staging-uat-${{ github.run_id }}
          path: |
            test-results/staging-env-truth.json
            test-results/staging-uat-results.json
            test-results/staging-uat-html
            test-results/staging-uat-artifacts
          if-no-files-found: warn
          retention-days: 14
