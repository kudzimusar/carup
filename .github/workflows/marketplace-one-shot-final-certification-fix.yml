name: Marketplace One-Shot Final Certification Fix

on:
  push:
    branches:
      - feat/marketplace-reliability-reference-ux
    paths:
      - '.github/workflows/marketplace-one-shot-final-certification-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch head
        uses: actions/checkout@v4
        with:
          ref: feat/marketplace-reliability-reference-ux
          fetch-depth: 0

      - name: Apply bounded final certification fixes
        run: python scripts/marketplace-one-shot-final-certification-fix.py

      - name: Validate bounded diff and remove one-shot machinery
        run: |
          rm .github/workflows/marketplace-one-shot-final-certification-fix.yml
          rm scripts/marketplace-one-shot-final-certification-fix.py
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' '.github/workflows/marketplace-one-shot-final-certification-fix.yml' 'scripts/marketplace-one-shot-final-certification-fix.py' 'web/e2e/marketplace-staging-certification.spec.ts' 'web/src/pages/VehicleDetail.tsx' | sort)"
          test "$changed" = "$expected"
          grep -F 'className="min-w-0 lg:col-span-2 space-y-6"' web/src/pages/VehicleDetail.tsx
          grep -F "golden private seller public profile" web/e2e/marketplace-staging-certification.spec.ts
          grep -F "mobile-horizontal-overflow.json" web/e2e/marketplace-staging-certification.spec.ts

      - name: Commit clean bounded tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/marketplace-one-shot-final-certification-fix.yml scripts/marketplace-one-shot-final-certification-fix.py web/src/pages/VehicleDetail.tsx web/e2e/marketplace-staging-certification.spec.ts
          git diff --cached --check
          git commit -m "fix(marketplace): close deployed certification blockers"
          git push origin HEAD:feat/marketplace-reliability-reference-ux
