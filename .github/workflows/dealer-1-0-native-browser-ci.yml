name: CarUp Dealership 1.0 — isolated native-PostgreSQL real-browser proof

# An actual CarUp Express + Vite runtime on GitHub's disposable localhost
# PostgreSQL/PostgREST plus real self-hosted Supabase Storage on a disposable
# filesystem and real ClamAV. No mocked responses, shared/production DB,
# Owner workbook, provider charges or real listings. Country/legal compliance
# and activated business operation remain separate certification gates.
on:
  push:
    branches: [feat/carup-dealer-1-0-unified-longrun]
    paths:
      - 'backend/services/dealer/**'
      - 'backend/routes/dealer*.js'
      - 'backend/scripts/dealership/**'
      - 'web/src/pages/Dealer*.tsx'
      - 'web/src/components/dealer/**'
      - 'web/src/App.tsx'
      - 'web/src/pages/dashboard/dealer/**'
      - 'web/tests/dealer-native-physical/**'
      - 'web/playwright.dealer-native-physical.config.ts'
      - 'database/migrations/*dealer*.sql'
      - '.github/workflows/dealer-1-0-native-browser-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/services/dealer/**'
      - 'backend/routes/dealer*.js'
      - 'backend/scripts/dealership/**'
      - 'web/src/pages/Dealer*.tsx'
      - 'web/src/components/dealer/**'
      - 'web/src/App.tsx'
      - 'web/src/pages/dashboard/dealer/**'
      - 'web/tests/dealer-native-physical/**'
      - 'web/playwright.dealer-native-physical.config.ts'
      - 'database/migrations/*dealer*.sql'
      - '.github/workflows/dealer-1-0-native-browser-ci.yml'

permissions:
  contents: read

concurrency:
  group: dealer-real-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-postgres-real-browser:
    name: Genuine CarUp browser · PostgreSQL 17 · fictional dealership only
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: dealer-ci-ephemeral-only
          POSTGRES_DB: carup_dealer_isolated_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d carup_dealer_isolated_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      NODE_ENV: test
      PGPASSWORD: dealer-ci-ephemeral-only
      DEALER_ISOLATED_POSTGRES_URL: postgresql://postgres@127.0.0.1:5432/carup_dealer_isolated_ci
      DEALER_BROWSER_LOCAL_JWT_SECRET: EXPLICITLY_FAKE_EPHEMERAL_CARUP_DEALER_BROWSER_CI_KEY_2026
    steps:
      - name: Checkout unmerged exact candidate (no persisted GitHub token)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install locked Node dependencies
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Establish actual isolated PostgreSQL migrations and fictional 104-source workbook
        shell: bash
        run: |
          set -euo pipefail
          node database/test/dealer_1_0_pglite_check.mjs > "${RUNNER_TEMP}/native-migration.log" 2>&1
          grep -q '^DEALER_NATIVE_POSTGRES_RESULT PASS:' "${RUNNER_TEMP}/native-migration.log"
          # IMPORTANT: the behavioural migration suite MUST NOT share business
          # state with the physical browser. Its negative tests activate a
          # fictional company whose stable organization ID would otherwise
          # rightfully block the browser's independent activation as an existing
          # organization (run 41808142464). Never weaken that production barrier.
          # This resets ONLY the guarded disposable loopback database after
          # SQL rollback/reapply evidence has been collected.
          node --input-type=module <<'DEALER_RESET_DB'
          import assert from 'node:assert/strict'
          import pg from 'pg'
          const dbUrl=process.env.DEALER_ISOLATED_POSTGRES_URL
          assert.ok(dbUrl,'GUARDED_DB_URL_REQUIRED')
          const u=new URL(dbUrl)
          assert.equal(u.protocol,'postgresql:')
          assert.equal(u.hostname,'127.0.0.1')
          assert.equal(u.pathname,'/carup_dealer_isolated_ci')
          assert.equal(u.search,'')
          assert.equal(u.hash,'')
          for(const key of ['SUPABASE_URL','DEALER_SEED_DATABASE_URL',
             'CARUP_DEALER_RESEARCH_XLSX']){
            assert.equal(process.env[key],undefined,'UNSAFE_RESET_ENV_'+key)
          }
          const maintenance=new pg.Client({
            connectionString:'postgresql://postgres@127.0.0.1:5432/postgres',
            application_name:'carup-dealer-ci-disposable-database-reset',
          })
          await maintenance.connect()
          try{
            const version=await maintenance.query('SHOW server_version_num')
            assert.ok(Number(version.rows[0].server_version_num)>=170000)
            await maintenance.query('DROP DATABASE carup_dealer_isolated_ci WITH (FORCE)')
            await maintenance.query('CREATE DATABASE carup_dealer_isolated_ci')
          }finally{await maintenance.end()}
          console.log('DEALER_ISOLATED_DB_RESET PASS: fresh loopback database, migration tests retained in CI logs; no production or shared DB')
          DEALER_RESET_DB
          if ! DEALER_NATIVE_SCHEMA_ONLY=1 node database/test/dealer_1_0_pglite_check.mjs > "${RUNNER_TEMP}/fresh-browser-schema.log" 2>&1; then
            echo 'DEALER_FRESH_SCHEMA_FAILED: isolated synthetic schema log follows'
            tail -n 100 "${RUNNER_TEMP}/fresh-browser-schema.log"
            exit 1
          fi
          grep -q '^DEALER_NATIVE_FRESH_BROWSER_SCHEMA PASS:' "${RUNNER_TEMP}/fresh-browser-schema.log"
          node backend/scripts/dealership/proveSynthetic104NativePostgres.mjs > "${RUNNER_TEMP}/synthetic-import.log" 2>&1
          grep -q '^DEALER_SYNTHETIC_104_NATIVE_RESULT PASS:' "${RUNNER_TEMP}/synthetic-import.log"
          node backend/scripts/dealership/prepareSyntheticBrowserFixture.mjs | tee "${RUNNER_TEMP}/browser-bootstrap.log"
          grep -q '^DEALER_BROWSER_SYNTHETIC_FIXTURE PASS:' "${RUNNER_TEMP}/browser-bootstrap.log"
          echo "DEALER_BROWSER_FIXTURE_JSON=${RUNNER_TEMP}/carup-dealer-browser-fixture.json" >> "${GITHUB_ENV}"
      - name: Install and qualify real ClamAV malware scanner
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq clamav clamav-freshclam
          sudo systemctl stop clamav-freshclam 2>/dev/null || true
          sudo freshclam --stdout
          printf 'CARUP FICTIONAL SAFE SCAN CONTENT\\n' | clamscan --no-summary - | grep -q 'OK$'
          echo 'DEALER_NATIVE_MALWARE_SCANNER_READY: signature-backed scan passed'
      - name: Install headless Chromium for physical viewport and role UAT
        shell: bash
        run: |
          set -euo pipefail
          cd web
          npx playwright install --with-deps chromium
      - name: Boot real native PG/PostgREST, Express, Vite and run browser tests
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name carup-dealer-ci-postgrest --network host \
            -e PGRST_DB_URI=postgresql://postgres@127.0.0.1:5432/carup_dealer_isolated_ci \
            -e PGPASSWORD="${PGPASSWORD}" \
            -e PGRST_DB_SCHEMAS=public \
            -e PGRST_DB_ANON_ROLE=anon \
            -e PGRST_JWT_SECRET="${DEALER_BROWSER_LOCAL_JWT_SECRET}" \
            -e PGRST_SERVER_HOST=127.0.0.1 \
            -e PGRST_SERVER_PORT=3004 \
            postgrest/postgrest:v12.2.8 >/dev/null
          node backend/scripts/dealership/runSyntheticLocalPostgrestBridge.mjs > "${RUNNER_TEMP}/postgrest-bridge.log" 2>&1 &
          BRIDGE_PID=$!
          set -a
          . "${RUNNER_TEMP}/carup-dealer-browser.env"
          set +a
          SUPABASE_URL=http://127.0.0.1:54321 NODE_ENV=development \
            JWT_SECRET="${DEALER_BROWSER_LOCAL_JWT_SECRET}" \
            CARUP_ENV=local CARUP_ALLOW_X_USER_ID_FALLBACK=false PORT=3001 \
            node backend/server.js > "${RUNNER_TEMP}/real-dealer-api.log" 2>&1 &
          API_PID=$!
          (
            cd web
            VITE_API_URL=http://127.0.0.1:3001/api \
              npm run dev -- --host 127.0.0.1 --port 5173 --strictPort
          ) > "${RUNNER_TEMP}/real-dealer-vite.log" 2>&1 &
          WEB_PID=$!
          cleanup(){
            code=$?
            if [ "${code}" -ne 0 ]; then
              echo 'PARTIAL_NATIVE_BROWSER_GATE_FAILED: inspect backend/frontend/runtime logs and evidence'
              for file in real-dealer-api.log real-dealer-vite.log postgrest-bridge.log; do
                echo "== ${file} (last 80 lines) =="
                tail -n 80 "${RUNNER_TEMP}/${file}" || true
              done
              docker logs --tail 80 carup-dealer-ci-postgrest || true
              docker logs --tail 80 carup-dealer-ci-storage || true
            fi
            kill "${BRIDGE_PID}" "${API_PID}" "${WEB_PID}" 2>/dev/null || true
            docker rm -f carup-dealer-ci-postgrest carup-dealer-ci-storage >/dev/null 2>&1 || true
            docker volume rm carup-dealer-ci-evidence >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          bash backend/scripts/dealership/startNativeBrowserStorage.sh
          for attempt in $(seq 1 75); do
            if curl -fsS 'http://127.0.0.1:3001/api/dealership/research' \
                > "${RUNNER_TEMP}/local-directory-read.json" 2>/dev/null; then
              break
            fi
            sleep 2
          done
          node - <<'NODE'
          const fs=require('node:fs')
          const directory=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/local-directory-read.json','utf8'))
          if(directory.total!==1||directory.entries?.[0]?.seed_dealer_id!=='ZW-DEAL-0001'
            ||directory.entries[0].business_verified!==false){
            // Public, fictional data only: diagnostic must not dump private sources or sessions.
            console.error('NATIVE_BROWSER_PUBLIC_RESPONSE_SHAPE',
              JSON.stringify({total:directory.total,entries:directory.entries?.map(e=>({
                id:e.seed_dealer_id,tier:e.tier,business_verified:e.business_verified
              })),keys:Object.keys(directory)}))
            throw Error('Native browser bootstrap did not return one real SQL-backed fictional prelisting')
          }
          console.log('NATIVE_BROWSER_API_DATA_READY: one reviewed fictional unclaimed profile; 103 still private')
          NODE
          # Cross-service integration smoke: existing CarUp navigation coverage
          # must not 500 merely because this native dealership fixture omitted
          # the canonical vehicle public-search columns. All VINs remain DRAFT,
          # so no coverage category may be activated or fabricated.
          curl --fail --silent --show-error             'http://127.0.0.1:3001/api/marketplace/nav-coverage'             > "${RUNNER_TEMP}/native-marketplace-navigation-coverage.json"
          node --input-type=module <<'DEALER_NAV_PROOF'
          import assert from 'node:assert/strict'
          import {readFileSync} from 'node:fs'
          const coverage=JSON.parse(readFileSync(
            process.env.RUNNER_TEMP+'/native-marketplace-navigation-coverage.json','utf8'))
          assert.ok(Number.isInteger(coverage.threshold)&&coverage.threshold>0)
          for(const group of ['categories','tags']){
            assert.ok(coverage[group]&&typeof coverage[group]==='object')
            for(const [key,value] of Object.entries(coverage[group])){
              assert.equal(value.count,0,group+'.'+key+' has no public real VIN')
              assert.equal(value.active,false,group+'.'+key+' must stay unavailable')
            }
          }
          console.log('DEALER_NATIVE_MARKETPLACE_NAV_COVERAGE PASS: genuine public Marketplace route reads canonical draft-only VIN baseline and returns zero eligible listings, no fake visibility')
          DEALER_NAV_PROOF
          curl -fsS http://127.0.0.1:5173/dealers >/dev/null
          # FIRST: physical prelisting, distinct claimant/reviewer, actual private
          # scanned document, claim approval, claim-specific XLSX and frozen draft.
          cd web
          DEALER_BROWSER_PHASE=prelegal npx playwright test \
            --config playwright.dealer-native-physical.config.ts \
            tests/dealer-native-physical/fictional-dealer-native-pg.pw.ts
          cd ..
          node backend/scripts/dealership/verifyNativeBrowserGoldenCustody.mjs
          echo 'DEALER_NATIVE_PRELEGAL_CUSTODY PASS: verified live app and real PostgreSQL, no country legal/tenant grant'
          # SECOND: simulate an EXPLICITLY FICTIONAL legally-approved country
          # policy only in the guarded, disposable CI database. This is NOT
          # a real Zimbabwe policy, legal signoff or authorized public launch.
          node backend/scripts/dealership/prepareSyntheticLegalBrowserPhase.mjs
          cd web
          DEALER_BROWSER_PHASE=synthetic-legal npx playwright test \
            --config playwright.dealer-native-physical.config.ts \
            tests/dealer-native-physical/synthetic-legal-activation.pw.ts
          cd ..
          node backend/scripts/dealership/verifyNativeFullSyntheticGoldenCustody.mjs
          echo 'DEALER_NATIVE_BROWSER_INTEGRATION_RESULT PASS: complete FICTIONAL browser/SQL lifecycle, real Storage and ClamAV, separate test reviewers and stable URL; actual legal policy, Owner XLSX, real inventory and public release NOT CLAIMED'
          # THIRD: only after a successful synthetic independent legal
          # activation, seed one private DRAFT fictional VIN and one
          # Marketplace enquiry. No real stock, money, legal licence or deal.
          node backend/scripts/dealership/prepareSyntheticOperationsFixture.mjs
          # Real Chromium, separate existing fictional member, original
          # owner's invitation -> consent -> canonical grant -> revocation.
          # Owner also reads scoped VIN and safely progresses canonical
          # Marketplace lead. Preserve a distinct third-phase trace.
          cd web
          DEALER_BROWSER_PHASE=synthetic-staff npx playwright test \
            --config playwright.dealer-native-physical.config.ts \
            tests/dealer-native-physical/synthetic-canonical-staff.pw.ts
          cd ..
          node backend/scripts/dealership/verifyNativeFictionalStaffCustody.mjs
          echo 'DEALER_NATIVE_CANONICAL_STAFF_RESULT PASS: real browser invitation/accept/revoke; member only, no seller/payment/owner escalation; fictional CI only'
          # FOURTH: one explicitly fictional transaction-linked buyer complaint,
          # buyer session distinct from dealer and platform reviewer, genuine
          # private PostgreSQL/escrow FK and password-gated immutable finding.
          cd web
          DEALER_BROWSER_PHASE=synthetic-feedback npx playwright test \
            --config playwright.dealer-native-physical.config.ts \
            tests/dealer-native-physical/synthetic-buyer-feedback.pw.ts
          cd ..
          node backend/scripts/dealership/verifyNativeFictionalBuyerFeedbackCustody.mjs
          echo 'DEALER_NATIVE_PRIVATE_BUYER_CASE_RESULT PASS: factual private canonical feedback and independent reviewer, no public stars or money mutation, FICTIONAL ONLY'
          # FIFTH: separate full-storefront public DISPLAY retraction after
          # the fictional positive journey. Canonical claim and tenant remain.
          cd web
          DEALER_BROWSER_PHASE=synthetic-retraction npx playwright test \
            --config playwright.dealer-native-physical.config.ts \
            tests/dealer-native-physical/synthetic-public-retraction.pw.ts
          cd ..
          node backend/scripts/dealership/verifyNativeFictionalPublicRetractionCustody.mjs
          echo 'DEALER_NATIVE_PUBLIC_RETRACTION_RESULT PASS: same URL safely downgraded, approved corporate claim preserved, no fake unclaimed or real dealer publication'
      - name: Preserve screenshots, traces and physical test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dealer-native-physical-${{ github.sha }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            web/test-results/
            web/playwright-report/
