name: OC-NATIVE LR2-B Conversation Object Continuity

on:
  push:
    branches:
      - feat/oc-native-lr2b-conversation-object-continuity
    paths:
      - 'mobile/**'
      - '.github/workflows/oc-native-lr2b-continuity.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oc-native-lr2b-${{ github.ref }}
  cancel-in-progress: true

env:
  LR2B_BASE_SHA: fe61163c3b24abbd40596b063204189a6efd37bc
  LR2B_BACKEND_SHA: 5b603d452aa5ca50fa95934da454a5a8ca802778
  LR2B_BACKEND_DEPLOYMENT: dpl_2ctFSxXieYvvwGE4iDmH2Ey1LvFC
  EXPO_PUBLIC_API_URL: https://carup-backend-staging-ilhu3leml-11-11.vercel.app
  LR2B_EXTERNAL_SENDS: disabled
  VERCEL_TOKEN_PRIMARY: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_TOKEN_FALLBACK: ${{ secrets.VERCEL_ACCESS_TOKEN }}

jobs:
  certify:
    name: LR2-B Exact-Head Continuity Certification
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Exact-head custody and R6-B-R1 preservation guard
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git cat-file -e "$LR2B_BASE_SHA^{commit}"
          test "$(git merge-base "$LR2B_BASE_SHA" HEAD)" = "$LR2B_BASE_SHA"
          git diff --check "$LR2B_BASE_SHA..HEAD"
          mapfile -t CHANGED < <(git diff --name-only "$LR2B_BASE_SHA..HEAD")
          test "${#CHANGED[@]}" -gt 0
          printf '%s\n' "${CHANGED[@]}"
          for file in "${CHANGED[@]}"; do
            case "$file" in
              mobile/*|.github/workflows/oc-native-lr2b-continuity.yml)
                ;;
              *)
                echo "::error::LR2-B changed unauthorized path: $file"
                exit 1
                ;;
            esac
          done
          if git diff --name-only "$LR2B_BASE_SHA..HEAD" | grep -Eq '^(backend|database|web)/'; then
            echo "::error::LR2-B must consume the accepted backend authority without backend/database/web mutation"
            exit 1
          fi

      - name: Resolve Vercel read-only runtime credential
        id: vercel-auth
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$VERCEL_TOKEN_PRIMARY" ]; then
            echo "token=$VERCEL_TOKEN_PRIMARY" >> "$GITHUB_OUTPUT"
            echo "available=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$VERCEL_TOKEN_FALLBACK" ]; then
            echo "token=$VERCEL_TOKEN_FALLBACK" >> "$GITHUB_OUTPUT"
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Accepted immutable backend is Vercel-auth protected and no repository read credential is available; runtime smoke is recorded as an external evidence gate, not a product failure."
          fi

      - name: Accepted backend immutable runtime smoke
        if: steps.vercel-auth.outputs.available == 'true'
        env:
          VERCEL_TOKEN: ${{ steps.vercel-auth.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$EXPO_PUBLIC_API_URL" = "https://carup-backend-staging-ilhu3leml-11-11.vercel.app"

          # The accepted immutable deployment is protected by Vercel Authentication.
          # Vercel CLI curl uses existing repository auth to cross deployment
          # protection read-only; it does not modify protection or create a deployment.
          health_code="$(npx --yes vercel@latest curl "$EXPO_PUBLIC_API_URL/health" \
            --token "$VERCEL_TOKEN" --scope pay-pass-project \
            --silent --show-error --output "$RUNNER_TEMP/health.json" --write-out '%{http_code}')"
          test "$health_code" = "200"

          set +e
          auth_code="$(npx --yes vercel@latest curl "$EXPO_PUBLIC_API_URL/api/communications/threads" \
            --token "$VERCEL_TOKEN" --scope pay-pass-project \
            --silent --show-error --output "$RUNNER_TEMP/threads-unauth.json" --write-out '%{http_code}')"
          curl_status=$?
          set -e
          case "$auth_code" in
            401|403) ;;
            *)
              echo "::error::Communications threads did not fail closed for an unauthenticated application request (HTTP $auth_code, command=$curl_status)"
              cat "$RUNNER_TEMP/threads-unauth.json" || true
              exit 1
              ;;
          esac

      - name: Record protected-runtime external gate
        if: steps.vercel-auth.outputs.available != 'true'
        shell: bash
        run: |
          set -euo pipefail
          test "$EXPO_PUBLIC_API_URL" = "https://carup-backend-staging-ilhu3leml-11-11.vercel.app"
          echo "::notice::LIVE_RUNTIME_SMOKE=BLOCKED_DEPLOYMENT_AUTH"
          echo "::notice::Deployment identity is frozen to $LR2B_BACKEND_DEPLOYMENT / $LR2B_BACKEND_SHA; no stale URL was substituted."

      - name: Mobile Vitest including LR2-B and R6-B-R1 regressions
        run: npm run test --workspace=mobile

      - name: Native deterministic suite
        run: npm run test:native --workspace=mobile

      - name: Native static suite
        run: npm run test:static --workspace=mobile

      - name: Mobile TypeScript
        run: npm run ts:check --workspace=mobile

      - name: Expo dependency compatibility
        working-directory: mobile
        run: npx expo install --check

      - name: Record LR2-B exact-head receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/lr2b-certification"
          {
            echo "task=OC-NATIVE-LR2-B"
            echo "candidate_sha=$(git rev-parse HEAD)"
            echo "accepted_native_base=$LR2B_BASE_SHA"
            echo "merge_base=$(git merge-base "$LR2B_BASE_SHA" HEAD)"
            echo "backend_sha=$LR2B_BACKEND_SHA"
            echo "backend_deployment=$LR2B_BACKEND_DEPLOYMENT"
            echo "backend_immutable_url=$EXPO_PUBLIC_API_URL"
            echo "external_sends=$LR2B_EXTERNAL_SENDS"
            echo "production_touched=NO"
            echo "migration_applied=NO"
            echo "staging_mutation=NO"
            if [ "${{ steps.vercel-auth.outputs.available }}" = "true" ]; then
              echo "live_runtime_smoke=ATTEMPTED"
            else
              echo "live_runtime_smoke=BLOCKED_DEPLOYMENT_AUTH"
            fi
          } > "$RUNNER_TEMP/lr2b-certification/custody.txt"
          git diff --name-only "$LR2B_BASE_SHA..HEAD" > "$RUNNER_TEMP/lr2b-certification/changed-files.txt"
          git log --oneline --reverse "$LR2B_BASE_SHA..HEAD" > "$RUNNER_TEMP/lr2b-certification/commit-lineage.txt"

      - name: Upload LR2-B certification receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oc-native-lr2b-certification-${{ github.sha }}
          path: ${{ runner.temp }}/lr2b-certification
          if-no-files-found: error
          retention-days: 30
