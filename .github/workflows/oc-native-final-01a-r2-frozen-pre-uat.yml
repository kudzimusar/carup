name: OC-NATIVE FINAL-01A-R2 Frozen-R1 Pre-UAT Proof

on:
  push:
    branches:
      - evidence/oc-native-final-01a-r2-pre-uat
    paths:
      - '.github/workflows/oc-native-final-01a-r2-frozen-pre-uat.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oc-native-final-01a-r2-frozen
  cancel-in-progress: true

env:
  CI: "true"
  NODE_ENV: test
  R1_ACCEPTED_SHA: 0c96deeab09277bd371e717f26535d9f33a5f43a
  EXPO_PUBLIC_API_URL: https://oc-native-final-isolated.invalid
  SUPABASE_URL: http://127.0.0.1:54321
  SUPABASE_SERVICE_ROLE_KEY: test-key
  SUPABASE_ANON_KEY: test-anon-key
  JWT_SECRET: test-jwt-secret
  ALLOW_OCR_MOCK: "true"
  BE2_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/carup_be2

jobs:
  native-certification:
    name: Frozen R1 · Native certification
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 0c96deeab09277bd371e717f26535d9f33a5f43a
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Frozen source custody
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$R1_ACCEPTED_SHA"
          test -z "$(git status --porcelain)"
      - run: npm ci
      - name: Mobile Vitest
        run: npm run test --workspace=mobile
      - name: Native deterministic suite
        run: npm run test:native --workspace=mobile
      - name: Static Native auth/navigation suite
        run: npm run test:static --workspace=mobile
      - name: Mobile TypeScript
        run: npm run ts:check --workspace=mobile
      - name: Expo dependency compatibility
        working-directory: mobile
        run: npx expo install --check
      - name: Expo configuration validation
        shell: bash
        run: |
          set -euo pipefail
          cd mobile
          npx expo config --type public --json > "$RUNNER_TEMP/expo-config.json"
          node - "$RUNNER_TEMP/expo-config.json" <<'NODE'
          const fs = require('fs');
          const p = process.argv[2];
          const j = JSON.parse(fs.readFileSync(p, 'utf8'));
          if (j.name !== 'CarUp') throw new Error('Unexpected Expo app name');
          if (j.android?.package !== 'com.carup.mobile') throw new Error('Unexpected Android applicationId');
          if (j.scheme !== 'carup') throw new Error('Unexpected app scheme');
          if (j.sdkVersion !== '54.0.0') throw new Error('Unexpected Expo SDK');
          console.log(JSON.stringify({name:j.name, package:j.android.package, scheme:j.scheme, sdkVersion:j.sdkVersion, version:j.version}, null, 2));
          NODE
      - name: True native authority + session cleanup proof
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('mobile/package.json', 'utf8'));
          const app = JSON.parse(fs.readFileSync('mobile/app.json', 'utf8'));
          const eas = JSON.parse(fs.readFileSync('mobile/eas.json', 'utf8'));
          if (pkg.main !== 'expo-router/entry') throw new Error('Expo Router entry missing');
          if (pkg.dependencies.expo !== '~54.0.37') throw new Error('Expo dependency authority changed');
          if (pkg.dependencies['react-native'] !== '0.81.5') throw new Error('React Native authority changed');
          if (!pkg.dependencies['expo-secure-store']) throw new Error('SecureStore dependency missing');
          if (!pkg.dependencies['expo-router']) throw new Error('Expo Router dependency missing');
          if (app.expo.android.package !== 'com.carup.mobile') throw new Error('Android package changed');
          if (eas.build?.['android-device']?.distribution !== 'internal') throw new Error('android-device profile is not internal');
          if (eas.build?.['android-device']?.android?.buildType !== 'apk') throw new Error('android-device profile is not APK');
          for (const dep of ['@capacitor/core','@capacitor/android','react-native-webview']) {
            if (pkg.dependencies?.[dep] || pkg.devDependencies?.[dep]) throw new Error('Wrapper dependency present: '+dep);
          }
          NODE
          grep -Fq "SecureStore.getItemAsync" mobile/store/authStore.ts
          grep -Fq "SecureStore.deleteItemAsync" mobile/store/authStore.ts
          grep -Fq "clearIdentityQueryCache()" mobile/store/authStore.ts
          grep -Fq "revokeCurrentServerSession" mobile/store/authStore.ts
          grep -Fq "authenticationMethod !== 'session'" backend/services/ownership/ownedVehicleAccessService.js
          if grep -R -E -n --include='*.ts' --include='*.tsx' --include='*.js'             'from ["'"'"']react-native-webview["'"'"']|require\(["'"'"']react-native-webview["'"'"']\)|@capacitor|TrustedWebActivity|androidbrowserhelper' mobile; then
            echo "::error::Web-wrapper implementation detected"
            exit 1
          fi

  focused-security-continuity:
    name: Frozen R1 · AUTH-05 + R6 + BE1 + BE2
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: carup_be2
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d carup_be2"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 0c96deeab09277bd371e717f26535d9f33a5f43a
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Frozen source custody
        run: test "$(git rev-parse HEAD)" = "$R1_ACCEPTED_SHA"
      - run: npm ci
      - name: AUTH-05 focused authority
        run: |
          node --test             backend/tests/ca-k3-auth-05-session-authority.test.js             backend/tests/ca-k3-auth-05-atomic-registration.test.js             backend/tests/auth-register-privilege.test.js             backend/tests/o2-x3-authentication-assurance.test.js
      - name: R6 current-session logout
        run: |
          node --test             backend/tests/r6a-current-session-logout.test.js             backend/tests/auth-session-row.test.js
      - name: BE1 ownership to Garage continuity
        run: |
          node --test backend/tests/lr2c-be1-ownership-continuity.test.js
          node --test backend/tests/service-network-s9-garage-surfaces.test.js
      - name: BE2 transaction ownership lineage
        run: |
          node --test backend/tests/lr2c-be2-transaction-transfer-lineage.test.js
          node database/test/lr2c_be2_transaction_transfer_postgres_check.mjs
      - name: Consequential ownership/session regressions
        run: |
          node --test backend/tests/passport-v16-ownership-authority.test.js
          node --test backend/tests/o2-transfer-authority-supersession.test.js
          node --test backend/tests/oc5j-ownership-transfer-refusals.test.js
          node --test backend/tests/issue164-phase6-session-governance-auth.test.js

  android-pre-uat-package:
    name: Frozen R1 · Android true Native package/install/launch
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 0c96deeab09277bd371e717f26535d9f33a5f43a
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Frozen source custody
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$R1_ACCEPTED_SHA"
          test -z "$(git status --porcelain)"
      - run: npm ci
      - name: Prebuild Android from Expo authority
        shell: bash
        run: |
          set -euo pipefail
          cd mobile
          npx expo config --type public --json > "$RUNNER_TEMP/expo-config-build.json"
          npx expo prebuild --platform android --clean --no-install
          MAIN_ACTIVITY="$(find android/app/src/main/java -type f \( -name 'MainActivity.kt' -o -name 'MainActivity.java' \) -print -quit)"
          test -n "$MAIN_ACTIVITY"
          grep -Eq 'ReactActivity' "$MAIN_ACTIVITY"
          if grep -R -Eiq 'Capacitor|TrustedWebActivity|androidbrowserhelper|android\.webkit\.WebView' android/app/src/main; then
            echo "::error::Generated Android app contains a web-wrapper/TWA/Capacitor indicator"
            exit 1
          fi
      - name: Enable KVM
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build, install, launch and recustody frozen R1 APK
        uses: reactivecircus/android-emulator-runner@v2
        env:
          R2_ANDROID_SCRIPT: |
            set -euo pipefail
            OUT="$RUNNER_TEMP/oc-native-r2-frozen"
            mkdir -p "$OUT"
            SOURCE_SHA="$(git rev-parse HEAD)"
            test "$SOURCE_SHA" = "$R1_ACCEPTED_SHA"
            DEVICE_ID="$(adb devices | awk 'NR>1 && $2=="device"{print $1; exit}')"
            test -n "$DEVICE_ID" || { echo "::error::No Android emulator"; exit 1; }

            cd mobile/android
            ./gradlew assembleRelease --no-daemon

            APK="$(find app/build/outputs/apk/release -name '*.apk' -print -quit)"
            test -n "$APK" || { echo "::error::No Android release APK"; exit 1; }
            cp "$APK" "$OUT/carup-r2-pre-uat-$SOURCE_SHA.apk"
            sha256sum "$OUT/carup-r2-pre-uat-$SOURCE_SHA.apk" > "$OUT/apk-sha256.txt"
            PACKAGE_NAME="com.carup.mobile"

            BUNDLE="$(find app/build -type f -name 'index.android.bundle' -print -quit)"
            test -n "$BUNDLE" || { echo "::error::React Native release bundle not found"; exit 1; }
            grep -aF "$EXPO_PUBLIC_API_URL" "$BUNDLE" > "$OUT/api-base-binary-proof.txt"

            adb uninstall "$PACKAGE_NAME" >/dev/null 2>&1 || true
            adb install "$APK"
            adb shell pm path "$PACKAGE_NAME" | tee "$OUT/install-proof.txt"
            adb shell dumpsys package "$PACKAGE_NAME" > "$OUT/package-dumpsys.txt"
            VERSION_CODE="$(sed -n 's/.*versionCode=\([0-9][0-9]*\).*/\1/p' "$OUT/package-dumpsys.txt" | head -n1)"
            VERSION_NAME="$(sed -n 's/.*versionName=\([^[:space:]]*\).*/\1/p' "$OUT/package-dumpsys.txt" | head -n1)"
            test -n "$VERSION_CODE"
            test -n "$VERSION_NAME"
            adb shell pm clear "$PACKAGE_NAME" >/dev/null

            LAUNCH_COMPONENT="$(adb shell cmd package resolve-activity --brief -a android.intent.action.MAIN -c android.intent.category.LAUNCHER "$PACKAGE_NAME" | tr -d '\r' | tail -n1)"
            case "$LAUNCH_COMPONENT" in com.carup.mobile/*) ;; *) echo "::error::Invalid launcher $LAUNCH_COMPONENT"; exit 1;; esac

            assert_foreground() {
              local label="$1"
              local resumed
              resumed="$(adb shell dumpsys activity activities | tr -d '\r' | grep -E -m1 'mResumedActivity|topResumedActivity' || true)"
              echo "$label: $resumed" >> "$OUT/foreground-proof.txt"
              [[ "$resumed" == *"com.carup.mobile/"* ]] || { echo "::error::CarUp is not foreground for $label: $resumed"; exit 1; }
              [[ "$resumed" != *"com.android.chrome/"* ]] || { echo "::error::Browser shell detected"; exit 1; }
            }

            dump_ui() {
              local name="$1"
              adb shell uiautomator dump /sdcard/window.xml >/dev/null
              adb pull /sdcard/window.xml "$OUT/$name.xml" >/dev/null
            }

            adb logcat -c
            adb shell am force-stop "$PACKAGE_NAME"
            adb shell am start -W -n "$LAUNCH_COMPONENT" | tee "$OUT/cold-launch.txt"
            sleep 5
            assert_foreground cold-launch
            test -n "$(adb shell pidof "$PACKAGE_NAME" | tr -d '\r')"

            adb shell am start -W -a android.intent.action.VIEW -d "carup://login" "$PACKAGE_NAME" | tee "$OUT/login-deeplink.txt"
            for i in $(seq 1 20); do
              dump_ui login
              if grep -Fq 'Sign in to CarUp' "$OUT/login.xml"; then break; fi
              sleep 1
            done
            grep -Fq 'Sign in to CarUp' "$OUT/login.xml"
            grep -Fq 'Email' "$OUT/login.xml"
            grep -Fq 'Password' "$OUT/login.xml"
            assert_foreground login-route
            adb exec-out screencap -p > "$OUT/login.png"

            adb shell am start -W -a android.intent.action.VIEW -d "carup://register" "$PACKAGE_NAME" | tee "$OUT/register-deeplink.txt"
            for i in $(seq 1 20); do
              dump_ui register
              if grep -Fq 'Create Account' "$OUT/register.xml"; then break; fi
              sleep 1
            done
            grep -Fq 'Create Account' "$OUT/register.xml"
            grep -Fqi 'EMAIL ADDRESS' "$OUT/register.xml"
            grep -Fqi 'PASSWORD' "$OUT/register.xml"
            assert_foreground register-route
            adb exec-out screencap -p > "$OUT/register.png"

            adb shell input keyevent KEYCODE_HOME
            sleep 2
            adb shell am start -W -n "$LAUNCH_COMPONENT" | tee "$OUT/foreground-resume.txt"
            sleep 3
            assert_foreground foreground-resume

            adb shell am force-stop "$PACKAGE_NAME"
            adb shell am start -W -n "$LAUNCH_COMPONENT" | tee "$OUT/restart.txt"
            sleep 3
            assert_foreground full-restart
            test -n "$(adb shell pidof "$PACKAGE_NAME" | tr -d '\r')"

            adb shell am start -W -a android.intent.action.VIEW -d "carup://login" "$PACKAGE_NAME" >/dev/null
            sleep 2
            PID="$(adb shell pidof "$PACKAGE_NAME" | tr -d '\r')"
            test -n "$PID"
            adb logcat --pid="$PID" -d > "$OUT/carup-logcat.txt" || true
            if grep -Eiq 'Native module.*SecureStore.*(not found|missing)|Failed to initialize secure auth store|FATAL EXCEPTION|AndroidRuntime: FATAL' "$OUT/carup-logcat.txt"; then
              echo "::error::Secure session/runtime initialization failure detected"
              cat "$OUT/carup-logcat.txt"
              exit 1
            fi

            {
              echo "classification=PRE_UAT_NATIVE_BUILD"
              echo "source_sha=$SOURCE_SHA"
              echo "workflow_sha=$GITHUB_SHA"
              echo "r1_parent=$R1_ACCEPTED_SHA"
              echo "build_profile=github-frozen-r1-pre-uat-release-apk"
              echo "eas_profile_reference=android-device"
              echo "builder=expo-prebuild+gradle-assembleRelease"
              echo "application_id=$PACKAGE_NAME"
              echo "version=$VERSION_NAME"
              echo "version_code=$VERSION_CODE"
              echo "artifact_type=APK"
              echo "api_base=$EXPO_PUBLIC_API_URL"
              echo "api_base_baked_into_bundle=YES"
              echo "production_touched=NO"
              echo "owner_credentials_used=NO"
              echo "canonical_staging_mutated=NO"
              echo "device=$(adb shell getprop ro.product.model | tr -d '\r')"
              echo "android_api=$(adb shell getprop ro.build.version.sdk | tr -d '\r')"
              echo "launcher_component=$LAUNCH_COMPONENT"
            } > "$OUT/custody.txt"
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          target: default
          disable-animations: true
          script: bash -c "$R2_ANDROID_SCRIPT"
      - name: Upload frozen R1 PRE-UAT APK + runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oc-native-final-01a-r2-frozen-r1
          path: ${{ runner.temp }}/oc-native-r2-frozen
          if-no-files-found: error
          retention-days: 30
