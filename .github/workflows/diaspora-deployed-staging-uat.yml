name: Diaspora Deployed Staging UAT

# Real Chromium acceptance against the CURRENT branch's paired Vercel previews.
# This workflow never touches production. Canonical staging-alias promotion is a separate
# release gate after this immutable candidate proves green.
#
# ── Why this file was rewritten ────────────────────────────────────────────
# It used to be pinned to `github.head_ref == 'claude/diaspora-phases-8-10-production-program'`,
# with hardcoded `STAGING_WEB_URL`/`STAGING_API_URL` belonging to a DIFFERENT Vercel project
# (`pay-pass-project`). That branch is long dead, so the job's `if:` was false on every pull request
# and the workflow reported `skipped` — a green tick, for months, for a gate that had certified
# nothing. It is the exact hazard the programme already recorded: a branch can be green for weeks
# while a gate it never triggers is dead.
#
# Replacing one hardcoded branch with another would reproduce the defect on a slower clock. The pair
# is now resolved from the governed manifests the rest of Trade OS already uses
# (`web/preview-frontend-pairing.json` + `web/preview-backend-pairing.json`), and every way the
# resolution can be wrong is a NAMED refusal in `scripts/ci/resolve-governed-preview-pair.mjs` —
# ungoverned branch, production origin, stale frontend, stale backend, unpaired frontend, a frontend
# talking to another branch's backend, and the wrong staging project. Those refusals are unit-tested
# in `backend/tests/ci-governed-preview-pair.test.js`, because a refusal nobody can break is not a
# gate.
#
# A branch with no governed pair FAILS here. It does not skip.
on:
  pull_request:
    paths:
      - '.github/workflows/diaspora-deployed-staging-uat.yml'
      - 'scripts/ci/resolve-governed-preview-pair.mjs'
      - 'web/preview-frontend-pairing.json'
      - 'web/preview-backend-pairing.json'
      - 'backend/**'
      - 'database/**'
      - 'playwright.staging.config.ts'
      - 'tests/agents/**'
      - 'web/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch: {}

permissions:
  contents: read

# ── The shared staging lock ────────────────────────────────────────────────
# Every workflow that drives THIS branch's preview backend shares this group, so certification runs
# QUEUE instead of colliding. The repaired gate's real workload rate-limited Marketplace Reference
# Regression into 429s when the two overlapped — CI scheduling contention, not a product defect, and
# this is where it is fixed.
#
# The key is the PREVIEW IDENTITY (the branch), so independent branches with their own preview
# deployments still run in parallel. `cancel-in-progress: false` because a certification run must
# never cancel another valid certification.
concurrency:
  group: staging-preview-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  # ── Sharded by Playwright project, run SERIALLY ──────────────────────────
  # The single-job packaging could not honestly be green: chromium alone measures ~29.7m against a
  # 35-minute ceiling, and all three projects ran in one job. Coverage is unchanged — same testMatch,
  # same specs, same assertions — and the aggregate below requires ALL THREE.
  #
  # Serial rather than parallel because the journeys mutate shared staging state; the gate has
  # already proved that.
  chromium:
    name: Chromium
    uses: ./.github/workflows/diaspora-deployed-staging-shard.yml
    with:
      project: chromium
      expected_head_sha: ${{ github.event.pull_request.head.sha || github.sha }}
      candidate_branch: ${{ github.event.pull_request.head.ref || github.ref_name }}
      staging_run_id: seller-${{ github.run_id }}-${{ github.run_attempt }}
    secrets: inherit

  tablet:
    name: Tablet
    needs: chromium
    if: always() && needs.chromium.result != 'cancelled'
    uses: ./.github/workflows/diaspora-deployed-staging-shard.yml
    with:
      project: tablet-chromium
      expected_head_sha: ${{ github.event.pull_request.head.sha || github.sha }}
      candidate_branch: ${{ github.event.pull_request.head.ref || github.ref_name }}
      staging_run_id: seller-${{ github.run_id }}-${{ github.run_attempt }}
    secrets: inherit

  mobile:
    name: Mobile
    needs: tablet
    if: always() && needs.tablet.result != 'cancelled'
    uses: ./.github/workflows/diaspora-deployed-staging-shard.yml
    with:
      project: mobile-chromium
      expected_head_sha: ${{ github.event.pull_request.head.sha || github.sha }}
      candidate_branch: ${{ github.event.pull_request.head.ref || github.ref_name }}
      staging_run_id: seller-${{ github.run_id }}-${{ github.run_attempt }}
    secrets: inherit

  aggregate:
    name: Aggregate
    # THE programme gate. One green viewport is not enough — and three green shards are only a pass
    # if they certified the SAME candidate against the SAME pairing.
    needs: [chromium, tablet, mobile]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Every shard must have SUCCEEDED
        run: |
          echo "chromium=${{ needs.chromium.result }} tablet=${{ needs.tablet.result }} mobile=${{ needs.mobile.result }}"
          fail=0
          for r in "${{ needs.chromium.result }}" "${{ needs.tablet.result }}" "${{ needs.mobile.result }}"; do
            [ "$r" = "success" ] || fail=1
          done
          if [ "$fail" = "1" ]; then
            echo '::error::The deployed-staging aggregate requires Chromium, Tablet AND Mobile to succeed.'
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          pattern: staging-pairing-*
          path: pairing-records

      - name: Every shard must have certified the SAME candidate and pairing
        run: node scripts/ci/assert-staging-shards-agree.mjs pairing-records chromium tablet-chromium mobile-chromium
