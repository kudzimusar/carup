name: Diaspora Deployed Staging UAT

# Real Chromium acceptance against the CURRENT branch's paired Vercel previews.
# This workflow never touches production. Canonical staging-alias promotion is a separate
# release gate after this immutable candidate proves green.
#
# ── Why this file was rewritten ────────────────────────────────────────────
# It used to be pinned to `github.head_ref == 'claude/diaspora-phases-8-10-production-program'`,
# with hardcoded `STAGING_WEB_URL`/`STAGING_API_URL` belonging to a DIFFERENT Vercel project
# (`pay-pass-project`). That branch is long dead, so the job's `if:` was false on every pull request
# and the workflow reported `skipped` — a green tick, for months, for a gate that had certified
# nothing. It is the exact hazard the programme already recorded: a branch can be green for weeks
# while a gate it never triggers is dead.
#
# Replacing one hardcoded branch with another would reproduce the defect on a slower clock. The pair
# is now resolved from the governed manifests the rest of Trade OS already uses
# (`web/preview-frontend-pairing.json` + `web/preview-backend-pairing.json`), and every way the
# resolution can be wrong is a NAMED refusal in `scripts/ci/resolve-governed-preview-pair.mjs` —
# ungoverned branch, production origin, stale frontend, stale backend, unpaired frontend, a frontend
# talking to another branch's backend, and the wrong staging project. Those refusals are unit-tested
# in `backend/tests/ci-governed-preview-pair.test.js`, because a refusal nobody can break is not a
# gate.
#
# A branch with no governed pair FAILS here. It does not skip.
on:
  pull_request:
    paths:
      - '.github/workflows/diaspora-deployed-staging-uat.yml'
      - 'scripts/ci/resolve-governed-preview-pair.mjs'
      - 'web/preview-frontend-pairing.json'
      - 'web/preview-backend-pairing.json'
      - 'backend/**'
      - 'database/**'
      - 'playwright.staging.config.ts'
      - 'tests/agents/**'
      - 'web/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: diaspora-deployed-staging-uat-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: false

jobs:
  deployed-staging-uat:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      CANDIDATE_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
      # `seller-<digits>-<digits>` is a CONTRACT, not a label. `marketplaceRoutes.js` only honours a
      # `fixture_scope` matching /^seller-[0-9]+-[0-9]+$/, and only on a preview deployment — that is
      # how Seller automation listings are kept out of the public Marketplace. Spec 38 publishes a
      # vehicle and then asserts it is findable with `fixture_scope=<run id>`; under the old
      # `diaspora-…` prefix the scope was rejected, the listing stayed correctly hidden, and the spec
      # could never pass in this gate however healthy the product was.
      STAGING_RUN_ID: seller-${{ github.run_id }}-${{ github.run_attempt }}
      DIASPORA_STAGING_DATABASE_URL: ${{ secrets.DIASPORA_STAGING_DATABASE_URL }}
      EXPECTED_STAGING_PROJECT_REF: eoyenigwevnxwwhyhaer
    steps:
      - name: Checkout the exact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}

      # A PR build is a detached merge commit with no branch name, so the checked-out HEAD is not
      # automatically the candidate. Assert it, rather than assuming the shape.
      - name: Assert the exact candidate checkout
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Require the staging database operator secret
        run: |
          if [ -z "$DIASPORA_STAGING_DATABASE_URL" ]; then
            echo '::error::DIASPORA_STAGING_DATABASE_URL is not configured; deployed acceptance cannot run.'
            exit 1
          fi

      # Resolves the governed pair AND waits for both deployments to report the candidate SHA with
      # `unpaired:false`. Refuses by name on every failure; exports STAGING_WEB_URL/STAGING_API_URL.
      - name: Resolve and prove the governed exact-head preview pair
        run: node scripts/ci/resolve-governed-preview-pair.mjs

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Freeze the exact candidate bundle for this run
        run: |
          html="$(curl --fail --silent --show-error --location "$STAGING_WEB_URL/")"
          bundle="$(printf '%s' "$html" | grep -oE 'index-[A-Za-z0-9_-]+\.js' | head -1)"
          if [ -z "$bundle" ]; then
            echo '::error::The paired staging preview did not expose a Vite entry bundle.'
            exit 1
          fi
          echo "STAGING_EXPECTED_BUNDLE=$bundle" >> "$GITHUB_ENV"
          echo "Frozen the exact candidate bundle for this run: $bundle"

      - name: Rotate staging-only UAT identities for this run
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import crypto from 'node:crypto';
          import fs from 'node:fs';
          import pg from 'pg';

          const dbUrl = process.env.DIASPORA_STAGING_DATABASE_URL || '';
          const expectedRef = process.env.EXPECTED_STAGING_PROJECT_REF;
          if (!dbUrl.includes(expectedRef)) {
            throw new Error('Refusing identity setup: database URL is not the approved carup-staging project.');
          }

          const password = crypto.randomBytes(30).toString('base64url');
          const salt = crypto.randomBytes(16).toString('hex');
          const derived = await new Promise((resolve, reject) => {
            crypto.scrypt(password, salt, 64, (error, key) => error ? reject(error) : resolve(key));
          });
          const passwordHash = `scrypt:${salt}:${derived.toString('hex')}`;
          // The five original UAT identities, PLUS the ones the additive Trade OS specs need.
          // Specs 45 (T5 container demo) and 46 (T2 Request Quotes) were added to this config's
          // testMatch without this step being widened, so they threw
          // "TRADEOS_*_PASSWORD is not exported" on their first real action — 2 of spec 46's 15
          // tests even attempted. Provisioning them is strictly MORE certification, not less.
          const identities = [
            ['uat.buyer@carup-staging.test', 'owner'],
            ['uat.seller@carup-staging.test', 'dealer'],
            ['uat.reviewer@carup-staging.test', 'admin'],
            ['uat.tenant-admin@carup-staging.test', 'admin'],
            ['uat.outsider@carup-staging.test', 'owner'],
            ['tradeos.operator@carup-staging.test', 'owner'],
            ['tradeos.outsider@carup-staging.test', 'owner'],
            ['tradeos.participant.a@carup-staging.test', 'owner'],
            ['tradeos.participant.b@carup-staging.test', 'owner'],
            ['tradeos.rfq-buyer@carup-staging.test', 'owner'],
            ['tradeos.rfq-supplier@carup-staging.test', 'dealer'],
          ];

          // Strip any sslmode query param: it would override the explicit ssl config below and make
          // pg verify Supabase's self-signed chain, failing the connection from CI runners.
          const cleanedDbUrl = dbUrl.replace(/([?&])sslmode=[^&]*&?/i, '$1').replace(/[?&]$/, '');
          const client = new pg.Client({ connectionString: cleanedDbUrl, ssl: { rejectUnauthorized: false } });
          await client.connect();
          try {
            await client.query('BEGIN');
            for (const [email, role] of identities) {
              const result = await client.query(
                'update public.users set password_hash = $1, role = $2 where email = $3 returning id',
                [passwordHash, role, email],
              );
              if (result.rowCount !== 1) throw new Error(`Missing staging UAT identity: ${email}`);
            }
            await client.query('COMMIT');
          } catch (error) {
            await client.query('ROLLBACK');
            throw error;
          } finally {
            await client.end();
          }

          const envNames = [
            'STAGING_UAT_BUYER_PASSWORD',
            'STAGING_UAT_SELLER_PASSWORD',
            'STAGING_UAT_REVIEWER_PASSWORD',
            'STAGING_UAT_TENANT_ADMIN_PASSWORD',
            'STAGING_UAT_OUTSIDER_PASSWORD',
            'TRADEOS_UAT_OPERATOR_PASSWORD',
            'TRADEOS_UAT_OUTSIDER_PASSWORD',
            'TRADEOS_UAT_PARTICIPANT_A_PASSWORD',
            'TRADEOS_UAT_PARTICIPANT_B_PASSWORD',
            'TRADEOS_RFQ_BUYER_PASSWORD',
            'TRADEOS_RFQ_SUPPLIER_PASSWORD',
          ];
          fs.appendFileSync(process.env.GITHUB_ENV, envNames.map((name) => `${name}=${password}`).join('\n') + '\n', { mode: 0o600 });
          console.log('Five staging-only UAT identities were rotated and role-verified without printing credentials.');
          NODE

      - name: Run deployed desktop and mobile Chromium acceptance
        run: npx playwright test --config=playwright.staging.config.ts

      - name: Upload deployed-UAT evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diaspora-deployed-staging-uat-${{ github.run_id }}
          path: |
            test-results/staging-env-truth.json
            test-results/staging-uat-results.json
            test-results/staging-uat-html
            test-results/staging-uat-artifacts
          if-no-files-found: warn
          retention-days: 14
