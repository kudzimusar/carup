          Path('web/src/lib/authorizedPortalRoles.ts').write_text(r'''import type { UserRole } from '@shared/types'

const PORTAL_ROLES = new Set<UserRole>([
  'owner',
  'dealer',
  'mechanic',
  'bank',
  'insurance',
  'government',
  'admin',
])

/**
 * Return only the active role already established by the authenticated session.
 *
 * There is currently no server response that supplies verified alternate role + tenant pairs.
 * Never infer them from localStorage or an undeclared `authorized_roles` property. The UI therefore
 * fails closed and hides role switching until a future backend contract returns governed options.
 */
export function getAuthorizedPortalRoles(
  user: { role?: UserRole | null } | null | undefined,
): UserRole[] {
  return user?.role && PORTAL_ROLES.has(user.role) ? [user.role] : []
}
''')
