          # Issue #127 second independent regression audit

          The first remediation conclusion was reopened rather than trusted.

          ## Additional defects found and corrected

          1. Notification responses and snapshots were not keyed to the authenticated user. A stale request or an account switch could display a previous account's notification data.
          2. The client validated `/auth/me` but discarded the authoritative returned user.
          3. `/auth/me` returned the base database role rather than the active role and tenant recorded in the session.
          4. Role-selection UI trusted an undeclared `authorized_roles` property that no backend endpoint supplies and that local storage could fabricate.
          5. The legacy notification compatibility query did not require `recipient_user_id IS NULL`, so a malformed row with conflicting recipient columns could be visible to two accounts.
          6. The role-switch route selected and returned the complete user row rather than an explicit safe projection.

