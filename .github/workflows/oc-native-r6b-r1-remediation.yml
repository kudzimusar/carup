name: OC-NATIVE R6-B-R1 Remediation

on:
  push:
    branches:
      - fix/oc-native-r6b-r1-authenticated-uat
    paths:
      - 'mobile/**'
      - '.github/workflows/oc-native-r6b-r1-remediation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oc-native-r6b-r1-${{ github.ref }}
  cancel-in-progress: true

env:
  R6B_R1_START_SHA: 1dd189b98d0590bd7b92a0533f376fb446a2bb9a
  EXPO_PUBLIC_API_URL: https://carup-backend-staging-9ahbpkp2a-11-11.vercel.app
  R6B_R1_BACKEND_SHA: 5b603d452aa5ca50fa95934da454a5a8ca802778
  R6B_R1_BACKEND_DEPLOYMENT: dpl_2ctFSxXieYvvwGE4iDmH2Ey1LvFC
  R6B_R1_SUPABASE_PROJECT: eoyenigwevnxwwhyhaer
  R6B_R1_EXTERNAL_SENDS: disabled

jobs:
  certify:
    name: R6-B-R1 Source + Native Certification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Exact-head custody and bounded-source guard
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git cat-file -e "$R6B_R1_START_SHA^{commit}"
          git diff --check "$R6B_R1_START_SHA..HEAD"
          mapfile -t CHANGED < <(git diff --name-only "$R6B_R1_START_SHA..HEAD")
          test "${#CHANGED[@]}" -gt 0
          printf '%s\\n' "${CHANGED[@]}"
          for file in "${CHANGED[@]}"; do
            case "$file" in
              mobile/*|.github/workflows/oc-native-r6b-r1-remediation.yml)
                ;;
              *)
                echo "::error::R6-B-R1 changed unauthorized path: $file"
                exit 1
                ;;
            esac
          done
          if git diff --name-only "$R6B_R1_START_SHA..HEAD" | grep -Eq '^(backend|database|web)/'; then
            echo "::error::Backend/database/web mutation is outside R6-B-R1 source authority"
            exit 1
          fi

      - name: Mobile Vitest
        run: npm run test --workspace=mobile

      - name: Native deterministic suite
        run: npm run test:native --workspace=mobile

      - name: Native static suite
        run: npm run test:static --workspace=mobile

      - name: Mobile TypeScript
        run: npm run ts:check --workspace=mobile

      - name: Expo dependency compatibility
        working-directory: mobile
        run: npx expo install --check

      - name: Record exact-head certification receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r6b-r1-certification"
          {
            echo "task=OC-NATIVE-LR1-R6-B-R1"
            echo "candidate_sha=$(git rev-parse HEAD)"
            echo "starting_sha=$R6B_R1_START_SHA"
            echo "backend_sha=$R6B_R1_BACKEND_SHA"
            echo "backend_deployment=$R6B_R1_BACKEND_DEPLOYMENT"
            echo "supabase_project=$R6B_R1_SUPABASE_PROJECT"
            echo "external_sends=$R6B_R1_EXTERNAL_SENDS"
            echo "production_touched=NO"
            echo "migration_applied=NO"
          } > "$RUNNER_TEMP/r6b-r1-certification/custody.txt"
          git diff --name-only "$R6B_R1_START_SHA..HEAD" > "$RUNNER_TEMP/r6b-r1-certification/changed-files.txt"
          git log --oneline --reverse "$R6B_R1_START_SHA..HEAD" > "$RUNNER_TEMP/r6b-r1-certification/commit-lineage.txt"

      - name: Upload certification receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oc-native-r6b-r1-certification-${{ github.sha }}
          path: ${{ runner.temp }}/r6b-r1-certification
          if-no-files-found: error
          retention-days: 30
