name: 'Issue #101 Production Post-Cutover Certification (READ-ONLY)'

# Independent confirmation that the production cutover (run 31808473195) landed exactly
# as intended. It closes the three gaps self-certification left open:
#
#   · the fourteen were measured for ordinary DML only — REFERENCES, TRIGGER and
#     MAINTAIN were never checked, and MAINTAIN is the PostgreSQL 17 privilege
#     production was measured carrying;
#   · evidence_sources_public was checked for security_invoker but not for its exact
#     ACL, its base-table policy, or the columns it actually projects;
#   · cutover-seven was never re-measured after the change.
#
# READ-ONLY BY CONSTRUCTION:
#   · NO dispatch inputs at all — there is no mode to choose and no apply path to reach;
#   · BEGIN READ ONLY, asserted from the SERVER, bounded statement_timeout, ROLLBACK;
#   · catalog metadata only — no application row is selected, counted or emitted, and
#     no column VALUE is ever read, so no key material can be observed;
#   · the guard below greps the pinned source for a mutating statement before the job
#     is allowed to connect.
#
# TWO-COMMIT PINNING. The certifier was authored and reviewed BEFORE this wrapper
# existed, so the wrapper hard-pins that already-immutable SHA and re-asserts it at
# runtime from git.
#
# PREREQUISITES (production environment, protected by required reviewers with
# prevent_self_review enabled):
#     PRODUCTION_DATABASE_URL   — production Postgres connection string
#     PRODUCTION_PROJECT_REF    — must hash to the pinned production ref
#     PRODUCTION_CA_CERT        — optional PEM trust-anchor override

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: issue-101-production-post-cutover-certify
  cancel-in-progress: false

env:
  # The single reviewed commit whose certifier is executed. Advancing this pin is a
  # reviewable pull request, never an edit to this workflow alone.
  CANDIDATE_SHA: ca51272df0a97fe0a6cf40d11294fef158013533
  PG_DRIVER_VERSION: 8.21.0

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    # github.actor is the ORIGINAL dispatcher and survives re-runs by another
    # collaborator; github.triggering_actor is whoever actually triggered this run.
    if: github.ref == 'refs/heads/main' && github.actor == 'kudzimusar' && github.triggering_actor == 'kudzimusar'

    steps:
      - name: Check out the pinned candidate commit
        uses: actions/checkout@v4
        with:
          ref: ca51272df0a97fe0a6cf40d11294fef158013533
          persist-credentials: false

      - name: Assert the checked-out commit is the pinned candidate
        run: |
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "$CANDIDATE_SHA" ]; then
            echo "::error::checked out $actual, expected the pinned candidate $CANDIDATE_SHA"
            exit 1
          fi
          echo "Running the reviewed candidate $CANDIDATE_SHA"

      - name: 'Guard: the pinned certifier has no mutation path'
        # Belt-and-braces: even a compromised pin cannot smuggle in a write, a role
        # assumption, or a narrowed privilege array.
        run: |
          set -euo pipefail
          f=backend/scripts/production-issue-101-post-cutover-certify.mjs
          if [ ! -f "$f" ]; then
            echo "::error::the pinned certifier is missing from the checkout; refusing to run."
            exit 1
          fi
          if grep -nE "client\.query\( *['\"\`](COMMIT|GRANT|REVOKE|INSERT|UPDATE|DELETE|TRUNCATE|CREATE|ALTER|DROP|SET ROLE)" "$f"; then
            echo "::error::the pinned certifier contains a mutating statement; refusing to run."
            exit 1
          fi
          if ! grep -q "BEGIN READ ONLY" "$f"; then
            echo "::error::the pinned certifier does not open a READ ONLY transaction; refusing to run."
            exit 1
          fi
          if ! grep -q "show transaction_read_only" "$f"; then
            echo "::error::the pinned certifier does not assert read-only from the server; refusing to run."
            exit 1
          fi
          # The whole point of this lane: all eight PG17 privileges, MAINTAIN included.
          if ! grep -q "'REFERENCES', 'TRIGGER', 'MAINTAIN'," "$f"; then
            echo "::error::the pinned certifier does not measure all eight privileges; refusing to run."
            exit 1
          fi
          if grep -qE "\bFROM[[:space:]]+public\." "$f"; then
            echo "::error::the pinned certifier reads from a public relation; catalog metadata only. Refusing."
            exit 1
          fi
          if grep -q "private_key_pem" "$f"; then
            echo "::error::the pinned certifier names the key column; refusing to run."
            exit 1
          fi
          echo 'Guard passed: READ ONLY, server-asserted, all eight privileges, catalog metadata only.'

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Dependency installation executes third-party package code; the database
      # credential is deliberately not in scope for this step.
      - name: Install the pinned pg driver only
        run: npm install --no-save --no-audit --no-fund --ignore-scripts "pg@${PG_DRIVER_VERSION}"

      - name: Require the production secrets
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          PRODUCTION_PROJECT_REF: ${{ secrets.PRODUCTION_PROJECT_REF }}
        run: |
          if [ -z "$PRODUCTION_DATABASE_URL" ] || [ -z "$PRODUCTION_PROJECT_REF" ]; then
            echo '::error::PRODUCTION_DATABASE_URL and PRODUCTION_PROJECT_REF must be configured on the production environment.'
            exit 1
          fi
          echo 'Production secrets are present. Values are never printed.'

      - name: 'Run the Issue #101 post-cutover certification'
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          PRODUCTION_PROJECT_REF: ${{ secrets.PRODUCTION_PROJECT_REF }}
          PRODUCTION_CA_CERT: ${{ secrets.PRODUCTION_CA_CERT }}
        run: node backend/scripts/production-issue-101-post-cutover-certify.mjs
