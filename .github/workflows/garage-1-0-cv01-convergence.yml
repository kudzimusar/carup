name: GARAGE-1.0 CV01 Authority Convergence

on:
  push:
    branches:
      - feat/garage-1-0-cv01-authority-convergence
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: garage-cv01-${{ github.ref }}
  cancel-in-progress: true

env:
  CV01_PARENT_SHA: 166025842bc2bae024c13162c2f3623617f88277
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  NODE_ENV: test
  SUPABASE_URL: http://localhost:54321
  SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
  SUPABASE_ANON_KEY: test-anon-key
  JWT_SECRET: test-jwt-secret

jobs:
  convergence:
    name: Exact custody + Garage convergence
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0

      - name: Assert exact CV01 ancestry and bounded diff
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git merge-base "$CV01_PARENT_SHA" HEAD)" = "$CV01_PARENT_SHA"

          allowed='^(.github/workflows/garage-1-0-cv01-convergence.yml|backend/tests/garage-cv01-authority-convergence.test.js|docs/garage-1.0/GARAGE_1_0_CV01_CONVERGENCE_BASELINE.md)$'
          changed="$(git diff --name-only "$CV01_PARENT_SHA" HEAD)"
          if printf '%s\n' "$changed" | grep -Ev "$allowed" | grep -q .; then
            echo "::error::CV01 baseline contains product or out-of-scope mutations."
            printf '%s\n' "$changed" | grep -Ev "$allowed"
            exit 1
          fi

          git diff --check "$CV01_PARENT_SHA" HEAD

      - name: Pin inherited Corporate / AUTH and Garage security blobs
        shell: bash
        run: |
          set -euo pipefail

          test "$(git hash-object backend/middleware/authMiddleware.js)" = "418f2a4450b599a7d904ac1304fc457560f8f870"
          test "$(git hash-object backend/services/auth/activeTenantContext.js)" = "219f50158b7cfc7eb2b34b9630e346a75be34442"
          test "$(git hash-object backend/services/auth/sessionAuthority.js)" = "beec71a459b3b8e85b68d90ce62557440008a3f6"

          test "$(git hash-object database/migrations/20261004180000_service_network_s1_garage_identity.sql)" = "0ad2e5815dd09be60964064f6cf968b2aadd309c"
          test "$(git hash-object database/migrations/20261004180100_service_network_s2_service_cases.sql)" = "67d723020d3585d0bc1da427df06e8e6560cc745"
          test "$(git hash-object database/migrations/20261004180300_service_network_s4_work_order_assignment.sql)" = "ecbb43332e8c6667db26e8063dec2df091b3560d"
          test "$(git hash-object database/migrations/20261004180400_service_network_s5_service_records.sql)" = "e6926a473c4bc395fc1a800500429105fe03438d"

          test "$(git hash-object database/migrations/20261004190100_gmo4_garage_business_activation.sql)" = "7f0a2791f47c499b7459d48eac257d4423305316"
          test "$(git hash-object database/migrations/20261004190200_gmo6_garage_invitations.sql)" = "e733b83f37db8b43414d56318eb2b3985fbd10ae"
          test "$(git hash-object database/migrations/20261004190300_gmo7_garage_membership_guard.sql)" = "f1e0cb4c246dafec7a5fd2770fe1a64883bc28a3"

          test "$(git hash-object database/migrations/20261014010000_ca_k3_auth_02_corporate_membership_foundation.sql)" = "a6f7d0ec15236056b3b1c3f6f1f55c1fbf024cda"
          test "$(git hash-object database/migrations/20261014020000_ca_k3_auth_03_corporate_membership_governance.sql)" = "433ae3bf85e53455b48f0bee5ff3c35028a22169"
          test "$(git hash-object database/migrations/20261015010000_ca_k3_auth_04_corporate_permission_authority.sql)" = "747404734641952ca7f80ccaddb2ee2eafa0a677"
          test "$(git hash-object database/migrations/20261016010000_ca_k3_auth_05_session_identity_authority.sql)" = "d45fbe1bb539383b24264fd996acd213792f14b0"
          test "$(git hash-object database/migrations/20261016163834_ca_k3_auth_05_r4_atomic_owner_registration.sql)" = "8c15ba4cba0e8fb88adb860fc63f9b7c5b7cf983"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: CV01 authority contract
        run: node --test backend/tests/garage-cv01-authority-convergence.test.js

      - name: Garage onboarding and Service Network authority regressions
        run: |
          node --test \
            backend/tests/oc5d-service-network-authority.test.js \
            backend/tests/oc5d-service-network-migrations.test.js \
            backend/tests/oc5e-gmo-migrations.test.js \
            backend/tests/oc5e-gmo3-garage-review.test.js \
            backend/tests/oc5e-gmo4-garage-activation.test.js \
            backend/tests/oc5e-gmo6-garage-invitations.test.js \
            backend/tests/oc5e-gmo7-garage-membership.test.js \
            backend/tests/oc5h-rc2-garage-journey.test.js \
            backend/tests/service-network-s4-work-order.test.js \
            backend/tests/service-network-s5-service-record.test.js \
            backend/tests/intelligence-service-mechanic-garage.test.js

      - name: Inherited Corporate / AUTH focused regressions
        run: |
          node --test \
            backend/tests/ca-k3-auth-05-session-authority.test.js \
            backend/tests/ca-k3-auth-05-atomic-registration.test.js \
            backend/tests/ca-k3-auth-01-corporate-access.test.js \
            backend/tests/ca-k3-auth-02-corporate-membership.test.js

      - name: Credential scan
        run: node scripts/cr1-secret-scan.mjs
