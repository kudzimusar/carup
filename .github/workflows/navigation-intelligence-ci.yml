name: Navigation Intelligence CI

# Structural + unit gates for the Navigation Intelligence Blueprint. Fast,
# DB-free checks that fail the build on registry/manifest/nav integrity
# violations, frontend/backend manifest drift, type errors, build breaks, and
# governance service regressions.

on:
  pull_request:
    branches: [main]
    paths:
      - 'web/**'
      - 'shared/navigation/**'
      - 'backend/services/featureGovernance/**'
      - 'backend/routes/featureGovernanceRoutes.js'
      - 'database/migrations/**feature_rollout_overrides**'
      - 'scripts/generate-feature-manifest.mjs'
      - 'tests/agents/**'
      - 'playwright.config.ts'
      - '.github/workflows/navigation-intelligence-ci.yml'
  workflow_dispatch: {}

jobs:
  navigation-gates:
    runs-on: ubuntu-latest
    env:
      # Dummy values: the governance tests use an in-memory fake client and the
      # server import constructs the Supabase client without connecting.
      SUPABASE_URL: http://localhost:54321
      SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Feature manifest drift gate (frontend ↔ backend)
        run: node scripts/generate-feature-manifest.mjs --check

      - name: TypeScript (web)
        run: npx tsc --noEmit --project web/tsconfig.app.json

      - name: Web unit tests + structural CI gates
        run: npm run test:unit --workspace=web

      - name: Web build
        run: npm run build --workspace=web

      - name: Assert Feature Governance Console is a separate chunk (Milestone D)
        # Fails the build if the lazy-loaded admin console regresses back into
        # the main entry bundle. Reuses the dist produced by the build above and
        # asserts via a stable marker string (no hashed filename hardcoding).
        run: node web/scripts/assert-console-chunk.mjs

      - name: Backend governance + server-export tests (DB-free)
        run: node --test backend/tests/feature-governance.test.js backend/tests/server-export.test.js

  # Navigation accessibility gate (Milestone H). Runs the @axe-core/playwright
  # spec against the nine nav surfaces. The Playwright config boots `npm run dev`
  # (Vite on :5173) itself via `webServer`, and the spec mocks all `/api/**`
  # traffic, so this job is backend/DB-free. It fails only on serious/critical
  # axe violations.
  navigation-accessibility:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Axe navigation accessibility spec (chromium)
        run: npx playwright test tests/agents/33-navigation-accessibility.spec.ts --project=chromium
