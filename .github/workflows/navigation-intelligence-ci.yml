name: Navigation Intelligence CI

# Full-completion gates for the Navigation Intelligence programme (Milestones
# A–I). Structural + unit gates are DB-free (in-memory fake Supabase client +
# import-only native tests); the E2E + accessibility jobs boot Vite themselves
# and mock all /api traffic, so the whole workflow needs no live backend/DB.

on:
  pull_request:
    branches: [main]
    paths:
      - 'web/**'
      - 'mobile/**'
      - 'shared/navigation/**'
      - 'backend/services/featureGovernance/**'
      - 'backend/services/navigationAnalytics/**'
      - 'backend/routes/featureGovernanceRoutes.js'
      - 'backend/routes/navigationAnalyticsRoutes.js'
      - 'backend/server.js'
      - 'backend/tests/**'
      - 'database/migrations/**feature_rollout**'
      - 'database/migrations/**navigation_analytics**'
      - 'scripts/generate-feature-manifest.mjs'
      - 'tests/agents/**'
      - 'playwright.config.ts'
      - '.github/workflows/navigation-intelligence-ci.yml'
  workflow_dispatch: {}

jobs:
  # ── Fast DB-free structural + unit gates ────────────────────────────────────
  navigation-gates:
    runs-on: ubuntu-latest
    env:
      # Dummy values: governance/analytics tests use an in-memory fake client and
      # the server import constructs the Supabase client without connecting.
      SUPABASE_URL: http://localhost:54321
      SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Feature manifest + nav-node allowlist drift gate (frontend ↔ backend)
        # One --check validates BOTH generated artifacts:
        #   shared/navigation/feature-manifest.json   (governance manifest)
        #   shared/navigation/navigation-nodes.json   (node_id privacy allowlist)
        # A newly added nav node id that wasn't regenerated fails CI here, so the
        # backend node_id allowlist can never silently drift from the manifest.
        run: node scripts/generate-feature-manifest.mjs --check

      - name: TypeScript (web)
        run: npx tsc --noEmit --project web/tsconfig.app.json

      - name: TypeScript (mobile)
        working-directory: mobile
        run: npx tsc --noEmit

      - name: Web unit tests + structural CI gates
        run: npm run test:unit --workspace=web

      - name: Web build
        run: npm run build --workspace=web

      - name: Assert Feature Governance Console is a separate chunk (Milestone D)
        # Fails if the lazy-loaded admin console regresses back into the main
        # entry bundle. Reuses the dist from the build; stable marker (no hash).
        run: node web/scripts/assert-console-chunk.mjs

      - name: Backend governance + rollout + analytics tests (DB-free)
        run: >-
          node --test
          backend/tests/feature-governance.test.js
          backend/tests/feature-governance-rollout.test.js
          backend/tests/navigation-analytics.test.js
          backend/tests/server-export.test.js

      - name: Native navigation governance + route-ownership tests
        working-directory: mobile
        # Import-only, no Expo runtime; asserts every active native entry owns a
        # feature, no dead native route, governed tab/drawer matrices, every
        # governed surface is boundary-wrapped, dashboard bootstrap gating, and
        # the offline upload queue (store + drain). Same list as `npm run
        # test:native` in mobile/package.json — keep the two in sync.
        run: |
          npx tsx tests/native-navigation.test.ts
          npx tsx tests/native-tabs.test.ts
          npx tsx tests/native-drawer.test.ts
          npx tsx tests/native-boundary-audit.test.ts
          npx tsx tests/native-dashboard-bootstrap.test.ts
          npx tsx tests/upload-queue-store.test.ts
          npx tsx tests/upload-queue-drain.test.ts

  # ── Navigation E2E (desktop/mobile/footer/role/route-boundary/console) ───────
  navigation-e2e:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Navigation Playwright suites (chromium)
        # Vite is booted by playwright.config webServer; specs mock all /api.
        run: >-
          npx playwright test
          tests/agents/27-feature-registry-navigation-map.spec.ts
          tests/agents/28-feature-registry-public-nav-access.spec.ts
          tests/agents/29-navigation-mega-menu.spec.ts
          tests/agents/30-mobile-navigation-blueprint.spec.ts
          tests/agents/31-navigation-route-boundary.spec.ts
          tests/agents/32-feature-governance-console.spec.ts
          --project=chromium

  # ── Navigation accessibility gate (Milestone H, @axe-core/playwright) ───────
  navigation-accessibility:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Axe navigation accessibility spec (chromium)
        # Fails only on serious/critical axe violations across the 9 nav surfaces.
        run: npx playwright test tests/agents/33-navigation-accessibility.spec.ts --project=chromium
