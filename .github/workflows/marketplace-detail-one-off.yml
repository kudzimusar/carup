name: Marketplace Vehicle Detail One-Off Patch

on:
  push:
    branches:
      - feat/marketplace-reliability-reference-ux
    paths:
      - .github/workflows/marketplace-detail-one-off.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/marketplace-reliability-reference-ux
          fetch-depth: 0

      - name: Apply bounded Vehicle Detail convergence
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('web/src/pages/VehicleDetail.tsx')
          s = p.read_text()
          start = s.index('                      {/* Moved off the photo. This is a registry claim about the VEHICLE; overlaid')
          end_marker = '                      )}\n'
          end = s.index(end_marker, start) + len(end_marker)
          replacement = '                      {/* Government-approval claims (CID/police/ZIMRA/duty) are deliberately absent here.\n                          Legacy booleans without authoritative public provenance cannot produce buyer-facing approval badges. */}\n'
          s = s[:start] + replacement + s[end:]
          p.write_text(s)
          PY

          git diff --check
          git diff -- web/src/pages/VehicleDetail.tsx

      - name: Commit bounded patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "carup-marketplace-bot"
          git config user.email "actions@users.noreply.github.com"
          git add web/src/pages/VehicleDetail.tsx
          git commit -m "fix(marketplace): remove unsupported approval badge from vehicle detail"
          git push origin HEAD:feat/marketplace-reliability-reference-ux
