name: Marketplace Reference Media Staging Apply

# Owner-authorized, staging-only completion gate for Marketplace lanes 6/7.
# This workflow exists so PR #182 can be tested against the real completed staging state before
# the feature PR is merged. GitHub's protected `staging` environment remains the credential boundary:
# the workflow never prints secrets and the importer itself refuses non-staging identities.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/marketplace-reference-media-staging.yml'
      - 'backend/fixtures/marketplace-reference-media-v1.json'
      - 'backend/scripts/marketplace-reference-media-staging.mjs'
      - 'backend/services/storage/**'
      - 'backend/db/**'

permissions:
  contents: read

concurrency:
  group: marketplace-reference-media-staging-pr182
  cancel-in-progress: false

env:
  # Immutable reviewed product candidate containing the manifest + guarded importer.
  # The workflow definition may move the PR head, but the staging write code/data do not.
  CANDIDATE_SHA: 38ec60d2564082a242bf90880ca41d5eee2261b2
  EXPECTED_PR: '182'
  EXPECTED_BRANCH: 'feat/marketplace-reliability-reference-ux'

jobs:
  apply-and-verify:
    if: >-
      github.event.pull_request.number == 182 &&
      github.event.pull_request.head.ref == 'feat/marketplace-reliability-reference-ux' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: staging

    steps:
      - name: Check out immutable reviewed Marketplace candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Assert immutable candidate
        run: |
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "$CANDIDATE_SHA" ]; then
            echo "::error::checked out $actual; expected $CANDIDATE_SHA"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies without staging credentials
        run: npm ci --no-audit --no-fund

      - name: Re-prove synthetic media containment before any staging write
        run: >-
          node --test
          backend/tests/marketplace-reference-media.test.js
          backend/tests/marketplace-carup-gold.test.js

      - name: Require protected staging credentials
        env:
          SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo '::error::Protected staging Supabase credentials are unavailable; refusing write.'
            exit 1
          fi
          case "$SUPABASE_URL" in
            *supabase.co*) ;;
            *) echo '::error::Unexpected staging Supabase URL shape; refusing.'; exit 1 ;;
          esac

      - name: Apply complete nine-vehicle reference galleries to staging
        env:
          NODE_ENV: production
          SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
        run: node backend/scripts/marketplace-reference-media-staging.mjs --mode=apply

      - name: Verify exact post-write staging state independently
        env:
          NODE_ENV: production
          SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
        run: node backend/scripts/marketplace-reference-media-staging.mjs --mode=verify

      - name: Preserve non-secret Lane 6 staging receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marketplace-reference-media-staging-receipt-${{ env.CANDIDATE_SHA }}
          path: marketplace-reference-media-v1-receipt.json
          if-no-files-found: error
          retention-days: 30
