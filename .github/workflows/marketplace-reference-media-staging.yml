name: Marketplace Reference Media Staging Apply (retired - manual, fail-closed)

# RETIRED AS AN AUTOMATIC WRITER (OC-5R-DB2B-3R1). This workflow used to run on pull_request events of
# PR #182 and write 45 synthetic reference images plus their listing_images rows into canonical staging.
# OC-5R retired that media from staging (DB2B-3) and closed PR #182. There is no automatic trigger any more:
# the writer runs only from an explicit workflow_dispatch whose confirmation input matches the exact phrase.
# Anything else - including the empty default - fails in a job that holds no credentials, so the protected
# `staging` environment is never entered. The importer still refuses every non-staging identity itself.
# Guarded by backend/tests/oc5r-synthetic-media-writer-guard.test.js.
on:
  workflow_dispatch:
    inputs:
      confirm_synthetic_staging_write:
        description: >-
          Synthetic reference media is retired from canonical staging. Only with written owner/moderator
          authorization, type exactly WRITE-SYNTHETIC-MEDIA-TO-CANONICAL-STAGING. Anything else refuses.
        required: true
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: marketplace-reference-media-staging-manual
  cancel-in-progress: false

env:
  # Immutable reviewed product candidate containing the manifest + guarded importer.
  # The workflow definition may move, but the staging write code/data do not.
  CANDIDATE_SHA: 38ec60d2564082a242bf90880ca41d5eee2261b2
  CONFIRM_PHRASE: WRITE-SYNTHETIC-MEDIA-TO-CANONICAL-STAGING
  CANONICAL_STAGING_URL: https://eoyenigwevnxwwhyhaer.supabase.co

jobs:
  confirm-explicit-authorization:
    # Deliberately no `environment`: an unconfirmed dispatch never reaches the staging credentials.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Refuse unless the exact confirmation phrase was supplied (default refusal)
        env:
          CONFIRM: ${{ inputs.confirm_synthetic_staging_write }}
        run: |
          if [ "${CONFIRM}" != "${CONFIRM_PHRASE}" ]; then
            echo '::error::Synthetic reference media is retired from canonical staging (OC-5R-DB2B-3). Refusing: confirm_synthetic_staging_write did not match.'
            exit 1
          fi

  apply-and-verify:
    needs: confirm-explicit-authorization
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.confirm_synthetic_staging_write == 'WRITE-SYNTHETIC-MEDIA-TO-CANONICAL-STAGING'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: staging

    steps:
      - name: Check out immutable reviewed Marketplace candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Assert immutable candidate
        run: |
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "$CANDIDATE_SHA" ]; then
            echo "::error::checked out $actual; expected $CANDIDATE_SHA"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies without staging credentials
        run: npm ci --no-audit --no-fund

      - name: Re-prove synthetic media containment before any staging write
        run: >-
          node --test
          backend/tests/marketplace-reference-media.test.js
          backend/tests/marketplace-carup-gold.test.js

      - name: Require protected staging credentials
        env:
          SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo '::error::Protected staging Supabase credentials are unavailable; refusing write.'
            exit 1
          fi
          case "$SUPABASE_URL" in
            *supabase.co*) ;;
            *) echo '::error::Unexpected staging Supabase URL shape; refusing.'; exit 1 ;;
          esac
          if [ "${SUPABASE_URL%/}" != "${CANONICAL_STAGING_URL}" ]; then
            echo '::error::STAGING_SUPABASE_URL is not exactly the canonical staging project; refusing.'
            exit 1
          fi

      - name: Apply complete nine-vehicle reference galleries to staging
        env:
          NODE_ENV: production
          SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
        run: node backend/scripts/marketplace-reference-media-staging.mjs --mode=apply

      - name: Verify exact post-write staging state independently
        env:
          NODE_ENV: production
          SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
        run: node backend/scripts/marketplace-reference-media-staging.mjs --mode=verify

      - name: Preserve non-secret Lane 6 staging receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marketplace-reference-media-staging-receipt-${{ env.CANDIDATE_SHA }}
          path: marketplace-reference-media-v1-receipt.json
          if-no-files-found: error
          retention-days: 30
