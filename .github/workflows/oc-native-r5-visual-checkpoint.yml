name: OC-NATIVE R5 Visual Checkpoint

on:
  push:
    branches:
      - feat/oc-native01-product-foundation
    paths:
      - 'mobile/**'
      - 'docs/one-carup/native/**'
      - '.github/workflows/oc-native-r5-visual-checkpoint.yml'

permissions:
  contents: read

concurrency:
  group: oc-native-r5-visual-${{ github.ref }}
  cancel-in-progress: true

env:
  EXPO_PUBLIC_API_URL: https://carup-backend-staging-9ahbpkp2a-11-11.vercel.app
  R5_CURRENT_SHA: 109dfbf9d8a911e90b7adb7ff288cd7d15c03619
  R5_BACKEND_DEPLOYMENT: dpl_9Q85zjgdKkVGBqXW8WB7aHV6HogC
  R5_BACKEND_SHA: 40621751d4b74c59324fe6601aa5ddbdc7769b08
  R5_SUPABASE_PROJECT: eoyenigwevnxwwhyhaer
  R5_EXTERNAL_SENDS: disabled

jobs:
  ios-simulator:
    name: iOS Simulator · ${{ matrix.label }}
    runs-on: macos-15
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: current
            ref: 109dfbf9d8a911e90b7adb7ff288cd7d15c03619
          - label: r5
            ref: ${{ github.sha }}
    steps:
      - name: Checkout visual authority
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          fetch-depth: 1

      - name: Record source custody
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r5-evidence"
          {
            echo "platform=ios-simulator"
            echo "label=${{ matrix.label }}"
            echo "sha=$(git rev-parse HEAD)"
            echo "runner=${{ runner.os }}"
            echo "backend_deployment=$R5_BACKEND_DEPLOYMENT"
            echo "backend_url=$EXPO_PUBLIC_API_URL"
            echo "backend_sha=$R5_BACKEND_SHA"
            echo "supabase_project=$R5_SUPABASE_PROJECT"
            echo "external_sends=$R5_EXTERNAL_SENDS"
          } > "$RUNNER_TEMP/r5-evidence/custody.txt"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Maestro 2.11.0
        shell: bash
        run: |
          set -euo pipefail
          export MAESTRO_VERSION=2.11.0
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          "$HOME/.maestro/bin/maestro" --version

      - name: Install dependencies
        run: npm ci

      - name: Prebuild iOS project
        working-directory: mobile
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Install CocoaPods
        working-directory: mobile/ios
        run: pod install

      - name: Build, install and capture native iOS evidence
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/r5-evidence"
          MAESTRO="$HOME/.maestro/bin/maestro"
          UDID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; xs=[v for group in d.values() for v in group if v.get("isAvailable") and v.get("name","").startswith("iPhone")]; print(xs[0]["udid"] if xs else "")')"
          if [ -z "$UDID" ]; then
            echo "::error::No available iPhone Simulator found"
            exit 1
          fi
          DEVICE_NAME="$(UDID="$UDID" xcrun simctl list devices available -j | UDID="$UDID" python3 -c 'import json,sys,os; d=json.load(sys.stdin)["devices"]; u=os.environ["UDID"]; print(next(v["name"] for group in d.values() for v in group if v.get("udid")==u))')"
          xcrun simctl boot "$UDID" || true
          open -a Simulator
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl ui "$UDID" appearance light

          cd mobile/ios
          WORKSPACE="$(find . -maxdepth 1 -name '*.xcworkspace' -print -quit)"
          if [ -z "$WORKSPACE" ]; then
            echo "::error::No iOS workspace produced by Expo prebuild"
            exit 1
          fi
          SCHEME="$(xcodebuild -list -json -workspace "$WORKSPACE" | python3 -c 'import json,sys; j=json.load(sys.stdin); print(j["workspace"]["schemes"][0])')"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphonesimulator \
            -destination "id=$UDID" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

          APP="$(find "$RUNNER_TEMP/DerivedData/Build/Products/Release-iphonesimulator" -maxdepth 2 -name '*.app' -print -quit)"
          if [ -z "$APP" ]; then
            echo "::error::No built .app found"
            exit 1
          fi

          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" com.carup.mobile

          cat > "$RUNNER_TEMP/ios-home.yaml" <<'YAML'
          appId: com.carup.mobile
          ---
          - extendedWaitUntil:
              visible: "Fresh on CarUp"
              timeout: 30000
          - assertNotVisible: "Open in.*CarUp.*"
          - assertVisible: "Fresh on CarUp"
          YAML
          "$MAESTRO" --device "$UDID" test "$RUNNER_TEMP/ios-home.yaml"
          "$MAESTRO" --device "$UDID" hierarchy > "$OUT/home-hierarchy.txt"
          if grep -Eiq 'Open in.*CarUp|Application Not Responding|isn.t responding|has stopped|keeps stopping' "$OUT/home-hierarchy.txt"; then
            echo "::error::Blocking system UI is present before the iOS Home screenshot"
            cat "$OUT/home-hierarchy.txt"
            exit 1
          fi
          xcrun simctl io "$UDID" screenshot "$OUT/home.png"
          test -s "$OUT/home.png"

          xcrun simctl openurl "$UDID" "carup://check-car"
          cat > "$RUNNER_TEMP/ios-check.yaml" <<'YAML'
          appId: com.carup.mobile
          ---
          - runFlow:
              when:
                visible: "Open in.*CarUp.*"
              commands:
                - tapOn:
                    text: "^Open$"
          - extendedWaitUntil:
              notVisible: "^Open$"
              timeout: 10000
          - extendedWaitUntil:
              visible: "Check CarUp record"
              timeout: 30000
          - assertNotVisible: "Open in.*CarUp.*"
          - assertNotVisible: "^Open$"
          - assertVisible: "Check CarUp record"
          YAML
          "$MAESTRO" --device "$UDID" test "$RUNNER_TEMP/ios-check.yaml"
          "$MAESTRO" --device "$UDID" hierarchy > "$OUT/check-hierarchy.txt"
          if grep -Eiq 'Open in.*CarUp|Application Not Responding|isn.t responding|has stopped|keeps stopping' "$OUT/check-hierarchy.txt"; then
            echo "::error::Blocking system UI is present before the iOS Check screenshot"
            cat "$OUT/check-hierarchy.txt"
            exit 1
          fi
          if ! grep -Fq 'Check CarUp record' "$OUT/check-hierarchy.txt"; then
            echo "::error::Check / Verify target marker is absent from the iOS accessibility hierarchy"
            cat "$OUT/check-hierarchy.txt"
            exit 1
          fi
          xcrun simctl io "$UDID" screenshot "$OUT/check-verify.png"
          test -s "$OUT/check-verify.png"

          {
            echo "device=$DEVICE_NAME"
            echo "udid=$UDID"
            echo "xcode=$(xcodebuild -version | tr '\n' ' ')"
            echo "maestro=$("$MAESTRO" --version | tr '\n' ' ')"
            echo "expo=$(node -p 'require("../../node_modules/expo/package.json").version')"
            echo "react_native=$(node -p 'require("../../node_modules/react-native/package.json").version')"
            echo "expo_camera=$(node -p 'require("../../node_modules/expo-camera/package.json").version')"
            echo "new_architecture=true"
            echo "home_assertion=Fresh on CarUp visible; no blocking system prompt"
            echo "check_assertion=Check CarUp record visible; Open confirmation absent"
            echo "home_screenshot=home.png"
            echo "check_screenshot=check-verify.png"
          } >> "$OUT/custody.txt"

      - name: Upload iOS evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oc-native-r5-ios-${{ matrix.label }}-${{ matrix.ref }}
          path: ${{ runner.temp }}/r5-evidence
          if-no-files-found: error
          retention-days: 30

  android-emulator:
    name: Android Emulator · ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: current
            ref: 109dfbf9d8a911e90b7adb7ff288cd7d15c03619
          - label: r5
            ref: ${{ github.sha }}
    steps:
      - name: Checkout visual authority
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          fetch-depth: 1

      - name: Record source custody
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r5-evidence"
          {
            echo "platform=android-emulator"
            echo "label=${{ matrix.label }}"
            echo "sha=$(git rev-parse HEAD)"
            echo "runner=${{ runner.os }}"
            echo "backend_deployment=$R5_BACKEND_DEPLOYMENT"
            echo "backend_url=$EXPO_PUBLIC_API_URL"
            echo "backend_sha=$R5_BACKEND_SHA"
            echo "supabase_project=$R5_SUPABASE_PROJECT"
            echo "external_sends=$R5_EXTERNAL_SENDS"
          } > "$RUNNER_TEMP/r5-evidence/custody.txt"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Prebuild Android project
        working-directory: mobile
        run: npx expo prebuild --platform android --clean --no-install

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build, install and capture native Android evidence
        uses: reactivecircus/android-emulator-runner@v2
        env:
          R5_ANDROID_EVIDENCE_SCRIPT: |
            set -euo pipefail
            OUT="$RUNNER_TEMP/r5-evidence"
            cd mobile/android
            ./gradlew assembleRelease
            APK="$(find app/build/outputs/apk/release -name '*.apk' -print -quit)"
            if [ -z "$APK" ]; then
              echo "::error::No release APK found"
              exit 1
            fi
            adb install -r "$APK"

            LAUNCH_COMPONENT="$(adb shell cmd package resolve-activity --brief -a android.intent.action.MAIN -c android.intent.category.LAUNCHER com.carup.mobile | tr -d '\r' | tail -n 1)"
            case "$LAUNCH_COMPONENT" in
              com.carup.mobile/*) ;;
              *)
                echo "::error::Could not resolve the installed CarUp launcher activity: $LAUNCH_COMPONENT"
                exit 1
                ;;
            esac

            dump_ui() {
              local destination="$1"
              adb shell uiautomator dump /sdcard/oc-native-window.xml >/dev/null
              adb pull /sdcard/oc-native-window.xml "$destination" >/dev/null
            }

            quickstep_anr_visible() {
              local xml="$1"
              grep -Eiq 'Quickstep.*(isn.t responding|not responding)|launcher.*(isn.t responding|not responding)' "$xml"
            }

            blocking_modal_visible() {
              local xml="$1"
              grep -Eiq 'Application Not Responding|System UI.*(isn.t responding|not responding)|keeps stopping|has stopped' "$xml"
            }

            dismiss_quickstep_anr() {
              local xml="$1"
              local tap
              tap="$(python3 - "$xml" <<'PY'
            import re
            import sys
            import xml.etree.ElementTree as ET

            root = ET.parse(sys.argv[1]).getroot()
            for preferred in ("Close app", "Wait"):
                for node in root.iter("node"):
                    label = (node.attrib.get("text") or node.attrib.get("content-desc") or "").strip()
                    if label != preferred:
                        continue
                    match = re.fullmatch(r"\[(\d+),(\d+)\]\[(\d+),(\d+)\]", node.attrib.get("bounds", ""))
                    if match:
                        x1, y1, x2, y2 = map(int, match.groups())
                        print((x1 + x2) // 2, (y1 + y2) // 2)
                        raise SystemExit(0)
            raise SystemExit(1)
            PY
              )" || return 1
              [ -n "$tap" ] || return 1
              read -r tap_x tap_y <<< "$tap"
              adb shell input tap "$tap_x" "$tap_y"
            }

            reestablish_target() {
              local target="$1"
              if [ "$target" = "home" ]; then
                adb shell am force-stop com.carup.mobile
                adb shell am start -W -n "$LAUNCH_COMPONENT" >/dev/null
              else
                adb shell am start -W -a android.intent.action.VIEW -d "carup://check-car" com.carup.mobile >/dev/null
              fi
            }

            assert_android_state() {
              local marker="$1"
              local target="$2"
              local tag="$3"
              local xml="$RUNNER_TEMP/$tag-window.xml"
              local RESUMED_LINE=""

              for attempt in $(seq 1 20); do
                if dump_ui "$xml"; then
                  if quickstep_anr_visible "$xml"; then
                    echo "::warning::Quickstep/launcher ANR detected; dismissing by accessibility-labelled action"
                    if ! dismiss_quickstep_anr "$xml"; then
                      echo "::error::Quickstep/launcher ANR is present but no deterministic accessibility action is available"
                      cat "$xml"
                      exit 1
                    fi
                    sleep 1
                    reestablish_target "$target"
                    sleep 1
                    continue
                  fi

                  if blocking_modal_visible "$xml"; then
                    echo "::error::Blocking Android system modal is present"
                    cat "$xml"
                    exit 1
                  fi

                  RESUMED_LINE="$(adb shell dumpsys activity activities | tr -d '\r' | grep -E -m1 'mResumedActivity|topResumedActivity' || true)"
                  if [[ "$RESUMED_LINE" == *"com.carup.mobile/"* ]] && grep -Fq 'package="com.carup.mobile"' "$xml" && grep -Fq "$marker" "$xml"; then
                    cp "$xml" "$OUT/$tag-hierarchy.xml"
                    return 0
                  fi
                fi
                sleep 1
              done

              echo "::error::Android target state was not established for $tag"
              echo "resumed=$RESUMED_LINE"
              [ -f "$xml" ] && cat "$xml"
              exit 1
            }

            reestablish_target home
            assert_android_state "Fresh on CarUp" home home
            adb exec-out screencap -p > "$OUT/home.png"
            test -s "$OUT/home.png"

            reestablish_target check
            assert_android_state "Check CarUp record" check check
            adb exec-out screencap -p > "$OUT/check-verify.png"
            test -s "$OUT/check-verify.png"

            {
              echo "device=$(adb shell getprop ro.product.model | tr -d '\r')"
              echo "android_api=$(adb shell getprop ro.build.version.sdk | tr -d '\r')"
              echo "launcher_component=$LAUNCH_COMPONENT"
              echo "expo=$(node -p 'require("../../node_modules/expo/package.json").version')"
              echo "react_native=$(node -p 'require("../../node_modules/react-native/package.json").version')"
              echo "expo_camera=$(node -p 'require("../../node_modules/expo-camera/package.json").version')"
              echo "new_architecture=true"
              echo "artifact=$APK"
              echo "home_assertion=CarUp top-resumed with CarUp-owned UI; Fresh on CarUp visible; no blocking modal"
              echo "check_assertion=CarUp top-resumed with CarUp-owned UI; Check CarUp record visible; no blocking modal"
              echo "home_screenshot=home.png"
              echo "check_screenshot=check-verify.png"
            } >> "$OUT/custody.txt"
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          target: default
          disable-animations: true
          script: bash -c "$R5_ANDROID_EVIDENCE_SCRIPT"

      - name: Upload Android evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oc-native-r5-android-${{ matrix.label }}-${{ matrix.ref }}
          path: ${{ runner.temp }}/r5-evidence
          if-no-files-found: error
          retention-days: 30
