name: CA-K3-AUTH-04 R1 Certification

# Local/disposable certification only. This workflow has no repository secrets,
# no staging/Production credentials, no deployment step, and no Supabase/Vercel action.
on:
  push:
    branches:
      - fix/oc5r-real-runtime-source-closure
    paths:
      - 'database/migrations/20261015010000_ca_k3_auth_04_corporate_permission_authority.sql'
      - 'backend/tests/ca-k3-auth-04-permission-authority-pglite.test.js'
      - 'backend/tests/ca-k3-auth-03-membership-governance-service.test.js'
      - 'backend/tests/realpg/ca-k3-auth-04-r1-temporal-realpg.mjs'
      - '.github/workflows/ca-k3-auth-04-r1-certification.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'database/migrations/20261015010000_ca_k3_auth_04_corporate_permission_authority.sql'
      - 'backend/tests/ca-k3-auth-04-permission-authority-pglite.test.js'
      - 'backend/tests/ca-k3-auth-03-membership-governance-service.test.js'
      - 'backend/tests/realpg/ca-k3-auth-04-r1-temporal-realpg.mjs'
      - '.github/workflows/ca-k3-auth-04-r1-certification.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ca-k3-auth-04-r1-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: test
  SUPABASE_URL: http://localhost:54321
  SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
  SUPABASE_ANON_KEY: test-anon-key
  JWT_SECRET: test-jwt-secret

jobs:
  focused:
    name: Phase C + predecessor + Web focused
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Assert exact custody and frozen predecessors
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git hash-object database/migrations/20261014010000_ca_k3_auth_02_corporate_membership_foundation.sql)" = "a6f7d0ec15236056b3b1c3f6f1f55c1fbf024cda"
          test "$(git hash-object database/migrations/20261014020000_ca_k3_auth_03_corporate_membership_governance.sql)" = "433ae3bf85e53455b48f0bee5ff3c35028a22169"
          test "$(git merge-base 2bf90e7e8f470ba775602c9da8237a2db8eeba02 HEAD)" = "2bf90e7e8f470ba775602c9da8237a2db8eeba02"
      - name: Install dependencies
        run: npm ci
      - name: Phase C and predecessor Corporate suites
        run: |
          node --test             backend/tests/ca-k3-auth-04-permission-authority-pglite.test.js             backend/tests/ca-k3-auth-03-membership-governance-pglite.test.js             backend/tests/ca-k3-auth-03-membership-governance-service.test.js             backend/tests/ca-k3-auth-01-corporate-access.test.js             backend/tests/ca-k3-auth-02-corporate-membership.test.js             backend/tests/ca-k3-auth-02-migration-pglite.test.js             backend/tests/ca-k3-auth-02-r1-membership-events-pglite.test.js
      - name: Web Corporate tests
        working-directory: web
        run: |
          npx vitest run             src/App.corporateContinuity.test.tsx             src/App.routeConvergence.test.tsx             src/components/corporate/CorporateShell.test.tsx             src/lib/corporate/access.test.ts             src/lib/corporate/truthState.test.ts
      - name: Web TypeScript
        run: npx tsc --noEmit --project web/tsconfig.app.json
      - name: Exact remediation diff hygiene
        run: git diff --check 2bf90e7e8f470ba775602c9da8237a2db8eeba02 "$GITHUB_SHA"

  real-postgres:
    name: Real PostgreSQL ${{ matrix.pg }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        pg: ['16', '17']
    services:
      postgres:
        image: postgres:${{ matrix.pg }}-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      CA_R1_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run two-session temporal / ACL / concurrency proof
        run: node backend/tests/realpg/ca-k3-auth-04-r1-temporal-realpg.mjs

  full-backend:
    name: Full backend exact head
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Full backend once
        shell: bash
        run: |
          set -o pipefail
          node --test backend/tests/*.test.js 2>&1 | tee current-backend.log
          echo "---- current exact-head node:test totals ----"
          grep -E '^# (tests|pass|fail|cancelled|skipped|todo) ' current-backend.log | tail -n 6

  baseline-backend:
    name: Full backend 9a419ae baseline
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9a419ae38c7d0e113ab5984406aca0ab1250d79a
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Assert baseline
        run: test "$(git rev-parse HEAD)" = "9a419ae38c7d0e113ab5984406aca0ab1250d79a"
      - name: Install baseline dependencies
        run: npm ci
      - name: Full backend baseline
        shell: bash
        run: |
          set -o pipefail
          node --test backend/tests/*.test.js 2>&1 | tee baseline-backend.log
          echo "---- 9a419ae node:test totals ----"
          grep -E '^# (tests|pass|fail|cancelled|skipped|todo) ' baseline-backend.log | tail -n 6
