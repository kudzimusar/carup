name: R6-A-R1 Cancel Unintended Staging Run

on:
  push:
    branches:
      - evidence/r6a-auth-session-focused-cert
    paths:
      - '.github/workflows/r6a-cancel-unintended-staging.yml'

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel the unintended deployed-staging UAT
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: '38679125527'
        run: |
          set -euo pipefail
          status="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/$REPO/actions/runs/$RUN_ID" | node -pe "JSON.parse(require('fs').readFileSync(0,'utf8')).status")"
          if [ "$status" = "completed" ]; then
            echo "Run already completed; no cancellation required."
            exit 0
          fi
          curl -fsS -X POST             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/$REPO/actions/runs/$RUN_ID/cancel"
          echo "Cancellation requested for unintended staging run $RUN_ID."
