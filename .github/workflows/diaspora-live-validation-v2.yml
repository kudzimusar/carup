name: Diaspora Live Validation V2

on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: node --test backend/tests/diaspora-supabase-integration.test.js
        env:
          RUN_DIASPORA_SUPABASE_INTEGRATION: "true"
          APPLY_DIASPORA_MIGRATION: "true"
          ALLOW_OCR_MOCK: "true"
          OCR_MODE: "loose"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
