name: Marketplace One-Shot Seller Privacy Fix

on:
  push:
    branches:
      - feat/marketplace-reliability-reference-ux
    paths:
      - '.github/workflows/marketplace-one-shot-seller-privacy-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch head
        uses: actions/checkout@v4
        with:
          ref: feat/marketplace-reliability-reference-ux
          fetch-depth: 0

      - name: Apply bounded seller privacy fix
        run: python scripts/marketplace-one-shot-seller-privacy-fix.py

      - name: Validate bounded diff and remove one-shot machinery
        run: |
          rm .github/workflows/marketplace-one-shot-seller-privacy-fix.yml
          rm scripts/marketplace-one-shot-seller-privacy-fix.py
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' '.github/workflows/marketplace-one-shot-seller-privacy-fix.yml' 'scripts/marketplace-one-shot-seller-privacy-fix.py' 'shared/types/marketplace.ts' 'web/src/pages/VehicleDetail.media.test.tsx' 'web/src/pages/VehicleDetail.tsx' | sort)"
          test "$changed" = "$expected"
          grep -F "public_profile_enabled === false" web/src/pages/VehicleDetail.tsx
          grep -F "display_label: string | null;" shared/types/marketplace.ts
          grep -F "honors Marketplace seller privacy before optional passport enrichment settles" web/src/pages/VehicleDetail.media.test.tsx

      - name: Commit clean bounded tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/marketplace-one-shot-seller-privacy-fix.yml scripts/marketplace-one-shot-seller-privacy-fix.py shared/types/marketplace.ts web/src/pages/VehicleDetail.media.test.tsx web/src/pages/VehicleDetail.tsx
          git diff --cached --check
          git commit -m "fix(marketplace): honor seller privacy before passport enrichment"
          git push origin HEAD:feat/marketplace-reliability-reference-ux
