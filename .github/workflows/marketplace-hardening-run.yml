name: Marketplace Continuity Hardening Run

on:
  push:
    branches:
      - feat/marketplace-reliability-reference-ux
    paths:
      - .github/workflows/marketplace-hardening-run.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: feat/marketplace-reliability-reference-ux
          fetch-depth: 0

      - name: Apply hardening patch
        run: python3 .github/scripts/marketplace-continuity-hardening.py

      - name: Inspect resulting diff
        run: |
          git status --short
          git diff --check
          git diff --stat

      - name: Remove temporary hardening machinery
        run: |
          rm -f .github/scripts/marketplace-continuity-hardening.py
          rm -f .github/workflows/marketplace-hardening-one-off.yml
          rm -f .github/workflows/marketplace-hardening-run.yml

      - name: Commit hardened product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes produced by hardening script" >&2
            exit 1
          fi
          git commit -m "fix(marketplace): harden buyer truth presentation"
          git push origin HEAD:feat/marketplace-reliability-reference-ux
