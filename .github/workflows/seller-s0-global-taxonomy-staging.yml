name: Seller S0 Global Taxonomy Staging Gate

# Staging-only, immutable-candidate gate for Seller Journey 1.0 / S0.
# The workflow definition may move, but all code and migration SQL that receive the protected
# staging credential are checked out from CANDIDATE_SHA. No arbitrary ref or SQL input exists.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/seller-s0-global-taxonomy-staging.yml'
      - 'backend/scripts/seller-s0-taxonomy-staging.mjs'
      - 'database/migrations/20260828133000_global_vehicle_taxonomy_s0.sql'
      - 'database/migrations/20260828140000_global_vehicle_taxonomy_imports_s0.sql'

permissions:
  contents: read

concurrency:
  group: seller-s0-global-taxonomy-staging-pr182
  cancel-in-progress: false

env:
  CANDIDATE_SHA: 894c229517237745b975280cb013e0a1298e46a2
  EXPECTED_PR: '182'
  EXPECTED_BRANCH: 'feat/marketplace-reliability-reference-ux'
  PG_DRIVER_VERSION: '8.21.0'

jobs:
  preflight-apply-verify:
    if: >-
      github.event.pull_request.number == 182 &&
      github.event.pull_request.head.ref == 'feat/marketplace-reliability-reference-ux' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging

    steps:
      - name: Check out immutable reviewed S0 candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Assert immutable candidate
        run: |
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "$CANDIDATE_SHA" ]; then
            echo "::error::checked out $actual; expected $CANDIDATE_SHA"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pinned PostgreSQL driver without credentials
        run: npm install --no-save --no-audit --no-fund --ignore-scripts "pg@${PG_DRIVER_VERSION}"

      - name: Require protected CarUp staging operator secret
        env:
          DIASPORA_STAGING_DATABASE_URL: ${{ secrets.DIASPORA_STAGING_DATABASE_URL }}
        run: |
          if [ -z "$DIASPORA_STAGING_DATABASE_URL" ]; then
            echo '::error::DIASPORA_STAGING_DATABASE_URL is unavailable; refusing staging operation.'
            exit 1
          fi

      - name: Preflight both S0 migrations in rollback-only transaction
        env:
          DIASPORA_STAGING_DATABASE_URL: ${{ secrets.DIASPORA_STAGING_DATABASE_URL }}
          DIASPORA_STAGING_CA_CERT: ${{ secrets.DIASPORA_STAGING_CA_CERT }}
          GITHUB_SHA: ${{ env.CANDIDATE_SHA }}
        run: node backend/scripts/seller-s0-taxonomy-staging.mjs --mode=preflight

      - name: Apply reviewed S0 migrations and independently verify schema
        env:
          DIASPORA_STAGING_DATABASE_URL: ${{ secrets.DIASPORA_STAGING_DATABASE_URL }}
          DIASPORA_STAGING_CA_CERT: ${{ secrets.DIASPORA_STAGING_CA_CERT }}
          GITHUB_SHA: ${{ env.CANDIDATE_SHA }}
        run: node backend/scripts/seller-s0-taxonomy-staging.mjs --mode=apply

      - name: Verify post-apply S0 contract read-only
        env:
          DIASPORA_STAGING_DATABASE_URL: ${{ secrets.DIASPORA_STAGING_DATABASE_URL }}
          DIASPORA_STAGING_CA_CERT: ${{ secrets.DIASPORA_STAGING_CA_CERT }}
          GITHUB_SHA: ${{ env.CANDIDATE_SHA }}
        run: node backend/scripts/seller-s0-taxonomy-staging.mjs --mode=verify

      - name: Preserve non-secret S0 staging receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seller-s0-global-taxonomy-staging-894c229517237745b975280cb013e0a1298e46a2
          path: seller-s0-taxonomy-staging-receipt.json
          if-no-files-found: error
          retention-days: 30
