name: R6-B0 Anonymous Auth Probe

on:
  push:
    branches:
      - evidence/r6b0-exact-pairing
    paths:
      - '.github/workflows/r6b0-auth-probe.yml'

permissions:
  contents: read

env:
  BACKEND_SHA: 5b603d452aa5ca50fa95934da454a5a8ca802778
  BACKEND_DEPLOYMENT_ID: dpl_2ctFSxXieYvvwGE4iDmH2Ey1LvFC
  API_URL: https://carup-backend-staging-ilhu3leml-11-11.vercel.app

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BACKEND_SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Probe deployed auth boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BACKEND_SHA"

          code_no_csrf="$(curl -sS -o /tmp/no-csrf.json -w '%{http_code}' -X POST -H 'Content-Type: application/json' --data '{}' "$API_URL/api/auth/logout")"
          echo "no_csrf_status=$code_no_csrf"
          test "$code_no_csrf" = "403"

          csrf_status="$(curl -sS -c /tmp/cookies.txt -o /tmp/csrf.json -w '%{http_code}' "$API_URL/api/security/csrf-token")"
          echo "csrf_token_status=$csrf_status"
          test "$csrf_status" = "200"
          csrf="$(node -pe "JSON.parse(require('fs').readFileSync('/tmp/csrf.json','utf8')).csrfToken")"
          test -n "$csrf"

          code_anon="$(curl -sS -b /tmp/cookies.txt -o /tmp/anon.json -w '%{http_code}' -X POST -H 'Content-Type: application/json' -H "x-csrf-token: $csrf" --data '{}' "$API_URL/api/auth/logout")"
          echo "anonymous_with_csrf_status=$code_anon"
          test "$code_anon" = "401"

          code_body_spoof="$(curl -sS -b /tmp/cookies.txt -o /tmp/body-spoof.json -w '%{http_code}' -X POST -H 'Content-Type: application/json' -H "x-csrf-token: $csrf" --data '{"userId":"spoofed-user","sessionId":"spoofed-session","sessionToken":"spoofed-token"}' "$API_URL/api/auth/logout")"
          echo "body_only_spoof_status=$code_body_spoof"
          test "$code_body_spoof" = "401"

          code_header_spoof="$(curl -sS -b /tmp/cookies.txt -o /tmp/header-spoof.json -w '%{http_code}' -X POST -H 'Content-Type: application/json' -H "x-csrf-token: $csrf" -H 'x-user-id: spoofed-user' --data '{}' "$API_URL/api/auth/logout")"
          echo "header_spoof_status=$code_header_spoof"
          test "$code_header_spoof" = "403"

          VERCEL=1 VERCEL_ENV=preview node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { isPasswordlessLoginAllowed } from './backend/utils/passwordAuth.js';
          assert.equal(isPasswordlessLoginAllowed(process.env), false);
          console.log('PASSWORDLESS_DEPLOYED_FALLBACK=DENIED');
          NODE
