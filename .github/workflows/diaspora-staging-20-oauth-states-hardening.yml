name: Diaspora Ledger 20 Staging OAuth States Hardening

# Applies EXACTLY ledger #20 (20260727090000_diaspora_oauth_states_client_grant_hardening.sql) to
# carup-staging and verifies the full ACL contract. Single-purpose and fail-closed (frozen
# checksum, staging-ref-only, idempotent re-dispatch). Never prints the connection URL.
# Owner-authorized 2026-07-27 ("APPROVE #20 DIASPORA OAUTH STATES GRANT HARDENING").
on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: diaspora-staging-20-oauth-states-hardening
  cancel-in-progress: false

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Require the staging database operator secret
        env:
          DIASPORA_STAGING_DATABASE_URL: ${{ secrets.DIASPORA_STAGING_DATABASE_URL }}
        run: |
          if [ -z "$DIASPORA_STAGING_DATABASE_URL" ]; then
            echo '::error::DIASPORA_STAGING_DATABASE_URL is not configured; cannot apply #20.'
            exit 1
          fi

      # Pinned driver version (matches the backend's pg); installed WITHOUT the secret in scope.
      - name: Install pg driver only
        run: npm install --no-save --no-audit --no-fund --ignore-scripts pg@8.21.0

      # The secret is scoped to this single step, not the whole job.
      - name: Apply ledger 20 and verify the ACL contract
        env:
          DIASPORA_STAGING_DATABASE_URL: ${{ secrets.DIASPORA_STAGING_DATABASE_URL }}
        run: node backend/scripts/diaspora-staging-apply-20.mjs
