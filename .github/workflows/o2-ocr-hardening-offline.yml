        uses: actions/checkout@v4
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install workspace dependencies
        run: npm ci || npm install
      - name: Run OC-4A evidence-store suites (real migration SQL in PGlite)
        run: |
          node --test \
            backend/tests/oc4a-evidence-history-protection.test.js \
            backend/tests/oc4a-provenance-object-authority.test.js \
            backend/tests/oc4a-truthful-audit-writes.test.js \
            backend/tests/oc4a-ai-fraud-scans-candidate.test.js \
            backend/tests/oc4a-migration-hygiene.test.js

  # ── OC-4D domain lineage convergence (exact-head, targeted) ──────────────
  # #208 People & Compliance: the who-must-act projections, the person review read model (fail-closed
  # sections), the identity self-review guard, the dealer decision event (privacy-corrected) and its
