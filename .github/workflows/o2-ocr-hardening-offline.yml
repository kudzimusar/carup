          npm run test:unit --workspace=web -- src/pages/dealer/DealerOnboarding.test.tsx src/pages/onboarding/RegistrationJourney.test.tsx
      - name: OC-5C — U2 passport latency (one wave, one ledger verdict, same answer) and the pins it moves
        run: >-
