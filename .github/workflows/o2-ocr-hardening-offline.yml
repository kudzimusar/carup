          backend/tests/issue164-phase5-listing-publication-gate.test.js
          backend/tests/issue164-phase0-public-projection.test.js
          backend/tests/trade-os-t12-registry-authority.test.js
          backend/tests/oc3b-ai-authority-invariants.test.js
      - name: OC-5C — X5A upload idempotency (actor-scoped, bound, PGlite race + candidate migration, shipped route)
        run: node --test backend/tests/oc5c-upload-idempotency.test.js backend/tests/upload-idempotency.test.js backend/tests/differentiator-journey.test.js
      - name: OC-5C — X4 biometrics, interface only (provider NOT SELECTED; nothing calls a provider; candidates only)
        run: node --test backend/tests/o2-x4-biometric-interface.test.js backend/tests/verification-decision-policy.test.js
      - name: OC-5D — P1 a verified, EXPLICIT active-tenant context (never guessed; re-verified every request; a failed read is 503) + web and native clients; P6 the owner service-history v1 contract (route + native renderer)
        run: |
          node --test backend/tests/oc5d-*.test.js backend/tests/oc5a-tenant-role-catalogue.test.js backend/tests/referral-uat-auth-guard.test.js backend/tests/feature-governance.test.js backend/tests/audit-logger.test.js backend/tests/auth-register-privilege.test.js backend/tests/auth-middleware.test.js backend/tests/diaspora-subscription-authz.test.js backend/tests/diaspora-subscription-routes.test.js backend/tests/referral-owner-dispute-visibility.test.js backend/tests/oc4d-dealer-seller-authority.test.js
          npm run test:unit --workspace=web -- src/components/layout/OrganisationSwitcher.test.tsx src/lib/activeTenantClient.test.ts src/lib/authSession.test.ts src/lib/apiClient.stepUpCode.test.ts
          cd mobile && npx tsc --noEmit && npx vitest run --config vitest.config.ts tests/oc5d-active-tenant.test.ts tests/gate2-session-validation.test.ts tests/garage-service-history-contract.test.ts
      - name: OC-5D — P3 the Service Network migrations, re-timestamped (order + apply-twice + Down/Up proven on PGlite; work-order and PartSentry references; O4 REVOKE and superset; F3 template)
        run: node --test backend/tests/service-network-s*-migration.test.js backend/tests/oc5d-service-network-migrations.test.js backend/tests/migration-integrity.test.js backend/tests/communication-event-coverage.test.js
      - name: OC-5D — P4 the Service Network core (PR #197 S1–S10 + O1–O10, ported; every garage route on the VERIFIED active garage; §5 fixes; OC-5A authorization before any record)
