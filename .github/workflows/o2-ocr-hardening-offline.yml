      - name: OC-5F — seller intelligence (#213 A/B) and spec 48's gate (F) — a refused rollup write fails the day; spec 48 stays out of the aggregate gates and its Communications test stays fixme
        run: node --test backend/tests/intelligence-*.test.js backend/tests/oc5f-*.test.js backend/tests/migration-integrity.test.js

      - name: OC-5G — notifications — the live path honours policyChannelsOnly; the six policy templates are registered and render on the channels their policies allow
        run: >-
          node --test backend/tests/oc5g-*.test.js
          backend/tests/communication-event-coverage.test.js
