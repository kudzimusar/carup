        run: npm run test:unit --workspace=web -- src/pages/dashboard/owner/PartSentry.test.tsx

  # ── OC-3D hash-chained audit ledger on real PostgreSQL (exact-head) ─────────
  # The tamper reproductions, canonical hashing, the append-only/retention migration CANDIDATES
  # (applied only to a disposable in-process database), evidence-provenance round trips and the single
  # write boundary — against the repository's own migration SQL in PGlite. PGlite is a root workspace
  # dependency (prisma → @prisma/dev), so this job installs the workspace. No network database, no
  # credential, nothing deployed or applied anywhere.
  oc3d-ledger-pglite:
    name: OC-3D ledger hardening (PGlite)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: test
      SUPABASE_URL: http://localhost:54321
      SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
      JWT_SECRET: test-jwt-secret
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install workspace dependencies
        run: npm ci || npm install
      - name: Run OC-3D ledger suites (real migration SQL in PGlite)
        run: |
          node --test \
            backend/tests/oc3d-ledger-tamper-reproductions.test.js \
            backend/tests/oc3d-ledger-canonical-hashing.test.js \
            backend/tests/oc3d-ledger-append-only-candidates.test.js \
            backend/tests/oc3d-evidence-provenance-canonical.test.js \
            backend/tests/oc3d-ledger-write-boundary.test.js

  # ── OC-4A evidence-store completion on real PostgreSQL (exact-head) ─────────
  # The partsentry_logs / ocr_documents / financial_ledger history-protection CANDIDATE and the
  # ai_fraud_scans truthfulness CANDIDATE (applied only to disposable in-process databases), provenance
  # object authority through the shipped app with real session rows, failure-injected audit writes, and
  # migration hygiene (SQLite-era files refused for PostgreSQL; PGlite declared). Real migration SQL in
  # PGlite; no network database, no credential, nothing deployed or applied anywhere.
  oc4a-evidence-store-pglite:
    name: OC-4A evidence store (PGlite)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: test
      SUPABASE_URL: http://localhost:54321
      SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
      SUPABASE_ANON_KEY: test-anon-key
      JWT_SECRET: test-jwt-secret
