          backend/tests/email-reference-r5-vehicle-trust-update.test.js
          backend/tests/migration-integrity.test.js

      - name: OC-5H — RC2 product journeys through the shipped app (organisation choice, a car serviced, a garage born, a seller's numbers, a decision delivered) — AI NONE, asserted
        run: node --test backend/tests/oc5h-*.test.js backend/tests/oc4e-product-journeys.test.js
      - name: OC-5D — R14 a PRODUCTION web bundle carries no demo identity or password (real build, then scan)
        run: |
          npm run test:unit --workspace=web -- src/pages/auth/demoIdentityGuard.test.tsx
          (cd web && VERCEL_ENV=production npx vite build --outDir ../.ci-dist-prod --emptyOutDir)
          node scripts/ci/assert-no-demo-identities.mjs .ci-dist-prod
      - name: OC-5B — no production-selectable simulator (both fixture modes), and the reviewer's view of it
        run: |
          node --test backend/tests/oc5b-*.test.js backend/tests/oc3b-truthful-ai-simulation.test.js backend/tests/oc3b-r-simulation-steering-guard.test.js backend/tests/oc3-programme-authority.test.js
          ALLOW_OCR_MOCK=false node --test backend/tests/oc3b-truthful-ai-simulation.test.js backend/tests/oc3b-r-simulation-steering-guard.test.js
          npm run test:unit --workspace=web -- src/pages/dashboard/admin/EvidenceReview.analysis.test.tsx

  # ── OC-5D P7 — the web Service Network surfaces (exact-head, FULL web suite) ──
  # A garage feature now declares a TENANT scope that only the session's selected, verified
  # organisation satisfies; a platform role satisfies `roles` and nothing else. The route gate, the
  # sidebar, the drawer, the compact bar and the operating home all read that one rule from the
  # registry — and every other surface reads the same registry — so the whole web suite runs here,
  # not a subset that happens to name the garage.
  oc5d-web-surfaces:
    name: OC-5D web surfaces (tenant scope; one rule for every gate; full web suite)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install workspace dependencies
        run: npm ci || npm install
      - name: The navigation manifest is the registry's (no drift)
        run: node scripts/generate-feature-manifest.mjs --check
      - name: The web app type-checks
        run: npx tsc --noEmit -p web/tsconfig.app.json
      - name: The full web suite
        run: npm run test:unit --workspace=web

  # ── OC-4F source RC1 residual guards (exact-head, targeted) ────────────────
  # The credential tripwire walks the WHOLE tree, so any document change re-runs it (hence the
  # '**/*.md' path above); the retired-route pin keeps the web client off /api/ai/ocr and the retired
  # /api/verification router.
  oc4f-rc1-residual-guards:
    name: OC-4F RC1 residual guards
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: test
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install workspace dependencies
        run: npm ci || npm install
      - name: No credential committed anywhere in the tree
        run: node --test backend/tests/oc4f-no-committed-credentials.test.js
      - name: Provider smoke harness is safe by construction (plan default, production refused)
        run: node --test backend/tests/oc4f-provider-smoke-harness.test.js
      - name: RC1's new template migration on real PostgreSQL (Up, re-run, Down, Up)
        run: node --test backend/tests/oc4f-dealer-template-migration.test.js
      - name: Diff hygiene over the whole RC (the PR gates' own check)
        # fetch-depth: 0 above already brought origin/main; a shallow re-fetch here would truncate
        # the history the merge base needs.
        run: git diff --check "$(git merge-base origin/main HEAD)" HEAD
      - name: The web client calls no retired route
        run: npm run test:unit --workspace=web -- src/lib/retiredRoutes.test.ts

  # ── OC-4C native garage odometer capture (exact-head, targeted) ───────────
  # The native side of the governed odometer path: capture-first durable queue, the upload body the
  # server reads (pinned to shared/contracts/native-odometer-capture.contract.json), the OCR follow-up,
  # truthful owner messages, and a source guard that the garage screen calls no retired/AI route.
  oc4c-native-garage-ocr:
    name: OC-4C native garage odometer (mobile)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install workspace dependencies
        run: npm ci || npm install
      - name: TypeScript (mobile)
        working-directory: mobile
        run: npx tsc --noEmit
      - name: Native queue + odometer suites
        working-directory: mobile
        run: |
          npx tsx tests/upload-queue-store.test.ts
          npx tsx tests/upload-queue-drain.test.ts
          npx tsx tests/garage-odometer-ocr.test.ts

  # ── OC-3E-W1 buyer assistant notice (exact-head, targeted) ──────────────────
  # A signed-out visitor gets safe guidance with no paid inference; the drawer must say why.
  oc3e-buyer-assistant-ui:
    name: OC-3E-W1 buyer assistant UI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install workspace dependencies
        run: npm ci || npm install
      - name: Run buyer assistant suite (bounded)
        run: npm run test:unit --workspace=web -- src/components/marketplace/BuyerAssistantDrawer.test.tsx

  # ── OCR C3 Garage assistance UI gate (exact-head, targeted) ─────────────────
  garage-c3-ui:
    name: Garage OCR assistance UI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install workspace dependencies
        run: npm ci || npm install
      - name: Run Garage OCR assistance suites (bounded)
        run: npm run test:unit --workspace=web -- src/pages/dashboard/garage/garageEvidence.test.tsx src/pages/dashboard/garage/garageSetupC3.test.tsx src/pages/dashboard/garage/garageSetupRoute.test.tsx
      # The C3 migrations and the lineage reconciliation are executed by no other gate (ci.yml's
      # NEW_MIGRATIONS list ends at 20260810120000). Real Postgres proves the #209-first lineage is
      # reconciled, the CHECKs accept every consumer write, and no browser role reaches the tables.
      - name: Garage evidence migrations (isolated PGlite Postgres)
        run: node database/test/ocr_c3_garage_evidence_check.mjs

  # ── Deployed exact-head provenance + route-gating probe ─────────────────────
  # Runs ONLY on manual dispatch with a non-empty deployed_expected_sha input, so push runs stay
  # purely offline. Network-only (public preview endpoints); no live-provider call, no secret. It
  # proves the paired Vercel preview serves the exact candidate SHA (frontend unpaired=false + SHA;
  # backend /api/health UP + SHA + supabase healthy) and that the deployed OCR routes fail closed.
  deployed-provenance-probe:
    name: Deployed exact-head provenance + OCR route gating
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.deployed_expected_sha != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPECTED_HEAD_SHA: ${{ github.event.inputs.deployed_expected_sha }}
      CANDIDATE_BRANCH: ${{ github.ref_name }}
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}
      - name: Assert exact candidate checkout
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Resolve governed exact-head preview pair
        run: |
          node <<'NODE'
          const fs = require('fs');
          const branch = process.env.CANDIDATE_BRANCH;
          const fe = (JSON.parse(fs.readFileSync('web/preview-frontend-pairing.json','utf8')).branches||{})[branch];
          const be = (JSON.parse(fs.readFileSync('web/preview-backend-pairing.json','utf8')).branches||{})[branch];
          if (!fe || !be) { console.error(JSON.stringify({error:'preview pair not governed',branch,fe:Boolean(fe),be:Boolean(be)})); process.exit(1); }
          fs.appendFileSync(process.env.GITHUB_ENV, `STAGING_WEB_URL=${fe}\nSTAGING_API_URL=${be.replace(/\/$/,'')}/api\n`);
          console.log(JSON.stringify({branch, fe, be}));
          NODE
      - name: Prove exact-head frontend/backend provenance (pairing + health)
        run: |
          node --input-type=module <<'NODE'
          const expected = process.env.EXPECTED_HEAD_SHA, web = process.env.STAGING_WEB_URL, api = process.env.STAGING_API_URL;
          const sleep = (ms)=>new Promise(r=>setTimeout(r,ms));
          for (let a=1;a<=72;a++){
            try {
              const [pR,hR] = await Promise.all([fetch(`${web}/carup-provenance.json?a=${a}`,{cache:'no-store'}), fetch(`${api}/health?a=${a}`,{cache:'no-store'})]);
              const p = pR.ok? await pR.json():null; const h = hR.ok? await hR.json():null;
              if (p?.commit_sha===expected && p?.unpaired===false && h?.status==='UP' && h?.build?.commit_sha===expected){
                console.log('EXACT-HEAD DEPLOYED PAIR CONFIRMED');
                console.log(JSON.stringify({frontend_sha:p.commit_sha, frontend_unpaired:p.unpaired, api_base_url:p.api_base_url, backend_sha:h.build.commit_sha, backend_branch:h.build?.branch, supabase:h.supabase?.status}, null, 2));
                process.exit(0);
              }
              console.log(`attempt ${a}: fe=${p?.commit_sha||'n/a'} unpaired=${p?.unpaired} be=${h?.build?.commit_sha||'n/a'} supa=${h?.supabase?.status||'n/a'}`);
            } catch(e){ console.log(`attempt ${a}: ${e.message}`); }
            await sleep(5000);
          }
          console.error('Exact-head preview pair never reported the candidate SHA.'); process.exit(1);
          NODE
      - name: Probe deployed OCR route surface + provider config (no fabricated verdict)
        run: |
          node --input-type=module <<'NODE'
          const api = process.env.STAGING_API_URL; const out = {};
          try { const h = await (await fetch(`${api}/health`,{cache:'no-store'})).json();
            // Canonical OCR readiness (continuation 6): read the authoritative health.ocr projection
            // and ocrProviders.gemini so the readiness gate no longer depends on log interpretation.
            out.health = { status:h.status, commit_sha:h.build?.commit_sha, branch:h.build?.branch, environment:h.environment, supabase:h.supabase?.status,
              ocr: h.ocr || 'not_exposed_by_health', ocrProviders_gemini: h.ocrProviders?.gemini, ocrProviders_cloudflare: h.ocrProviders?.cloudflare };
          } catch(e){ out.health_error = e.message; }
          async function probe(method, path, body){ try { const res = await fetch(`${api}${path}`,{method,cache:'no-store',headers:body?{'content-type':'application/json'}:undefined,body:body?JSON.stringify(body):undefined}); let code; try{code=(await res.json())?.code;}catch{} return {path,method,status:res.status,code}; } catch(e){ return {path,method,error:e.message}; } }
          out.route_gating = [
            await probe('POST','/ai/ocr',{docType:'national_id',base64Data:'x'}),
            await probe('POST','/diaspora/documents/probe-doc/extractions',{extraction_provider:'forged'}),
            await probe('POST','/vehicles/PROBEVIN0000000000/evidence/probe-ev/run-ocr',{}),
          ];
          console.log('DEPLOYED OCR ROUTE SURFACE:'); console.log(JSON.stringify(out,null,2));
          const leak = out.route_gating.find(r=>r.status===200);
          if (leak){ console.error('A deployed OCR route answered 200 without authentication:', JSON.stringify(leak)); process.exit(1); }
          const legacy = out.route_gating.find(r=>r.path==='/ai/ocr');
          if (legacy && ![410,401,403].includes(legacy.status)){ console.error('Legacy /api/ai/ocr neither retired nor gated:', JSON.stringify(legacy)); process.exit(1); }
          NODE

  # ── Authenticated deployed Stage-4 product journeys ─────────────────────────
  # Manual-dispatch ONLY, with stage4_authenticated=true and a non-empty deployed_expected_sha. This
  # is the SINGLE canonical Stage-4 execution authority (the standalone o2-ocr-stage4-staging-uat.yml
  # was retired). It runs session-authenticated Person Identity, Diaspora and Owner/Seller Vehicle
  # journeys against the exact-head Vercel preview with real Cloudflare/Qwen, proving OCR stays
  # candidate-only. Never runs on push/pull_request/schedule/workflow_run.
  stage4-authenticated-journeys:
    name: OCR Stage-4 authenticated deployed journeys
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.stage4_authenticated == 'true' && github.event.inputs.deployed_expected_sha != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Share the deployed-UAT preview lock; never cancel an in-flight certification.
    concurrency:
      group: staging-preview-${{ github.ref_name }}
      cancel-in-progress: false
    env:
      EXPECTED_HEAD_SHA: ${{ github.event.inputs.deployed_expected_sha }}
      CANDIDATE_BRANCH: ${{ github.ref_name }}
      DIASPORA_STAGING_DATABASE_URL: ${{ secrets.DIASPORA_STAGING_DATABASE_URL }}
      EXPECTED_STAGING_PROJECT_REF: eoyenigwevnxwwhyhaer
      STAGE4_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      # The driver provisions its OWN isolated per-run owner + reviewer identities (scrypt) via the
      # staging DB URL; it consumes no pre-provisioned UAT reviewer account, so no reviewer
      # email/password secret is injected here (least-privilege: only DIASPORA_STAGING_DATABASE_URL).
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}
      - name: Assert exact candidate checkout
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Require staging operator secret (approved project only)
        run: |
          if [ -z "$DIASPORA_STAGING_DATABASE_URL" ]; then
            echo '::error::DIASPORA_STAGING_DATABASE_URL is not configured; authenticated Stage-4 cannot provision isolated staging fixtures.'
            exit 1
          fi
          case "$DIASPORA_STAGING_DATABASE_URL" in
            *"$EXPECTED_STAGING_PROJECT_REF"*) ;;
            *) echo '::error::Refusing Stage-4: database URL is not the approved carup-staging project.'; exit 1 ;;
          esac
      - name: Resolve governed exact-head preview pair
        run: |
          node <<'NODE'
          const fs = require('fs');
          const branch = process.env.CANDIDATE_BRANCH;
          const fe = (JSON.parse(fs.readFileSync('web/preview-frontend-pairing.json','utf8')).branches||{})[branch];
          const be = (JSON.parse(fs.readFileSync('web/preview-backend-pairing.json','utf8')).branches||{})[branch];
          if (!fe || !be) { console.error(JSON.stringify({error:'preview pair not governed',branch})); process.exit(1); }
          fs.appendFileSync(process.env.GITHUB_ENV, `STAGING_WEB_URL=${fe}\nSTAGING_API_URL=${be.replace(/\/$/,'')}/api\n`);
          console.log(JSON.stringify({branch, fe, be}));
          NODE
      - name: Install backend dependencies
        run: npm install --prefix backend --ignore-scripts --no-save --package-lock=false --no-audit --no-fund
      - name: Run authenticated Stage-4 deployed journeys
        run: node backend/scripts/o2-ocr-stage4-staging-uat.mjs
      - name: Upload sanitized Stage-4 certification artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: o2-ocr-stage4-${{ github.run_id }}
          path: test-results/o2-ocr-stage4-*.json
          retention-days: 14
          if-no-files-found: warn
