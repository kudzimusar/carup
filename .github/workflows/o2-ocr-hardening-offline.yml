  offline-ocr-regression:
    name: Offline OCR regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: test
      SUPABASE_URL: http://localhost:54321
      SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
      SUPABASE_ANON_KEY: test-anon-key
      JWT_SECRET: test-jwt-secret
      ALLOW_OCR_MOCK: 'false'
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          # v16-authority-hardening diffs two historical Seller-lane commits by SHA, exactly as it
          # does under ci.yml (fetch-depth: 0). A shallow checkout fails it with "bad object".
          fetch-depth: 0

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # backend/package.json currently contains dependencies added after backend/package-lock.json.
      # Do not rewrite that unrelated lockfile from this OCR lane; install the declared package graph
      # without scripts or lockfile mutation so these zero-network-provider unit guards can execute.
      - name: Install backend dependencies for offline tests
        run: npm install --prefix backend --ignore-scripts --no-save --package-lock=false --no-audit --no-fund

      - name: Run OCR convergence and authority regression suites
        run: |
          node --test \
            backend/tests/o2-ocr-three-problem-hardening.test.js \
            backend/tests/o2-ocr-path-convergence.test.js \
            backend/tests/o2-ocr-adversarial-hardening.test.js \
            backend/tests/o2-ocr-stakeholder-coverage.test.js \
            backend/tests/o2-live-ocr-operationalization.test.js \
            backend/tests/o2-cloudflare-ocr-provider.test.js \
            backend/tests/o2-ocr-accuracy-corpus.test.js \
            backend/tests/o2-x1-document-intelligence-authority.test.js \
            backend/tests/o2-verification-ocr-attribution.test.js \
            backend/tests/o2-reviewer-quality-policy.test.js \
            backend/tests/o2-ocr-startup-diagnostic.test.js \
            backend/tests/o2-ocr-stage4-policy.test.js \
            backend/tests/o2-ocr-c2-identity-provider-convergence.test.js \
            backend/tests/identity-document-classifier.test.js \
            backend/tests/o2-ocr-c3-garage-consumer.test.js \
            backend/tests/o2-ocr-c3-garage-security.test.js \
            backend/tests/trade-os-t12-registry-authority.test.js \
            backend/tests/v16-authority-hardening.test.js \
            backend/tests/issue164-phase3-trust-authority.test.js \
            backend/tests/non-seller-authority-hardening.test.js \
            backend/tests/diaspora-supabase-integration.test.js \
            backend/tests/diaspora-ocr-route.test.js \
            backend/tests/oc2a-verification-route-convergence.test.js \
            backend/tests/rate-limit-global-capacity.test.js \
            backend/tests/oc3b-ledger-integrity-containment.test.js \
            backend/tests/oc3b-truthful-ai-simulation.test.js \
            backend/tests/oc3b-ai-provider-failure-contract.test.js \
            backend/tests/oc3b-ai-authority-invariants.test.js \
            backend/tests/evidence-ai-fraud.test.js \
            backend/tests/d0-evidence-private-data-exposure.test.js \
            backend/tests/ocr-mock-guard.test.js \
            backend/tests/oc3b-r-simulation-steering-guard.test.js \
            backend/tests/ai-temporal-disclosure.test.js \
            backend/tests/oc3c-cloudflare-ai-transport.test.js \
            backend/tests/ai01b-carup-ai-gateway.test.js \
            backend/tests/oc3e-w1-ai-consumer-convergence.test.js \
            backend/tests/issue-158-private-key-custody.test.js \
            backend/tests/oc3-programme-authority.test.js \
            backend/tests/audit-logger.test.js \
            backend/tests/verification-decision-policy.test.js \
            backend/tests/diaspora-workbook-db-export.test.js \
            backend/tests/evidence-catalog-routes.test.js \
            backend/tests/migration-integrity.test.js \
            backend/tests/oc4b-communications-ai-convergence.test.js \
            backend/tests/communications-2-ai-provider-neutrality.test.js \
            backend/tests/communications-2-product-capabilities.test.js \
            backend/tests/oc4c-native-odometer-ocr.test.js

  # ── Seller OCR capability-truth UI gate (exact-head, targeted) ──────────────
  # Runs the bounded Seller autofill capability vitest suite so "OCR provider available" truth is
  # GitHub-Actions evidence on the same candidate lineage, not a local-only pass. Credential-free,
  # no provider call. Only the one suite runs — not the full browser QA suite.
  seller-ui-capability:
    name: Seller OCR capability UI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install workspace dependencies
        run: npm ci || npm install
      - name: Run Seller OCR capability suite (bounded)
        run: npm run test:unit --workspace=web -- src/components/sell/SellerDocumentAutofillNotice.test.tsx src/pages/dashboard/owner/ownerSurfaces.truthStates.test.tsx

  # ── OC-3B PartSentry ledger-integrity UI (exact-head, targeted) ──────────────
  # The owner page consumes the verify-ledger safe projection; an EMPTY ledger must show no badge.
  oc3b-ledger-ui:
