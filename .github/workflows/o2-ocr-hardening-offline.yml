  # ── OC-5 evidence certification ladder (exact-head) ───────────────────────
  # No mocked/intercepted provider may be presented as live-provider, deployed or owner evidence;
  # no localhost run as a deployment; no ladder PASS without a receipt of that exact level. Full
  # history so every receipt's SHA is proven an ancestor of this head.
  oc5-evidence-certification:
    name: OC-5 evidence certification ladder
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NODE_ENV: test
    steps:
