  # ── OC-4E local product journeys (exact-head, targeted) ───────────────────
  # Eleven journeys through the SHIPPED app (real routes, real session auth, real services) over an
  # in-memory world, with Cloudflare intercepted at fetch (Qwen OCR / Gemma advisory) — then the
  # browser proof on a strict localhost port with the API mocked at the boundary (real CSRF flow).
