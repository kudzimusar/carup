        run: node --test backend/tests/oc5-evidence-certification-guard.test.js
      - name: The programme's certification manifest
        run: node scripts/ci/evidence-certification-guard.mjs

  # ── OC-5A RC1 source P1 closure (exact-head) ──────────────────────────────
  # P1-B: a tenant row is never platform authority (catalogue, cross-product, HTTP, PGlite migration).
  # P1-A: PartSentry service authority through the shipped app on PGlite with the REAL ledger writer.
  # P1-C: one commit boundary + durable ledger intent (ledger unavailable, retry, crash, concurrency).
  # Plus every pre-existing suite whose premise OC-5A moved, and the web surfaces that show it.
  oc5a-p1-closure:
    name: OC-5 source closure (5A P1s, 5B simulator, 5C people/identity, 5D service network)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_ENV: test
      SUPABASE_URL: http://localhost:54321
      SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
      SUPABASE_ANON_KEY: test-anon-key
      JWT_SECRET: test-jwt-secret
      ALLOW_OCR_MOCK: 'true'
    steps:
      - name: Checkout exact candidate (full history — v16's trust-writer guard diffs historical commits)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install workspace dependencies
        run: npm ci || npm install
      - name: P1-B tenant-role catalogue · P1-A service authority · P1-C atomic record + ledger intent
        run: node --test backend/tests/oc5a-*.test.js
      - name: Suites whose premise OC-5A moved (re-pinned, never loosened)
        run: >-
          node --test
          backend/tests/oc4a-provenance-object-authority.test.js
          backend/tests/oc4a-evidence-history-protection.test.js
          backend/tests/oc4d-dealer-seller-authority.test.js
          backend/tests/oc4e-product-journeys.test.js
          backend/tests/partsentry-write-truth.test.js
          backend/tests/public-truth-hardening.test.js
          backend/tests/v16-authority-hardening.test.js
          backend/tests/issue-158-terminal-operation-identity.test.js
          backend/tests/issue164-phase1-read-contract.test.js
          backend/tests/diaspora-workflow.test.js
          backend/tests/auth-middleware.test.js
      - name: Web — the PartSentry contract, the custodian panel, owner and mechanic pages
        run: >-
          npm run test:unit --workspace=web --
          src/lib/partsentry.test.ts
          src/components/owner/WorkOrderRequests.test.tsx
          src/pages/dashboard/owner/PartSentry.test.tsx
          src/pages/dashboard/mechanic/ServiceLogs.test.tsx
      - name: OC-5C — X3 identity lifecycle (PGlite) + authentication assurance, gates and the step-up UI
        run: |
          node --test backend/tests/o2-x3-*.test.js backend/tests/oc5c-*.test.js backend/tests/o2-owner-uat-closure.test.js backend/tests/dealer-routes.test.js backend/tests/verification-admin-review.test.js backend/tests/oc4e-product-journeys.test.js
          npm run test:unit --workspace=web -- src/hooks/useStepUpGuard.test.tsx src/lib/apiClient.stepUpCode.test.ts src/components/security/StepUpDialog.test.tsx src/pages/dashboard/admin/PeopleComplianceReview.postready.test.tsx src/pages/dashboard/admin/PeopleComplianceReview.test.tsx
      - name: OC-5C — X6 identity_assurance.v1 and the semantic People events (emit-only, registered, subject-safe)
        run: >-
          node --test
          backend/tests/o2-x6-*.test.js
          backend/tests/oc4d-dealer-decision-event-privacy.test.js
          backend/tests/o2-people-review-fail-closed.test.js
          backend/tests/o2-people-compliance-review.test.js
          backend/tests/communication-event-coverage.test.js
      - name: OC-5C — the applicant's own verification session never carries the reviewer's internal note (backend + mobile)
        run: |
          node --test backend/tests/verification-session-workflow.test.js backend/tests/verification-admin-review.test.js
          cd mobile && npx tsc --noEmit && npx tsx tests/verification-api.test.ts && npx vitest run --config vitest.config.ts tests/verification-store-truthful-state.test.ts
      - name: OC-5C — X2 registration journey (shipped app; subject-safe standing; fixed business identity) + the page
