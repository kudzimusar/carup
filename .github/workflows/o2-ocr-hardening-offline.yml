      - fix/oc-3b-truthful-ai-ledger-containment
      - feat/oc-3c-shared-cloudflare-ai-runtime
      - feat/oc-3e-wave1-ai-consumer-convergence
      - feat/oc-3d-ledger-hardening-offline
      - feat/oc4a-evidence-store-completion
      - feat/oc4b-ai-wave2-communications
      - feat/oc4c-native-garage-ocr-convergence
      - integration/oc4d-domain-lineage-convergence
      - feat/oc4e-local-product-journeys
