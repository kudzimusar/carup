name: Communication Command Center CI

# Real CI for the Enterprise Communication Command Center + Communications 2.0 Phase 0-7 closure.
# Unit: conversation/UAT/routing/outbox/receipt/template/product/media/stakeholder/campaign/runner.
# Postgres: mandatory existing Command Center + Communications 2 core/privacy + Phase 7 schema gates.
# Staging: PR #148 only, canonical Supabase ref guard, frozen verify -> apply -> verify,
# then exact-head deployment to the dedicated staging Vercel projects when the repository token exists.

on:
  pull_request:
  push:
    branches:
      - fix/issue-110-agent8-telegram-auto-delivery
  workflow_dispatch:

jobs:
  communication-unit:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: http://localhost:54321
      SUPABASE_SERVICE_ROLE_KEY: dummy_ci_key_not_a_secret
      JWT_SECRET: dummy_ci_jwt_secret_not_a_secret
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Communication engine unit suite
        run: >-
          node --test
          backend/tests/communication-engine.test.js
          backend/tests/communication-privilege-migration.test.js
          backend/tests/communications-2-conversation-core.test.js
          backend/tests/communications-2-uat-defects.test.js
          backend/tests/communications-2-routing-privacy-hardening.test.js
          backend/tests/communications-2-marketplace-outbox-hardening.test.js
          backend/tests/communications-2-receipt-attribution-hardening.test.js
          backend/tests/communications-2-canonical-service-hardening.test.js
          backend/tests/communications-2-governed-template-runtime.test.js
          backend/tests/communications-2-product-capabilities.test.js
          backend/tests/communications-2-completion.test.js
          backend/tests/communications-2-staging-runner-contract.test.js
          backend/tests/email-webhook-and-reply-routing.test.js
          backend/tests/email-stakeholder-matrix.test.js
          backend/tests/staging-runtime-parity.test.js

  communication-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      COMMUNICATION_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Wait for Postgres
        run: |
          for i in $(seq 1 30); do
            if pg_isready -h localhost -p 5432 -U postgres >/dev/null 2>&1; then echo "postgres ready"; exit 0; fi
            sleep 2
          done
          echo "postgres did not become ready"; exit 1
      - name: Command Center Postgres integration gate (must run, not skip)
        run: |
          set -eo pipefail
          node --test backend/tests/integration/communication-postgres.integration.test.js 2>&1 | tee /tmp/it-main.log
          node --test backend/tests/integration/communication-privilege-postgres.integration.test.js 2>&1 | tee /tmp/it-privileges.log
          node --test backend/tests/integration/communications-2-postgres.integration.test.js 2>&1 | tee /tmp/it-comms2.log
          node --test backend/tests/integration/communications-2-privacy-postgres.integration.test.js 2>&1 | tee /tmp/it-comms2-privacy.log
          node --test backend/tests/integration/communications-2-completion-postgres.integration.test.js 2>&1 | tee /tmp/it-comms2-completion.log
          if grep -qE "# skipped 1" /tmp/it-main.log /tmp/it-privileges.log /tmp/it-comms2.log /tmp/it-comms2-privacy.log /tmp/it-comms2-completion.log; then
            echo "::error::integration suite was SKIPPED — DB gate not satisfied"
            exit 1
          fi

  communication-staging:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 148
    runs-on: ubuntu-latest
    env:
      COMMUNICATION_STAGING_DATABASE_URL: ${{ secrets.DIASPORA_STAGING_DATABASE_URL }}
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Assert canonical staging credential is available
        run: |
          if [ -z "$COMMUNICATION_STAGING_DATABASE_URL" ]; then
            echo "::error::DIASPORA_STAGING_DATABASE_URL is unavailable; Communications staging apply cannot be certified"
            exit 1
          fi
      - name: Communications staging preflight (read-only)
        run: MODE=verify node backend/scripts/staging-apply-communications-2.mjs
      - name: Apply frozen Communications 2.0 migrations 315-323 to canonical staging
        run: MODE=apply node backend/scripts/staging-apply-communications-2.mjs
      - name: Communications staging post-apply verification
        run: MODE=verify node backend/scripts/staging-apply-communications-2.mjs

  communication-staging-deploy:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 148
    needs: [communication-unit, communication-postgres, communication-staging]
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN_PRIMARY: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TOKEN_FALLBACK: ${{ secrets.VERCEL_ACCESS_TOKEN }}
      VERCEL_ORG_ID: team_InL2Jmsg4dbG0rFY8nxriTha
      BACKEND_STAGING_PROJECT_ID: prj_ddsVeXDxxHxyMAaZxX4v5ORya27W
      FRONTEND_STAGING_PROJECT_ID: prj_auYmL5hA2ppWA15jdTK4GAdy3AYm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Resolve staging deployment credential without printing it
        id: vercel-auth
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$VERCEL_TOKEN_PRIMARY" ]; then
            echo "token=$VERCEL_TOKEN_PRIMARY" >> "$GITHUB_OUTPUT"
            echo "available=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$VERCEL_TOKEN_FALLBACK" ]; then
            echo "token=$VERCEL_TOKEN_FALLBACK" >> "$GITHUB_OUTPUT"
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No repository Vercel CLI token is available. Exact-head stable-staging deployment remains an authenticated owner/operator gate; no deployment write was attempted."
          fi
      - name: Deploy exact head to backend STAGING project production target
        if: steps.vercel-auth.outputs.available == 'true'
        env:
          VERCEL_TOKEN: ${{ steps.vercel-auth.outputs.token }}
          VERCEL_PROJECT_ID: ${{ env.BACKEND_STAGING_PROJECT_ID }}
        run: |
          set -euo pipefail
          npx --yes vercel@58.1.0 deploy --prod --yes --token "$VERCEL_TOKEN" --scope pay-pass-project --project "$VERCEL_PROJECT_ID" --meta carupSourceSha="$GITHUB_SHA"
      - name: Deploy exact head to frontend STAGING project production target
        if: steps.vercel-auth.outputs.available == 'true'
        env:
          VERCEL_TOKEN: ${{ steps.vercel-auth.outputs.token }}
          VERCEL_PROJECT_ID: ${{ env.FRONTEND_STAGING_PROJECT_ID }}
        run: |
          set -euo pipefail
          npx --yes vercel@58.1.0 deploy --prod --yes --token "$VERCEL_TOKEN" --scope pay-pass-project --project "$VERCEL_PROJECT_ID" --meta carupSourceSha="$GITHUB_SHA"
      - name: Record staging-only safety boundary
        run: |
          if [ "${{ steps.vercel-auth.outputs.available }}" = "true" ]; then
            echo "Deployment lane targeted only carup-backend-staging and carup-staging project IDs."
          else
            echo "Deployment not attempted: authenticated Vercel owner/operator action remains required."
          fi
          echo "No carup-backend or carup production project ID is present in this job."


  oc-native-r5-ios-visual:
    name: OC-NATIVE R5 iOS · ${{ matrix.label }}
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 223
    runs-on: macos-15
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        label: [current, r5]
    env:
      EXPO_PUBLIC_API_URL: https://carup-backend-staging-9ahbpkp2a-11-11.vercel.app
      R5_CURRENT_SHA: 109dfbf9d8a911e90b7adb7ff288cd7d15c03619
      R5_BACKEND_DEPLOYMENT: dpl_9Q85zjgdKkVGBqXW8WB7aHV6HogC
      R5_BACKEND_SHA: 40621751d4b74c59324fe6601aa5ddbdc7769b08
      R5_SUPABASE_PROJECT: eoyenigwevnxwwhyhaer
    steps:
      - name: Resolve visual authority
        id: authority
        shell: bash
        run: |
          if [ "${{ matrix.label }}" = "current" ]; then
            echo "ref=$R5_CURRENT_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout visual authority
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.authority.outputs.ref }}
          fetch-depth: 1

      - name: Record source custody
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r5-evidence"
          {
            echo "platform=ios-simulator"
            echo "label=${{ matrix.label }}"
            echo "sha=$(git rev-parse HEAD)"
            echo "backend_deployment=$R5_BACKEND_DEPLOYMENT"
            echo "backend_url=$EXPO_PUBLIC_API_URL"
            echo "backend_sha=$R5_BACKEND_SHA"
            echo "supabase_project=$R5_SUPABASE_PROJECT"
            echo "external_sends=disabled"
          } > "$RUNNER_TEMP/r5-evidence/custody.txt"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prebuild iOS project
        working-directory: mobile
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Install CocoaPods
        working-directory: mobile/ios
        run: pod install

      - name: Build, install and capture native iOS evidence
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/r5-evidence"
          UDID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; xs=[v for group in d.values() for v in group if v.get("isAvailable") and v.get("name","").startswith("iPhone")]; print(xs[0]["udid"] if xs else "")')"
          test -n "$UDID" || { echo "::error::No available iPhone Simulator found"; exit 1; }
          DEVICE_NAME="$(xcrun simctl list devices available -j | UDID="$UDID" python3 -c 'import json,sys,os; d=json.load(sys.stdin)["devices"]; u=os.environ["UDID"]; print(next(v["name"] for group in d.values() for v in group if v.get("udid")==u))')"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl ui "$UDID" appearance light

          cd mobile/ios
          WORKSPACE="$(find . -maxdepth 1 -name '*.xcworkspace' -print -quit)"
          test -n "$WORKSPACE" || { echo "::error::No iOS workspace produced"; exit 1; }
          SCHEME="$(xcodebuild -list -json -workspace "$WORKSPACE" | python3 -c 'import json,sys; j=json.load(sys.stdin); print(j["workspace"]["schemes"][0])')"
          xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Release -sdk iphonesimulator -destination "id=$UDID" -derivedDataPath "$RUNNER_TEMP/DerivedData" CODE_SIGNING_ALLOWED=NO build
          APP="$(find "$RUNNER_TEMP/DerivedData/Build/Products/Release-iphonesimulator" -maxdepth 2 -name '*.app' -print -quit)"
          test -n "$APP" || { echo "::error::No built iOS app found"; exit 1; }

          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" com.carup.mobile
          sleep 10
          xcrun simctl io "$UDID" screenshot "$OUT/home.png"
          xcrun simctl openurl "$UDID" "carup://check-car"
          sleep 6
          xcrun simctl io "$UDID" screenshot "$OUT/check-verify.png"

          {
            echo "device=$DEVICE_NAME"
            echo "xcode=$(xcodebuild -version | tr '\n' ' ')"
            echo "expo=$(node -p 'require("../../node_modules/expo/package.json").version')"
            echo "react_native=$(node -p 'require("../../node_modules/react-native/package.json").version')"
            echo "expo_camera=$(node -p 'require("../../node_modules/expo-camera/package.json").version')"
            echo "new_architecture=true"
          } >> "$OUT/custody.txt"

      - name: Upload iOS visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oc-native-r5-ios-${{ matrix.label }}
          path: ${{ runner.temp }}/r5-evidence
          if-no-files-found: error
          retention-days: 30

  oc-native-r5-android-visual:
    name: OC-NATIVE R5 Android · ${{ matrix.label }}
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 223
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        label: [current, r5]
    env:
      EXPO_PUBLIC_API_URL: https://carup-backend-staging-9ahbpkp2a-11-11.vercel.app
      R5_CURRENT_SHA: 109dfbf9d8a911e90b7adb7ff288cd7d15c03619
      R5_BACKEND_DEPLOYMENT: dpl_9Q85zjgdKkVGBqXW8WB7aHV6HogC
      R5_BACKEND_SHA: 40621751d4b74c59324fe6601aa5ddbdc7769b08
      R5_SUPABASE_PROJECT: eoyenigwevnxwwhyhaer
    steps:
      - name: Resolve visual authority
        id: authority
        shell: bash
        run: |
          if [ "${{ matrix.label }}" = "current" ]; then
            echo "ref=$R5_CURRENT_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout visual authority
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.authority.outputs.ref }}
          fetch-depth: 1

      - name: Record source custody
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r5-evidence"
          {
            echo "platform=android-emulator"
            echo "label=${{ matrix.label }}"
            echo "sha=$(git rev-parse HEAD)"
            echo "backend_deployment=$R5_BACKEND_DEPLOYMENT"
            echo "backend_url=$EXPO_PUBLIC_API_URL"
            echo "backend_sha=$R5_BACKEND_SHA"
            echo "supabase_project=$R5_SUPABASE_PROJECT"
            echo "external_sends=disabled"
          } > "$RUNNER_TEMP/r5-evidence/custody.txt"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Prebuild Android project
        working-directory: mobile
        run: npx expo prebuild --platform android --clean --no-install

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build, install and capture native Android evidence
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          target: default
          disable-animations: true
          script: >-
            set -eu;
            OUT="$RUNNER_TEMP/r5-evidence";
            cd mobile/android;
            ./gradlew assembleRelease;
            APK="$(find app/build/outputs/apk/release -name '*.apk' -print -quit)";
            test -n "$APK" || { echo "::error::No release APK found"; exit 1; };
            adb install -r "$APK";
            adb shell am force-stop com.carup.mobile;
            adb shell monkey -p com.carup.mobile 1;
            sleep 10;
            adb exec-out screencap -p > "$OUT/home.png";
            adb shell am start -W -a android.intent.action.VIEW -d "carup://check-car" com.carup.mobile;
            sleep 6;
            adb exec-out screencap -p > "$OUT/check-verify.png";
            echo "device=$(adb shell getprop ro.product.model | tr -d '\r')" >> "$OUT/custody.txt";
            echo "android_api=$(adb shell getprop ro.build.version.sdk | tr -d '\r')" >> "$OUT/custody.txt";
            echo "expo=$(node -p 'require("../../node_modules/expo/package.json").version')" >> "$OUT/custody.txt";
            echo "react_native=$(node -p 'require("../../node_modules/react-native/package.json").version')" >> "$OUT/custody.txt";
            echo "expo_camera=$(node -p 'require("../../node_modules/expo-camera/package.json").version')" >> "$OUT/custody.txt";
            echo "new_architecture=true" >> "$OUT/custody.txt";
            echo "artifact=$APK" >> "$OUT/custody.txt";

      - name: Upload Android visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oc-native-r5-android-${{ matrix.label }}
          path: ${{ runner.temp }}/r5-evidence
          if-no-files-found: error
          retention-days: 30
