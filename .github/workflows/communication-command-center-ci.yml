name: Communication Command Center CI

# Real CI for the Enterprise Communication Command Center + Communications 2.0 Phase 0-7 closure.
# Unit: conversation/UAT/routing/outbox/receipt/template/product/media/stakeholder/campaign/runner.
# Postgres: mandatory existing Command Center + Communications 2 core/privacy + Phase 7 schema gates.
# Staging (VC-03, release-only): NEVER from pull_request/push. An explicit workflow_dispatch with
# staging_release=true runs the canonical Supabase ref guard, frozen verify -> apply -> verify, then the
# shared staging-exact-head-release workflow (staging projects only, exact-SHA provenance proof).
# The previous PR #148-gated inline deploy (stale `--scope pay-pass-project`) is retired.

on:
  pull_request:
  push:
    branches:
      - fix/issue-110-agent8-telegram-auto-delivery
  workflow_dispatch:
    inputs:
      staging_release:
        description: 'Run the Communications staging apply + exact-head staging release (explicit owner/moderator action)'
        required: true
        type: boolean
        default: false
      candidate_sha:
        description: 'Exact 40-character candidate commit SHA (required when staging_release=true)'
        required: false
        type: string
      deploy_staging:
        description: 'Deploy the candidate to the STAGING projects (false = staging must already serve it)'
        required: false
        type: boolean
        default: false

jobs:
  communication-unit:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: http://localhost:54321
      SUPABASE_SERVICE_ROLE_KEY: dummy_ci_key_not_a_secret
      JWT_SECRET: dummy_ci_jwt_secret_not_a_secret
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Communication engine unit suite
        run: >-
          node --test
          backend/tests/communication-engine.test.js
          backend/tests/communication-privilege-migration.test.js
          backend/tests/communications-2-conversation-core.test.js
          backend/tests/communications-2-uat-defects.test.js
          backend/tests/communications-2-routing-privacy-hardening.test.js
          backend/tests/communications-2-marketplace-outbox-hardening.test.js
          backend/tests/communications-2-receipt-attribution-hardening.test.js
          backend/tests/communications-2-canonical-service-hardening.test.js
          backend/tests/communications-2-governed-template-runtime.test.js
          backend/tests/communications-2-product-capabilities.test.js
          backend/tests/communications-2-completion.test.js
          backend/tests/communications-2-staging-runner-contract.test.js
          backend/tests/email-webhook-and-reply-routing.test.js
          backend/tests/email-stakeholder-matrix.test.js
          backend/tests/staging-runtime-parity.test.js

  communication-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      COMMUNICATION_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Wait for Postgres
        run: |
          for i in $(seq 1 30); do
            if pg_isready -h localhost -p 5432 -U postgres >/dev/null 2>&1; then echo "postgres ready"; exit 0; fi
            sleep 2
          done
          echo "postgres did not become ready"; exit 1
      - name: Command Center Postgres integration gate (must run, not skip)
        run: |
          set -eo pipefail
          node --test backend/tests/integration/communication-postgres.integration.test.js 2>&1 | tee /tmp/it-main.log
          node --test backend/tests/integration/communication-privilege-postgres.integration.test.js 2>&1 | tee /tmp/it-privileges.log
          node --test backend/tests/integration/communications-2-postgres.integration.test.js 2>&1 | tee /tmp/it-comms2.log
          node --test backend/tests/integration/communications-2-privacy-postgres.integration.test.js 2>&1 | tee /tmp/it-comms2-privacy.log
          node --test backend/tests/integration/communications-2-completion-postgres.integration.test.js 2>&1 | tee /tmp/it-comms2-completion.log
          if grep -qE "# skipped 1" /tmp/it-main.log /tmp/it-privileges.log /tmp/it-comms2.log /tmp/it-comms2-privacy.log /tmp/it-comms2-completion.log; then
            echo "::error::integration suite was SKIPPED — DB gate not satisfied"
            exit 1
          fi

  communication-staging:
    if: github.event_name == 'workflow_dispatch' && inputs.staging_release
    needs: [communication-unit, communication-postgres]
    runs-on: ubuntu-latest
    env:
      COMMUNICATION_STAGING_DATABASE_URL: ${{ secrets.DIASPORA_STAGING_DATABASE_URL }}
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
      - name: Assert exact candidate checkout
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          printf '%s' "$CANDIDATE_SHA" | grep -Eq '^[0-9a-f]{40}$' || { echo '::error::candidate_sha must be a full 40-character SHA'; exit 1; }
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Assert canonical staging credential is available
        run: |
          if [ -z "$COMMUNICATION_STAGING_DATABASE_URL" ]; then
            echo "::error::DIASPORA_STAGING_DATABASE_URL is unavailable; Communications staging apply cannot be certified"
            exit 1
          fi
      - name: Communications staging preflight (read-only)
        run: MODE=verify node backend/scripts/staging-apply-communications-2.mjs
      - name: Apply frozen Communications 2.0 migrations 315-323 to canonical staging
        run: MODE=apply node backend/scripts/staging-apply-communications-2.mjs
      - name: Communications staging post-apply verification
        run: MODE=verify node backend/scripts/staging-apply-communications-2.mjs

  communication-staging-release:
    name: Communications exact-head staging release
    if: github.event_name == 'workflow_dispatch' && inputs.staging_release
    needs: [communication-unit, communication-postgres, communication-staging]
    uses: ./.github/workflows/staging-exact-head-release.yml
    with:
      candidate_sha: ${{ inputs.candidate_sha }}
      deploy: ${{ inputs.deploy_staging }}
    secrets: inherit
