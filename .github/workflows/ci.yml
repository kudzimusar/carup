name: CI

# PR-gating CI for the Vehicle Life Intelligence program (master plan §12.2).
# NO automatic production deploy. Production promotion is a separate, manually-approved step.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint · Types · Build · Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_ENV: test
      # Test-only placeholders so modules that read env do not crash. NEVER real secrets.
      SUPABASE_URL: http://localhost:54321
      SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
      SUPABASE_ANON_KEY: test-anon-key
      JWT_SECRET: test-jwt-secret
      ALLOW_OCR_MOCK: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so the lint gate can lint the base branch

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      # BLOCKING gate: fail on ANY net-new lint error/warning vs the base branch.
      # `main` carries historical lint debt, so a plain `eslint .` zero-error gate is impossible;
      # this compares PR vs base by stable path/rule/severity and fails only on regressions.
      # No global rule disables, no `|| true`.
      - name: Lint regression gate (no new errors/warnings vs base)
        id: lint-regression
        continue-on-error: true
        env:
          LINT_BASE_REF: origin/${{ github.base_ref || 'main' }}
        run: |
          set -o pipefail
          node scripts/lint-baseline-gate.mjs 2>&1 | tee lint-baseline-output.txt

      - name: Upload lint regression report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-baseline-output
          path: lint-baseline-output.txt
          retention-days: 7

      - name: Enforce lint regression result
        if: steps.lint-regression.outcome == 'failure'
        run: exit 1

      # Everything below runs AFTER the regression gate.
      - name: Web typecheck
        run: npx tsc --noEmit --project web/tsconfig.app.json

      - name: Lint inventory (advisory — full-repo debt, non-blocking)
        run: npm run lint || true

      - name: Web build
        run: npm run build

      - name: Backend tests (node:test)
        run: node --test backend/tests/*.test.js

      - name: Migration verification (isolated PGlite Postgres)
        run: node database/test/migration_pglite_check.mjs

      # Issue #101 P0 hardening — BLOCKING behavioural proof, not a shape check.
      #
      # This is load-bearing security evidence: it runs the migration against real
      # PostgreSQL as the actual anon / authenticated / service_role roles and fails if
      # ANY of the following regresses — anon denial, authenticated denial, TRUNCATE
      # removal, evidence_sources_public write denial and intended read behaviour,
      # security_invoker on that view, service_role access, hidden-column protection,
      # or the fail-loud service_role BYPASSRLS precondition (including that an aborted
      # apply leaves zero tables partially hardened).
      #
      # It is listed explicitly rather than globbed because it must never be silently
      # dropped, and it exits non-zero on any failure.
      - name: Issue #101 P0 hardening behavioural proof (real PostgreSQL via PGlite)
        run: node database/test/issue101_p0_hardening_check.mjs

      # The backend suite runs against an in-memory mock, and a mock that models a constraint is a
      # statement about the mock. What these harnesses catch are properties only real PostgreSQL
      # has: an ACL under Supabase's ALTER DEFAULT PRIVILEGES hazard, a UNIQUE index's missing
      # predicate raising 23505, FOR UPDATE actually serialising two callers, a pinned search_path,
      # and PG17's MAINTAIN privilege, which information_schema cannot report at all.
      #
      # Every one of them already existed and was only ever run by hand, so a regression in any
      # could have reached staging unnoticed.
      #
      # Globbed rather than listed, so a harness added alongside the next ledger is picked up
      # instead of forgotten. A glob matching nothing would make the step silently pass, so zero
      # matches is an explicit failure.
      - name: Diaspora ledger harnesses (real PostgreSQL via PGlite)
        shell: bash
        run: |
          set -uo pipefail
          shopt -s nullglob
          harnesses=(database/test/diaspora_*_check.mjs)
          if [ ${#harnesses[@]} -eq 0 ]; then
            echo '::error::no database/test/diaspora_*_check.mjs harnesses matched; refusing to pass vacuously'
            exit 1
          fi
          echo "Running ${#harnesses[@]} ledger harnesses."
          failed=0
          for h in "${harnesses[@]}"; do
            echo "── $h ──"
            # Keep going after a failure so one broken ledger does not hide the state of the rest,
            # then fail the step once at the end.
            if ! node "$h"; then
              echo "::error file=$h::ledger harness FAILED"
              failed=$((failed + 1))
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "::error::$failed of ${#harnesses[@]} ledger harnesses failed"
            exit 1
          fi
          echo "All ${#harnesses[@]} ledger harnesses passed."

      - name: git diff --check (whitespace / conflict markers)
        run: git diff --check HEAD~1 HEAD || true

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true   # advisory until a baseline is curated; promote to blocking after triage
        env:
          GITLEAKS_ENABLE_SUMMARY: 'true'
      - name: CR-1 credential scan (blocking)
        run: node scripts/cr1-secret-scan.mjs
      - name: Fallback grep scan (service-role keys / private keys)
        run: |
          set -e
          if grep -rEn "service_role|-----BEGIN (RSA|EC|OPENSSH) PRIVATE KEY-----|sk-[A-Za-z0-9]{20,}" \
              --include='*.js' --include='*.ts' --include='*.tsx' --include='*.json' --include='*.sql' \
              --exclude-dir=node_modules --exclude-dir=dist . ; then
            echo "::warning::Potential secret-like strings found — review the matches above."
          else
            echo "No obvious secret-like strings found."
          fi

  dependency-audit:
    name: Dependency audit (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: npm audit (high+)
        run: npm audit --audit-level=high || true   # advisory; do not block PRs on transitive advisories

# Branch protection (configure in GitHub repo settings — documented, not auto-applied):
#   - Require the "validate" job to pass before merge to main.
#   - Require PR review approval; disallow force-push to main.
#   - Do NOT enable auto-merge. Production deploy stays a manual, approved action.
