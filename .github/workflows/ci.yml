name: CI

# PR-gating CI for the Vehicle Life Intelligence program (master plan §12.2).
# NO automatic production deploy. Production promotion is a separate, manually-approved step.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint · Types · Build · Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_ENV: test
      # Test-only placeholders so modules that read env do not crash. NEVER real secrets.
      SUPABASE_URL: http://localhost:54321
      SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
      SUPABASE_ANON_KEY: test-anon-key
      JWT_SECRET: test-jwt-secret
      ALLOW_OCR_MOCK: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so the lint gate can lint the base branch

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      # BLOCKING gate: fail on ANY net-new lint error/warning vs the base branch.
      # `main` carries historical lint debt, so a plain `eslint .` zero-error gate is impossible;
      # this compares PR vs base by stable path/rule/severity and fails only on regressions.
      # No global rule disables, no `|| true`.
      - name: Lint regression gate (no new errors/warnings vs base)
        id: lint-regression
        continue-on-error: true
        env:
          LINT_BASE_REF: origin/${{ github.base_ref || 'main' }}
        run: |
          set -o pipefail
          node scripts/lint-baseline-gate.mjs 2>&1 | tee lint-baseline-output.txt

      - name: Upload lint regression report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-baseline-output
          path: lint-baseline-output.txt
          retention-days: 7

      - name: Enforce lint regression result
        if: steps.lint-regression.outcome == 'failure'
        run: exit 1

      # Everything below runs AFTER the regression gate.
      - name: Web typecheck
        run: npx tsc --noEmit --project web/tsconfig.app.json

      - name: Lint inventory (advisory — full-repo debt, non-blocking)
        run: npm run lint || true

      - name: Web build
        run: npm run build

      - name: Backend tests (node:test)
        run: node --test backend/tests/*.test.js

      - name: Migration verification (isolated PGlite Postgres)
        run: node database/test/migration_pglite_check.mjs

      # BLOCKING behavioural proof for the finance-obligation / encumbrance authority.
      #
      # It is a SEPARATE step because migration_pglite_check.mjs carries an explicit
      # NEW_MIGRATIONS list that ends at 20260810120000 — so a migration added after that date is
      # otherwise executed by NO gate in this repo (migration-integrity.test.js only parses the
      # file and checks its markers). This step applies the DDL Up, exercises R24/R25/R26, the
      # closed-shape settlement_context and the provenance rules against real PostgreSQL, then
      # applies Down and re-applies Up.
      - name: Finance obligation authority verification (isolated PGlite Postgres)
        run: node database/test/finance_obligation_pglite_check.mjs

      # Operations Control Plane Serena slice (M1/M2) — behavioural proof for
      # 20260902150000 (generic compat evidence types require canonical
      # classification) and 20260902160000 (vehicle_seller_authority lifecycle,
      # attribution CHECK, RLS + service_role-only grants). Same rationale as the
      # finance step: migrations after 20260810120000 are executed by no other gate.
      - name: Operations Serena slice migrations verification (isolated PGlite Postgres)
        run: node database/test/operations_serena_slice_pglite_check.mjs

      # Trade OS T4 — the procurement→logistics continuation edge (20260906090000).
      #
      # Same rationale as the two steps above: migration_pglite_check.mjs's NEW_MIGRATIONS list
      # ends at 20260810120000, so this migration is executed by NO other gate, and
      # migration-integrity.test.js only parses its markers.
      #
      # What only real Postgres can show: the PARTIAL unique index rejects a second LIVE
      # continuation for one order, and — the half the in-memory mock deliberately gets wrong —
      # FREES the slot once a continuation is CANCELLED, CLOSED or soft-deleted. Getting that
      # second half wrong in production would leave a buyer whose shipping request was cancelled
      # permanently unable to arrange shipping for that purchase again.
      - name: Trade OS T4 continuation edge verification (isolated PGlite Postgres)
        run: node database/test/trade_os_t4_continuation_check.mjs

      # Trade OS Intake 2.0 — the intake contract's persistence (20260906120000).
      #
      # Same NEW_MIGRATIONS gap as the two steps above. What only real Postgres shows here: every
      # enumerated intake choice is CHECK-constrained (an invented "budget basis" is refused rather
      # than stored and later believed), unstated preferences stay NULL instead of being silently
      # defaulted, and the observation ledger keeps a customer's 400 kg estimate ALONGSIDE a
      # warehouse's 437 kg measurement — the whole capture-once/verify-later guarantee, which a
      # (value, provenance) column pair could not express.
      - name: Trade OS Intake 2.0 contract verification (isolated PGlite Postgres)
        run: node database/test/trade_os_intake_2_0_check.mjs

      # Issue #101 P0 hardening — BLOCKING behavioural proof, not a shape check.
      #
      # This is load-bearing security evidence: it runs the migration against real
      # PostgreSQL as the actual anon / authenticated / service_role roles and fails if
      # ANY of the following regresses — anon denial, authenticated denial, TRUNCATE
      # removal, evidence_sources_public write denial and intended read behaviour,
      # security_invoker on that view, service_role access, hidden-column protection,
      # or the fail-loud service_role BYPASSRLS precondition (including that an aborted
      # apply leaves zero tables partially hardened).
      #
      # It is listed explicitly rather than globbed because it must never be silently
      # dropped, and it exits non-zero on any failure.
      # Trade OS T5 — corridor authority + sailing facts + mode reconciliation (20260907090000).
      #
      # Same rationale as the T4/Intake steps above: migration_pglite_check.mjs's NEW_MIGRATIONS
      # list ends at 20260810120000, so this migration is executed by NO other gate. This step
      # applies Up twice (idempotence), proves live-code uniqueness, the leg mode vocabulary, the
      # widened roro offer CHECK, SET NULL corridor references, that Down fails loudly while roro
      # offers exist, and Down/Up recovery.
      - name: Trade OS T5 corridor authority verification (isolated PGlite Postgres)
        run: node database/test/trade_os_t5_corridor_check.mjs

      # Trade OS T6 — commercial transparency schema (20260908090000).
      #
      # Same rationale as the T4/T5/Intake steps: migration_pglite_check.mjs's NEW_MIGRATIONS list
      # ends at 20260810120000, so this migration is executed by NO other gate. This step proves
      # FX snapshot immutability, that money cannot be stored without its currency, that UNKNOWN is
      # representable and is not zero, exactly-one-quote-domain ownership, exact allocation
      # reconciliation with replay safety, and Down/Up recovery.
      - name: Trade OS T6 commercial transparency verification (isolated PGlite Postgres)
        run: node database/test/trade_os_t6_commercial_check.mjs

      - name: 'Issue #101 P0 hardening behavioural proof (real PostgreSQL via PGlite)'
        run: node database/test/issue101_p0_hardening_check.mjs

      # P2 staging parity. The first proves the twelve reconstructed relations match the
      # committed production receipts column-for-column, that the posture is deliberately
      # stricter than production's, and that a re-apply or a production-like database is
      # refused before anything is created.
      #
      # The second is the one that matters most: #155 must still be blocked BEFORE parity
      # and apply UNMODIFIED after it, with all four of its published invariants and both
      # cutover-seven regression directions intact. A parity migration that quietly made
      # #155 vacuous would pass the first harness and fail this one.
      #
      # Listed explicitly, like the P0 proof above, so neither can be silently dropped.
      - name: 'Issue #101 P2 staging parity proof (real PostgreSQL via PGlite)'
        run: node database/test/issue101_parity_check.mjs

      - name: 'Issue #101 parity → P0 chain proof (real PostgreSQL via PGlite)'
        run: node database/test/issue101_parity_then_p0_chain.mjs

      # public_keys P0 closure. Staging is already in the target posture — P2 created the
      # table hardened — so a staging apply can only ever prove the migration is a safe
      # no-op. This harness builds the MEASURED PRODUCTION PRE-STATE instead (RLS on, zero
      # policies, anon/authenticated holding all eight privileges including the ungoverned
      # TRUNCATE) and proves the transition that production will actually undergo,
      # including that withholding service_role DELETE does not disarm either cascade.
      - name: 'Issue #101 public_keys transition proof (real PostgreSQL via PGlite)'
        run: node database/test/issue101_public_keys_transition_check.mjs

      # The post-cutover certifier, validated before it is ever pointed at production.
      # A certifier that cannot fail is worse than none — it turns "we did not look" into
      # "we checked and it was fine". This applies the two REAL merged migrations to a
      # production-shaped pre-state, proves the correct result certifies, then breaks one
      # thing at a time and proves each break is caught AND named.
      - name: 'Issue #101 post-cutover certifier proof (real PostgreSQL via PGlite)'
        run: node database/test/issue101_post_cutover_certifier_check.mjs

      # The backend suite runs against an in-memory mock, and a mock that models a constraint is a
      # statement about the mock. What these harnesses catch are properties only real PostgreSQL
      # has: an ACL under Supabase's ALTER DEFAULT PRIVILEGES hazard, a UNIQUE index's missing
      # predicate raising 23505, FOR UPDATE actually serialising two callers, a pinned search_path,
      # and PG17's MAINTAIN privilege, which information_schema cannot report at all.
      #
      # Every one of them already existed and was only ever run by hand, so a regression in any
      # could have reached staging unnoticed.
      #
      # Globbed rather than listed, so a harness added alongside the next ledger is picked up
      # instead of forgotten. A glob matching nothing would make the step silently pass, so zero
      # matches is an explicit failure.
      - name: Diaspora ledger harnesses (real PostgreSQL via PGlite)
        shell: bash
        run: |
          set -uo pipefail
          shopt -s nullglob
          harnesses=(database/test/diaspora_*_check.mjs)
          if [ ${#harnesses[@]} -eq 0 ]; then
            echo '::error::no database/test/diaspora_*_check.mjs harnesses matched; refusing to pass vacuously'
            exit 1
          fi
          echo "Running ${#harnesses[@]} ledger harnesses."
          failed=0
          for h in "${harnesses[@]}"; do
            echo "── $h ──"
            # Keep going after a failure so one broken ledger does not hide the state of the rest,
            # then fail the step once at the end.
            if ! node "$h"; then
              echo "::error file=$h::ledger harness FAILED"
              failed=$((failed + 1))
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "::error::$failed of ${#harnesses[@]} ledger harnesses failed"
            exit 1
          fi
          echo "All ${#harnesses[@]} ledger harnesses passed."

      - name: git diff --check (whitespace / conflict markers)
        run: git diff --check HEAD~1 HEAD || true

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true   # advisory until a baseline is curated; promote to blocking after triage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_SUMMARY: 'true'
      - name: CR-1 credential scan (blocking)
        run: node scripts/cr1-secret-scan.mjs
      - name: Fallback grep scan (service-role keys / private keys)
        run: |
          set -e
          if grep -rEn "service_role|-----BEGIN (RSA|EC|OPENSSH) PRIVATE KEY-----|sk-[A-Za-z0-9]{20,}" \
              --include='*.js' --include='*.ts' --include='*.tsx' --include='*.json' --include='*.sql' \
              --exclude-dir=node_modules --exclude-dir=dist . ; then
            echo "::warning::Potential secret-like strings found — review the matches above."
          else
            echo "No obvious secret-like strings found."
          fi

  dependency-audit:
    name: Dependency audit (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: npm audit (high+)
        run: npm audit --audit-level=high || true   # advisory; do not block PRs on transitive advisories

# Branch protection (configure in GitHub repo settings — documented, not auto-applied):
#   - Require the "validate" job to pass before merge to main.
#   - Require PR review approval; disallow force-push to main.
#   - Do NOT enable auto-merge. Production deploy stays a manual, approved action.
