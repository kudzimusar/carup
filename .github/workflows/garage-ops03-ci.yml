name: GARAGE-1.0 OPS03 CI

on:
  push:
    branches:
      - feat/garage-1.0-ops03-appointments-scheduling-capacity
  pull_request:
    branches:
      - feat/garage-1.0-ops02-customer-vehicle-relationship

permissions:
  contents: read

concurrency:
  group: garage-ops03-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    name: OPS03 frozen-parent product checks
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NODE_ENV: test
      SUPABASE_URL: http://localhost:54321
      SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
      SUPABASE_ANON_KEY: test-anon-key
      JWT_SECRET: test-jwt-secret
    steps:
      - name: Resolve literal product head
        id: exact_head
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            expected="${{ github.event.pull_request.head.sha }}"
          else
            expected="${{ github.sha }}"
          fi
          test -n "$expected"
          echo "sha=$expected" >> "$GITHUB_OUTPUT"
          echo "EXPECTED_PRODUCT_HEAD=$expected"

      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.exact_head.outputs.sha }}
          fetch-depth: 0

      - name: Prove literal exact_head and OPS02 parent custody
        shell: bash
        run: |
          set -euo pipefail
          parent=7cbad41cac7776f13e6a0d766bfb995eb2f35d1e
          expected="${{ steps.exact_head.ou¶»§q«^