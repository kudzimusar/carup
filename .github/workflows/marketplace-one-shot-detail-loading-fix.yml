name: Marketplace One-Shot Detail Loading Fix

on:
  push:
    branches:
      - feat/marketplace-reliability-reference-ux
    paths:
      - '.github/workflows/marketplace-one-shot-detail-loading-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch head
        uses: actions/checkout@v4
        with:
          ref: feat/marketplace-reliability-reference-ux
          fetch-depth: 0

      - name: Apply bounded Vehicle Detail loading fix and regression
        run: python scripts/marketplace-one-shot-detail-loading-fix.py

      - name: Validate bounded diff and remove one-shot machinery
        run: |
          rm .github/workflows/marketplace-one-shot-detail-loading-fix.yml
          rm scripts/marketplace-one-shot-detail-loading-fix.py
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' '.github/workflows/marketplace-one-shot-detail-loading-fix.yml' 'scripts/marketplace-one-shot-detail-loading-fix.py' 'web/src/pages/VehicleDetail.media.test.tsx' 'web/src/pages/VehicleDetail.tsx' | sort)"
          test "$changed" = "$expected"

      - name: Commit hardened tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/marketplace-one-shot-detail-loading-fix.yml scripts/marketplace-one-shot-detail-loading-fix.py web/src/pages/VehicleDetail.tsx web/src/pages/VehicleDetail.media.test.tsx
          git diff --cached --check
          git diff --cached --stat
          git commit -m "fix(marketplace): render detail independently of passport lookup"
          git push origin HEAD:feat/marketplace-reliability-reference-ux
