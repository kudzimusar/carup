name: Marketplace Native Media Semantics Fix

on:
  push:
    branches:
      - temp-placeholder-do-not-create
    paths:
      - .github/workflows/marketplace-mobile-media-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout runner branch
        uses: actions/checkout@v4
        with:
          path: runner

      - name: Checkout exact marketplace candidate
        uses: actions/checkout@v4
        with:
          ref: feat/marketplace-reliability-reference-ux
          fetch-depth: 0
          path: candidate

      - name: Refuse branch drift
        shell: bash
        run: test "$(git -C candidate rev-parse HEAD)" = "bf922a26841e107b535723a1fc09b9fb37360420"

      - name: Apply native media semantic repair
        shell: bash
        run: |
          cp runner/.github/scripts/marketplace-mobile-media-fix.py ./marketplace-mobile-media-fix.py
          python3 marketplace-mobile-media-fix.py
          git -C candidate diff --check
          git -C candidate diff -- mobile/utils/marketplaceApi.ts mobile/tests/marketplace-media-contract.test.ts

      - name: Commit repair to marketplace branch
        shell: bash
        run: |
          git -C candidate config user.name "github-actions[bot]"
          git -C candidate config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C candidate add mobile/utils/marketplaceApi.ts mobile/tests/marketplace-media-contract.test.ts
          git -C candidate commit -m "fix(marketplace): fail closed on native site-relative media"
          git -C candidate push origin HEAD:feat/marketplace-reliability-reference-ux
