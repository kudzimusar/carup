name: OC-NATIVE FINAL-01A-R2 Pre-UAT Native Package

on:
  push:
    branches:
      - integration/oc-native-final-01a-prep
    paths:
      - '.github/workflows/oc-native-final-01a-r2-pre-uat.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oc-native-final-01a-r2-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  R1_ACCEPTED_SHA: 0c96deeab09277bd371e717f26535d9f33a5f43a
  EXPO_PUBLIC_API_URL: https://oc-native-final-isolated.invalid
  SUPABASE_URL: http://127.0.0.1:54321
  SUPABASE_SERVICE_ROLE_KEY: test-key
  SUPABASE_ANON_KEY: test-anon-key
  JWT_SECRET: test-jwt-secret

jobs:
  android-pre-uat-package:
    name: Android · true Native package + install + launch
    runs-on: ubuntu-latest
    timeout-minutes: 80

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Exact-head custody and frozen product guard
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse "$R1_ACCEPTED_SHA:mobile")" = "$(git rev-parse "HEAD:mobile")"
          mapfile -t CHANGED < <(git diff --name-only "$R1_ACCEPTED_SHA..HEAD")
          printf '%s\n' "${CHANGED[@]}"
          test "${#CHANGED[@]}" -eq 1
          test "${CHANGED[0]}" = ".github/workflows/oc-native-final-01a-r2-pre-uat.yml"
          git diff --check "$R1_ACCEPTED_SHA..HEAD"

      - name: Install dependencies
        run: npm ci

      - name: Prove true Expo / React Native application authority
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('mobile/package.json', 'utf8'));
          const app = JSON.parse(fs.readFileSync('mobile/app.json', 'utf8'));
          const eas = JSON.parse(fs.readFileSync('mobile/eas.json', 'utf8'));
          if (pkg.main !== 'expo-router/entry') throw new Error('Expo Router entry missing');
          if (pkg.dependencies.expo !== '~54.0.37') throw new Error('Unexpected Expo authority');
          if (pkg.dependencies['react-native'] !== '0.81.5') throw new Error('Unexpected React Native authority');
          if (app.expo.sdkVersion !== '54.0.0') throw new Error('Unexpected SDK version');
          if (app.expo.android.package !== 'com.carup.mobile') throw new Error('Unexpected Android package');
          if (!app.expo.plugins.some((x) => x === 'expo-router')) throw new Error('expo-router plugin missing');
          if (!app.expo.plugins.some((x) => x === 'expo-secure-store')) throw new Error('expo-secure-store plugin missing');
          if (eas.build?.['android-device']?.distribution !== 'internal') throw new Error('android-device must remain internal');
          if (eas.build?.['android-device']?.android?.buildType !== 'apk') throw new Error('android-device must remain APK');
          const forbidden = ['@capacitor/core', '@capacitor/android', 'react-native-webview'];
          for (const dep of forbidden) {
            if (pkg.dependencies?.[dep] || pkg.devDependencies?.[dep]) throw new Error('Forbidden wrapper dependency: ' + dep);
          }
          console.log(JSON.stringify({
            expo: pkg.dependencies.expo,
            reactNative: pkg.dependencies['react-native'],
            sdkVersion: app.expo.sdkVersion,
            package: app.expo.android.package,
            version: app.expo.version,
            main: pkg.main,
            buildProfile: 'android-device',
            apiBaseMechanism: 'EXPO_PUBLIC_API_URL',
            secureStorage: 'expo-secure-store'
          }, null, 2));
          NODE
          if grep -R -E -n --include='*.ts' --include='*.tsx' --include='*.js'             'from ["'"'"']react-native-webview["'"'"']|require\(["'"'"']react-native-webview["'"'"']\)|@capacitor|TrustedWebActivity|TWA launcher' mobile; then
            echo "::error::Web-wrapper implementation detected"
            exit 1
          fi

      - name: Expo configuration validation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/oc-native-r2"
          cd mobile
          npx expo config --type public --json > "$RUNNER_TEMP/oc-native-r2/expo-config.json"
          node -e 'const j=require(process.argv[1]); if(j.android?.package!=="com.carup.mobile") process.exit(1); if(j.scheme!=="carup") process.exit(1)' "$RUNNER_TEMP/oc-native-r2/expo-config.json"
          npx expo install --check

      - name: Prebuild Android from Expo authority
        shell: bash
        run: |
          set -euo pipefail
          cd mobile
          npx expo prebuild --platform android --clean --no-install

          MAIN_ACTIVITY="$(find android/app/src/main/java -type f -name 'MainActivity.kt' -print -quit)"
          if [ -z "$MAIN_ACTIVITY" ]; then
            MAIN_ACTIVITY="$(find android/app/src/main/java -type f -name 'MainActivity.java' -print -quit)"
          fi
          test -n "$MAIN_ACTIVITY"
          grep -Eq 'ReactActivity' "$MAIN_ACTIVITY"
          if grep -R -Eiq 'Capacitor|TrustedWebActivity|androidbrowserhelper|android\\.webkit\\.WebView' android/app/src/main; then
            echo "::error::Generated Android app contains a web-wrapper/TWA/Capacitor indicator"
            exit 1
          fi

      - name: Enable KVM
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build, install, launch and recustody Android package
        uses: reactivecircus/android-emulator-runner@v2
        env:
          R2_ANDROID_SCRIPT: |
            set -euo pipefail
            OUT="$RUNNER_TEMP/oc-native-r2"
            mkdir -p "$OUT"
            DEVICE_ID="$(adb devices | awk 'NR>1 && $2=="device"{print $1; exit}')"
            test -n "$DEVICE_ID" || { echo "::error::No Android emulator"; exit 1; }

            cd mobile/android
            ./gradlew assembleRelease --no-daemon

            APK="$(find app/build/outputs/apk/release -name '*.apk' -print -quit)"
            test -n "$APK" || { echo "::error::No Android release APK"; exit 1; }
            cp "$APK" "$OUT/carup-r2-pre-uat.apk"
            sha256sum "$OUT/carup-r2-pre-uat.apk" > "$OUT/apk-sha256.txt"
            PACKAGE_NAME="com.carup.mobile"

            BUNDLE="$(find app/build -type f -name 'index.android.bundle' -print -quit)"
            test -n "$BUNDLE" || { echo "::error::React Native release bundle not found"; exit 1; }
            strings "$BUNDLE" | grep -F "$EXPO_PUBLIC_API_URL" > "$OUT/api-base-binary-proof.txt"

            adb uninstall com.carup.mobile >/dev/null 2>&1 || true
            adb install "$APK"
            adb shell pm path com.carup.mobile | tee "$OUT/install-proof.txt"
            adb shell dumpsys package com.carup.mobile > "$OUT/package-dumpsys.txt"
            VERSION_CODE="$(sed -n 's/.*versionCode=\([0-9][0-9]*\).*/\1/p' "$OUT/package-dumpsys.txt" | head -n1)"
            VERSION_NAME="$(sed -n 's/.*versionName=\([^[:space:]]*\).*/\1/p' "$OUT/package-dumpsys.txt" | head -n1)"
            test -n "$VERSION_CODE"
            test -n "$VERSION_NAME"
            adb shell pm clear com.carup.mobile >/dev/null

            LAUNCH_COMPONENT="$(adb shell cmd package resolve-activity --brief -a android.intent.action.MAIN -c android.intent.category.LAUNCHER com.carup.mobile | tr -d '\r' | tail -n1)"
            case "$LAUNCH_COMPONENT" in com.carup.mobile/*) ;; *) echo "::error::Invalid launcher $LAUNCH_COMPONENT"; exit 1;; esac

            assert_foreground() {
              local label="$1"
              local resumed
              resumed="$(adb shell dumpsys activity activities | tr -d '\r' | grep -E -m1 'mResumedActivity|topResumedActivity' || true)"
              echo "$label: $resumed" >> "$OUT/foreground-proof.txt"
              [[ "$resumed" == *"com.carup.mobile/"* ]] || { echo "::error::CarUp is not foreground for $label: $resumed"; exit 1; }
              if [[ "$resumed" == *"com.android.chrome/"* || "$resumed" == *"browser"* ]]; then
                echo "::error::Browser shell detected"
                exit 1
              fi
            }

            dump_ui() {
              local name="$1"
              adb shell uiautomator dump /sdcard/window.xml >/dev/null
              adb pull /sdcard/window.xml "$OUT/$name.xml" >/dev/null
            }

            adb logcat -c
            adb shell am force-stop com.carup.mobile
            adb shell am start -W -n "$LAUNCH_COMPONENT" | tee "$OUT/cold-launch.txt"
            sleep 5
            assert_foreground cold-launch
            test -n "$(adb shell pidof com.carup.mobile | tr -d '\r')"

            adb shell am start -W -a android.intent.action.VIEW -d "carup://login" com.carup.mobile | tee "$OUT/login-deeplink.txt"
            for i in $(seq 1 20); do
              dump_ui login
              if grep -Fq 'Sign in to CarUp' "$OUT/login.xml"; then break; fi
              sleep 1
            done
            grep -Fq 'Sign in to CarUp' "$OUT/login.xml"
            grep -Fq 'Email' "$OUT/login.xml"
            grep -Fq 'Password' "$OUT/login.xml"
            assert_foreground login-route
            adb exec-out screencap -p > "$OUT/login.png"

            adb shell am start -W -a android.intent.action.VIEW -d "carup://register" com.carup.mobile | tee "$OUT/register-deeplink.txt"
            for i in $(seq 1 20); do
              dump_ui register
              if grep -Fq 'Create Account' "$OUT/register.xml"; then break; fi
              sleep 1
            done
            grep -Fq 'Create Account' "$OUT/register.xml"
            grep -Fq 'Email Address' "$OUT/register.xml"
            grep -Fq 'Password' "$OUT/register.xml"
            assert_foreground register-route
            adb exec-out screencap -p > "$OUT/register.png"

            adb shell input keyevent KEYCODE_HOME
            sleep 2
            adb shell am start -W -n "$LAUNCH_COMPONENT" | tee "$OUT/foreground-resume.txt"
            sleep 3
            assert_foreground foreground-resume

            adb shell am force-stop com.carup.mobile
            adb shell am start -W -n "$LAUNCH_COMPONENT" | tee "$OUT/restart.txt"
            sleep 3
            assert_foreground full-restart
            test -n "$(adb shell pidof com.carup.mobile | tr -d '\r')"

            adb shell am start -W -a android.intent.action.VIEW -d "carup://login" com.carup.mobile >/dev/null
            sleep 2
            PID="$(adb shell pidof com.carup.mobile | tr -d '\r')"
            test -n "$PID"
            adb logcat --pid="$PID" -d > "$OUT/carup-logcat.txt" || true
            if grep -Eiq 'Native module.*SecureStore.*(not found|missing)|Failed to initialize secure auth store|FATAL EXCEPTION|AndroidRuntime: FATAL' "$OUT/carup-logcat.txt"; then
              echo "::error::Secure session/runtime initialization failure detected"
              cat "$OUT/carup-logcat.txt"
              exit 1
            fi

            {
              echo "classification=PRE_UAT_NATIVE_BUILD"
              echo "source_sha=$GITHUB_SHA"
              echo "r1_parent=$R1_ACCEPTED_SHA"
              echo "build_profile=github-pre-uat-release-apk"
              echo "eas_profile_reference=android-device"
              echo "builder=expo-prebuild+gradle-assembleRelease"
              echo "application_id=$PACKAGE_NAME"
              echo "version=$VERSION_NAME"
              echo "version_code=$VERSION_CODE"
              echo "artifact_type=APK"
              echo "api_base=$EXPO_PUBLIC_API_URL"
              echo "api_base_baked_into_bundle=YES"
              echo "production_touched=NO"
              echo "owner_credentials_used=NO"
              echo "canonical_staging_mutated=NO"
              echo "device=$(adb shell getprop ro.product.model | tr -d '\r')"
              echo "android_api=$(adb shell getprop ro.build.version.sdk | tr -d '\r')"
              echo "launcher_component=$LAUNCH_COMPONENT"
            } > "$OUT/custody.txt"
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          target: default
          disable-animations: true
          script: bash -c "$R2_ANDROID_SCRIPT"

      - name: Upload PRE-UAT APK and runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oc-native-final-01a-r2-android-${{ github.sha }}
          path: ${{ runner.temp }}/oc-native-r2
          if-no-files-found: error
          retention-days: 30
