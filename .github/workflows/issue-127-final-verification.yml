name: Issue 127 final bounded verification

on:
  push:
    branches:
      - fix/issue-127-uat-remediation
    paths:
      - .github/workflows/issue-127-final-verification.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-127-uat-remediation
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Verify changed surfaces and record receipt
        shell: bash
        run: |
          set +e
          tested_head="$(git rev-parse HEAD)"
          rm .github/workflows/issue-127-final-verification.yml

          npm ci --legacy-peer-deps > /tmp/issue127-install.log 2>&1
          install_status=$?
          test_status=99
          lint_status=99
          build_status=99
          backend_status=99

          if [ "$install_status" -eq 0 ]; then
            npm exec --workspace=web vitest -- run \
              src/pages/diaspora/DiasporaRequestLoopRegression.test.tsx \
              src/pages/diaspora/DiasporaDriveConnections.test.tsx \
              src/lib/authorizedPortalRoles.test.ts \
              src/lib/userNotifications.test.ts \
              src/lib/diasporaDocumentChecklist.test.ts \
              src/lib/pendingReturnTo.test.ts \
              > /tmp/issue127-tests.log 2>&1
            test_status=$?

            npm exec --workspace=web eslint -- \
              src/App.tsx \
              src/components/layout/MobileNavDrawer.tsx \
              src/components/layout/Navbar.tsx \
              src/components/layout/ScrollToTop.tsx \
              src/lib/authorizedPortalRoles.ts \
              src/lib/authorizedPortalRoles.test.ts \
              src/lib/diasporaDocumentChecklist.ts \
              src/lib/diasporaDocumentChecklist.test.ts \
              src/lib/pendingReturnTo.ts \
              src/lib/pendingReturnTo.test.ts \
              src/lib/userNotifications.ts \
              src/lib/userNotifications.test.ts \
              src/pages/NotificationCenter.tsx \
              src/pages/auth/Login.tsx \
              src/pages/diaspora/DiasporaAiCommandCenter.tsx \
              src/pages/diaspora/DiasporaContainerMarketplace.tsx \
              src/pages/diaspora/DiasporaOrderPassport.tsx \
              src/pages/diaspora/DiasporaRequestLoopRegression.test.tsx \
              src/pages/diaspora/DiasporaReverseRfq.tsx \
              src/pages/diaspora/DiasporaTrade.tsx \
              src/pages/diaspora/DiasporaTradeProfile.tsx \
              > /tmp/issue127-lint.log 2>&1
            lint_status=$?

            npm run build > /tmp/issue127-build.log 2>&1
            build_status=$?

            node --check backend/server.js > /tmp/issue127-backend.log 2>&1
            backend_status=$?
          fi

          mkdir -p docs/testing
          {
            echo '# Issue #127 bounded remediation verification'
            echo
            echo "Tested source head: \`$tested_head\`"
            echo
            echo '> The repository-wide lint command remains red on unrelated pre-existing files (152 findings in the prior run). The lint gate below is deliberately scoped to every web file changed by this remediation branch.'
            echo
            echo '| Gate | Exit code | Result |'
            echo '|---|---:|---|'
            for item in \
              "Dependency install:$install_status" \
              "Targeted Vitest:$test_status" \
              "Changed-file lint:$lint_status" \
              "Production web build:$build_status" \
              "Backend syntax:$backend_status"; do
              name="${item%%:*}"
              code="${item##*:}"
              if [ "$code" -eq 0 ]; then result='PASS'; elif [ "$code" -eq 99 ]; then result='NOT RUN'; else result='FAIL'; fi
              echo "| $name | $code | $result |"
            done
            echo
            for section in tests lint build backend; do
              case "$section" in
                tests) title='Targeted test tail'; file='/tmp/issue127-tests.log'; lines=140 ;;
                lint) title='Changed-file lint tail'; file='/tmp/issue127-lint.log'; lines=140 ;;
                build) title='Production build tail'; file='/tmp/issue127-build.log'; lines=140 ;;
                backend) title='Backend syntax tail'; file='/tmp/issue127-backend.log'; lines=60 ;;
              esac
              echo "## $title"
              echo '```text'
              tail -n "$lines" "$file" 2>/dev/null || true
              echo '```'
              echo
            done
          } > docs/testing/issue-127-remediation-verification.md

          git config user.name "carup-remediation-bot"
          git config user.email "carup-remediation-bot@users.noreply.github.com"
          git add .github/workflows/issue-127-final-verification.yml docs/testing/issue-127-remediation-verification.md
          git commit -m "test(diaspora): refresh Issue 127 verification receipt"
          git push origin HEAD:fix/issue-127-uat-remediation

          if [ "$install_status" -ne 0 ] || [ "$test_status" -ne 0 ] || [ "$lint_status" -ne 0 ] || [ "$build_status" -ne 0 ] || [ "$backend_status" -ne 0 ]; then
            exit 1
          fi
