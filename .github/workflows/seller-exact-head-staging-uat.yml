name: Seller Exact-Head Staging UAT

# Mandatory Golden Dynamic Seller deployed acceptance for the Seller remediation lane.
# Runs only for PRs into the Passport integration branch; it never promotes or targets main.
on:
  pull_request:
    branches:
      - integration/vehicle-passport-v16-cert
    paths:
      - 'backend/**'
      - 'web/**'
      - 'tests/agents/38-seller-staging-browser-golden.spec.ts'
      - 'playwright.staging.config.ts'
      - '.github/workflows/seller-exact-head-staging-uat.yml'
  workflow_dispatch: {}


concurrency:
  group: seller-exact-head-staging-uat-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  golden-dynamic-seller:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      CANDIDATE_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
      STAGING_RUN_ID: seller-${{ github.run_id }}-${{ github.run_attempt }}
      DIASPORA_STAGING_DATABASE_URL: ${{ secrets.DIASPORA_STAGING_DATABASE_URL }}
      EXPECTED_STAGING_PROJECT_REF: eoyenigwevnxwwhyhaer

    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}

      - name: Assert exact candidate checkout
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Require staging operator secret
        run: |
          if [ -z "$DIASPORA_STAGING_DATABASE_URL" ]; then
            echo '::error::DIASPORA_STAGING_DATABASE_URL is not configured; Golden Dynamic Seller acceptance cannot provision its isolated staging identities.'
            exit 1
          fi
          case "$DIASPORA_STAGING_DATABASE_URL" in
            *"$EXPECTED_STAGING_PROJECT_REF"*) ;;
            *)
              echo '::error::Refusing Seller UAT identity rotation: database URL is not the approved carup-staging project.'
              exit 1
              ;;
          esac

      - name: Resolve governed exact-head preview pair
        run: |
          node <<'NODE'
          const fs = require('fs');
          const branch = process.env.CANDIDATE_BRANCH;
          const frontendPairs = JSON.parse(fs.readFileSync('web/preview-frontend-pairing.json', 'utf8')).branches || {};
          const backendPairs = JSON.parse(fs.readFileSync('web/preview-backend-pairing.json', 'utf8')).branches || {};
          const frontend = frontendPairs[branch];
          const backend = backendPairs[branch];
          if (!frontend || !backend) {
            console.error(JSON.stringify({
              error: 'Seller candidate preview pair is not governed',
              branch,
              frontend_configured: Boolean(frontend),
              backend_configured: Boolean(backend),
            }));
            process.exit(1);
          }
          fs.appendFileSync(process.env.GITHUB_ENV,
            `STAGING_WEB_URL=${frontend}\nSTAGING_API_URL=${backend.replace(/\/$/, '')}/api\n`);
          console.log(JSON.stringify({ branch, frontend, backend }));
          NODE

      - name: Wait for exact-head frontend and backend provenance
        run: |
          node --input-type=module <<'NODE'
          const expected = process.env.EXPECTED_HEAD_SHA;
          const web = process.env.STAGING_WEB_URL;
          const api = process.env.STAGING_API_URL;
          const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

          for (let attempt = 1; attempt <= 72; attempt += 1) {
            try {
              const [provRes, healthRes] = await Promise.all([
                fetch(`${web}/carup-provenance.json?attempt=${attempt}`, { cache: 'no-store' }),
                fetch(`${api}/health?attempt=${attempt}`, { cache: 'no-store' }),
              ]);
              const provenance = provRes.ok ? await provRes.json() : null;
              const health = healthRes.ok ? await healthRes.json() : null;
              const frontendOk = provenance?.commit_sha === expected && provenance?.unpaired === false;
              const backendOk = health?.status === 'UP' && health?.build?.commit_sha === expected;
              if (frontendOk && backendOk) {
                console.log(JSON.stringify({
                  frontend_sha: provenance.commit_sha,
                  backend_sha: health.build.commit_sha,
                  deployment_id: health.build.deployment_id,
                  api_base_url: provenance.api_base_url,
                }));
                process.exit(0);
              }
              console.log(`provenance attempt ${attempt}: frontend=${provenance?.commit_sha || 'not-ready'} backend=${health?.build?.commit_sha || 'not-ready'}`);
            } catch (error) {
              console.log(`provenance attempt ${attempt}: ${error.message}`);
            }
            await sleep(5000);
          }
          console.error('Exact-head Seller preview pair never reported the candidate SHA.');
          process.exit(1);
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Apply additive Seller photo-label migration to approved staging
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          import pg from 'pg'

          const dbUrl = process.env.DIASPORA_STAGING_DATABASE_URL || ''
          if (!dbUrl.includes(process.env.EXPECTED_STAGING_PROJECT_REF)) {
            throw new Error('Refusing Seller migration outside the approved staging project.')
          }
          const source = fs.readFileSync('database/migrations/20260830123000_seller_listing_photo_labels.sql', 'utf8')
          const up = source.split('-- +migrate Down')[0].replace('-- +migrate Up', '')
          const cleaned = dbUrl.replace(/([?&])sslmode=[^&]*&?/i, '$1').replace(/[?&]$/, '')
          const client = new pg.Client({ connectionString: cleaned, ssl: { rejectUnauthorized: false } })
          await client.connect()
          try {
            await client.query('BEGIN')
            await client.query(up)
            const { rows } = await client.query(`
              select column_name
              from information_schema.columns
              where table_schema='public' and table_name='listing_images' and column_name='photo_label'
            `)
            if (rows.length !== 1) throw new Error('photo_label migration did not land')
            await client.query('COMMIT')
          } catch (error) {
            await client.query('ROLLBACK')
            throw error
          } finally {
            await client.end()
          }
          NODE


      - name: Freeze exact candidate bundle
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const response = await fetch(process.env.STAGING_WEB_URL, { cache: 'no-store' });
          if (!response.ok) throw new Error(`frontend returned ${response.status}`);
          const html = await response.text();
          const bundle = (html.match(/\/assets\/(index-[A-Za-z0-9_-]+\.js)/) || [])[1];
          if (!bundle) throw new Error('Seller preview did not expose a Vite entry bundle');
          fs.appendFileSync(process.env.GITHUB_ENV, `STAGING_EXPECTED_BUNDLE=${bundle}\n`);
          console.log(`Frozen Seller exact-head bundle: ${bundle}`);
          NODE

      - name: Rotate staging-only owner and reviewer identities
        run: |
          node --input-type=module <<'NODE'
          import crypto from 'node:crypto';
          import fs from 'node:fs';
          import pg from 'pg';

          const dbUrl = process.env.DIASPORA_STAGING_DATABASE_URL || '';
          const expectedRef = process.env.EXPECTED_STAGING_PROJECT_REF;
          if (!dbUrl.includes(expectedRef)) throw new Error('Refusing identity setup outside the approved staging project.');

          const password = crypto.randomBytes(30).toString('base64url');
          const salt = crypto.randomBytes(16).toString('hex');
          const derived = await new Promise((resolve, reject) => {
            crypto.scrypt(password, salt, 64, (error, key) => error ? reject(error) : resolve(key));
          });
          const passwordHash = `scrypt:${salt}:${derived.toString('hex')}`;

          const cleanedDbUrl = dbUrl.replace(/([?&])sslmode=[^&]*&?/i, '$1').replace(/[?&]$/, '');
          const client = new pg.Client({ connectionString: cleanedDbUrl, ssl: { rejectUnauthorized: false } });
          await client.connect();
          try {
            await client.query('BEGIN');
            for (const [email, role] of [
              ['uat.buyer@carup-staging.test', 'owner'],
              ['uat.reviewer@carup-staging.test', 'admin'],
            ]) {
              const result = await client.query(
                'update public.users set password_hash = $1, role = $2 where email = $3 returning id',
                [passwordHash, role, email],
              );
              if (result.rowCount !== 1) throw new Error(`Missing staging UAT identity: ${email}`);
            }
            await client.query('COMMIT');
          } catch (error) {
            await client.query('ROLLBACK');
            throw error;
          } finally {
            await client.end();
          }

          // The random password exists only for this workflow run. Register it with the Actions
          // masker BEFORE exporting it so a later failing command cannot echo the credential.
          console.log(`::add-mask::${password}`);
          fs.appendFileSync(
            process.env.GITHUB_ENV,
            [
              `STAGING_UAT_BUYER_PASSWORD=${password}`,
              `STAGING_UAT_REVIEWER_PASSWORD=${password}`,
            ].join('\n') + '\n',
            { mode: 0o600 },
          );
          console.log('Staging-only Seller owner and reviewer identities rotated without printing credentials.');
          NODE

      - name: Run Golden Dynamic Seller desktop + mobile Chromium
        run: npx playwright test tests/agents/38-seller-staging-browser-golden.spec.ts --config=playwright.staging.config.ts

      - name: Audit Seller automation inventory after run
        if: always()
        run: |
          mkdir -p test-results
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import pg from 'pg';

          const dbUrl = process.env.DIASPORA_STAGING_DATABASE_URL || '';
          if (!dbUrl.includes(process.env.EXPECTED_STAGING_PROJECT_REF)) {
            throw new Error('Refusing automation inventory audit outside approved staging.');
          }
          const cleaned = dbUrl.replace(/([?&])sslmode=[^&]*&?/i, '$1').replace(/[?&]$/, '');
          const client = new pg.Client({ connectionString: cleaned, ssl: { rejectUnauthorized: false } });
          await client.connect();
          try {
            const { rows } = await client.query(`
              select
                v.vin,
                v.publication_status,
                v.status,
                v.created_at,
                v.seller_description,
                count(li.id)::int as media_count
              from public.vehicles v
              left join public.listing_images li on li.vin = v.vin
              where v.seller_description like 'Golden Dynamic Seller %'
              group by v.vin, v.publication_status, v.status, v.created_at, v.seller_description
              order by v.created_at desc
            `);
            const inventory = rows.map((row) => ({
              vin: row.vin,
              run_marker: String(row.seller_description || '').match(/^Golden Dynamic Seller ([^:]+):/)?.[1] || null,
              publication_status: row.publication_status,
              lifecycle_status: row.status,
              media_count: row.media_count,
              created_at: row.created_at,
              owner_class: 'staging-synthetic-seller',
            }));
            const publicRows = inventory.filter((row) =>
              ['published', 'public'].includes(String(row.publication_status || '').toLowerCase()) &&
              ['available', 'reserved'].includes(String(row.lifecycle_status || '').toLowerCase())
            );
            const receipt = {
              expected_head_sha: process.env.EXPECTED_HEAD_SHA,
              run_id: process.env.STAGING_RUN_ID,
              total_automation_records: inventory.length,
              public_automation_records: publicRows.length,
              inventory,
            };
            fs.writeFileSync('test-results/seller-automation-inventory.json', JSON.stringify(receipt, null, 2));
            console.log(JSON.stringify({ total_automation_records: inventory.length, public_automation_records: publicRows.length }));
            if (publicRows.length) {
              throw new Error(`Human UAT contamination: ${publicRows.length} Seller automation listing(s) remain public.`);
            }
          } finally {
            await client.end();
          }
          NODE

      - name: Upload Seller deployed-UAT evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seller-exact-head-staging-uat-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/staging-env-truth.json
            test-results/staging-uat-results.json
            test-results/staging-uat-html
            test-results/staging-uat-artifacts
            test-results/seller-automation-inventory.json
          if-no-files-found: warn
          retention-days: 14
