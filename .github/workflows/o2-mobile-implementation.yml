name: O2 Mobile Owner UAT Implementation

on:
  push:
    branches:
      - feat/operations-o2-people-compliance
    paths:
      - '.github/workflows/o2-mobile-implementation.yml'

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/operations-o2-people-compliance
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Assert bounded starting ancestry
        run: |
          git merge-base --is-ancestor a4b74fe7fdadadcf4a0888b716b87a7264e8c900 HEAD
          test "$(git rev-parse origin/main)" = "bb9d9900c700873ca57df0ac18a1a5c01f77711a"

      - name: Apply mobile-first and identity-PDF remediation
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def read(path): return Path(path).read_text()
          def write(path, text): Path(path).write_text(text)
          def rep(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 occurrence, got {count}')
              return text.replace(old, new, 1)
          def sub(text, pattern, replacement, label):
              text2, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, got {count}')
              return text2

          # ------------------------------------------------------------------
          # Identity backend: PDF is private document evidence, never an image.
          # ------------------------------------------------------------------
          p = 'backend/services/identity/verificationSessionService.js'
          t = read(p)
          t = rep(t,
          "const MAX_IMAGE_BYTES = 15 * 1024 * 1024;\nconst ALLOWED_MIME_TYPES = new Set(['image/jpeg', 'image/jpg', 'image/png', 'image/webp']);",
          "const MAX_UPLOAD_BYTES = 15 * 1024 * 1024;\nconst IMAGE_MIME_TYPES = new Set(['image/jpeg', 'image/png', 'image/webp']);\nconst DOCUMENT_MIME_TYPES = new Set([...IMAGE_MIME_TYPES, 'application/pdf']);",
          'identity MIME constants')

          parser = r'''export function parseVerificationPayload(side, payload = {}) {
  const encoded = payload.image || payload.file || payload.dataUri || payload.base64Data;
  const isSelfie = side === 'selfie';
  const evidenceLabel = isSelfie ? 'selfie' : 'identity document';
  if (!encoded || typeof encoded !== 'string') {
    throw new ValidationError(`The selected ${evidenceLabel} is empty or corrupt. ${isSelfie ? 'Take a new selfie photo or choose another image.' : 'Take a clear photo or choose another file.'}`);
  }

  const dataUriMatch = encoded.match(/^data:([^;]+);base64,(.+)$/s);
  const mimeType = String(payload.mimeType || dataUriMatch?.[1] || 'image/jpeg').toLowerCase();
  const base64 = String(dataUriMatch ? dataUriMatch[2] : encoded).replace(/\s+/g, '');
  const allowed = isSelfie ? IMAGE_MIME_TYPES : DOCUMENT_MIME_TYPES;

  if (!allowed.has(mimeType)) {
    throw new ValidationError(
      isSelfie
        ? 'Unsupported selfie file type. Take a photo or choose a JPG, PNG or WebP image.'
        : 'Unsupported identity document file type. Take a photo or choose a JPG, PNG, WebP or PDF file.'
    );
  }

  if (!base64 || base64.length % 4 !== 0 || !/^[A-Za-z0-9+/]*={0,2}$/.test(base64)) {
    throw new ValidationError(`The selected ${evidenceLabel} is empty or corrupt. ${isSelfie ? 'Take a new selfie photo or choose another image.' : 'Take a clear photo or choose another file.'}`);
  }

  const buffer = Buffer.from(base64, 'base64');
  if (!buffer.length) {
    throw new ValidationError(`The selected ${evidenceLabel} is empty or corrupt. ${isSelfie ? 'Take a new selfie photo or choose another image.' : 'Take a clear photo or choose another file.'}`);
  }
  if (buffer.length > MAX_UPLOAD_BYTES) {
    throw new ValidationError(`The selected ${evidenceLabel} is larger than 15 MB. Choose a smaller file.`);
  }
  if (mimeType === 'application/pdf' && buffer.subarray(0, 5).toString('ascii') !== '%PDF-') {
    throw new ValidationError('The selected identity document is empty or corrupt. Take a clear photo or choose another PDF file.');
  }

  return { buffer, mimeType, dataUri: `data:${mimeType};base64,${base64}` };
}

function extensionForMimeType(mimeType) {
  if (mimeType === 'application/pdf') return 'pdf';
  if (mimeType === 'image/png') return 'png';
  if (mimeType === 'image/webp') return 'webp';
  return 'jpg';
}'''
          t = sub(t, r"function parseImagePayload\(payload = \{\}\) \{.*?\n\}\n\nfunction extensionForMimeType\(mimeType\) \{.*?\n\}", parser, 'split document/selfie parser')
          t = rep(t, "  const parsed = parseImagePayload(payload);", "  const parsed = parseVerificationPayload(side, payload);", 'upload parser call')
          t = rep(t,
          "    uploaded_sides: {\n      front: Boolean(session.front_storage_path),\n      back: Boolean(session.back_storage_path),\n      selfie: Boolean(session.selfie_storage_path),\n    },",
          "    uploaded_sides: {\n      front: Boolean(session.front_storage_path),\n      back: Boolean(session.back_storage_path),\n      selfie: Boolean(session.selfie_storage_path),\n    },\n    uploaded_mime_types: {\n      front: session.front_mime_type || null,\n      back: session.back_mime_type || null,\n      selfie: session.selfie_mime_type || null,\n    },",
          'session MIME projection')
          t = rep(t,
          "  const hasFront = side === 'front' || Boolean(session.front_storage_path);\n  const hasBack = side === 'back' || Boolean(session.back_storage_path);\n  const hasSelfie = side === 'selfie' || Boolean(session.selfie_storage_path);\n  updatePayload.status = hasFront && hasSelfie && (!session.double_sided || hasBack) ? 'uploaded' : 'captured';",
          "  const hasFront = side === 'front' || Boolean(session.front_storage_path);\n  const hasBack = side === 'back' || Boolean(session.back_storage_path);\n  const hasSelfie = side === 'selfie' || Boolean(session.selfie_storage_path);\n  const effectiveFrontMime = side === 'front' ? parsed.mimeType : session.front_mime_type;\n  const frontIsPdfPacket = effectiveFrontMime === 'application/pdf';\n  updatePayload.status = hasFront && hasSelfie && (!session.double_sided || hasBack || frontIsPdfPacket) ? 'uploaded' : 'captured';",
          'PDF packet readiness')
          t = rep(t,
          "  const missing = [];\n  if (!session.front_storage_path) missing.push('front document');\n  if (session.double_sided && !session.back_storage_path) missing.push('back document');\n  if (!session.selfie_storage_path) missing.push('selfie');",
          "  const missing = [];\n  const frontIsPdfPacket = session.front_mime_type === 'application/pdf';\n  if (!session.front_storage_path) missing.push('identity document');\n  if (session.double_sided && !session.back_storage_path && !frontIsPdfPacket) missing.push('back document');\n  if (!session.selfie_storage_path) missing.push('selfie');",
          'PDF packet back-side rule')

          pdf_branch = r'''  const timestamp = now();
  const hasPdfDocumentEvidence = session.front_mime_type === 'application/pdf' || session.back_mime_type === 'application/pdf';

  // PDF is accepted as PRIVATE DOCUMENT EVIDENCE, not as an image. There is no proven PDF-to-image
  // renderer in this pipeline, so neither DocumentClassifier nor DocumentIntelligenceService may
  // see these bytes. A reviewer inspects the packet; no confidence or OCR candidate is manufactured.
  if (hasPdfDocumentEvidence) {
    const reason = 'PDF identity evidence requires human review. Automated image classification and OCR were not run.';
    const { data: manualSession, error: manualError } = await client
      .from('verification_sessions')
      .update({
        status: 'pending_manual_review',
        workflow_phase: WORKFLOW_PHASE.REVIEWER_ACTION_REQUIRED,
        primary_reason_code: 'PDF_MANUAL_REVIEW_REQUIRED',
        evidence_classification: EVIDENCE_CLASSIFICATION.NOT_RUN,
        ocr_execution_status: 'not_run',
        extraction_trust_status: EXTRACTION_TRUST_STATUS.NOT_RUN,
        identity_binding_status: null,
        ocr_document_id: null,
        ocr_result: null,
        confidence_score: null,
        failure_reason: reason,
        review_notes: 'PDF packet queued for manual review. CarUp has not automatically proven every required side is present; the reviewer must inspect the packet. No image classifier or OCR was run.',
        submitted_at: session.submitted_at || timestamp,
        updated_at: timestamp,
      })
      .eq('id', session.id)
      .eq('user_id', session.user_id)
      .select()
      .single();
    if (manualError) throw new Error(manualError.message);

    await writeAudit(client, {
      req: options.req,
      event_type: 'VERIFICATION_SUBMITTED',
      actor_user_id: actorId(actor),
      actor_role: actor.role,
      actor_tenant_id: actor.tenantId,
      source_route: `/api/identity/verification-sessions/${session.id}/submit`,
      targetType: 'verification_session',
      targetId: session.id,
      previous_value: { status: session.status },
      new_value: { status: manualSession.status, document_type: session.document_type, workflow_phase: WORKFLOW_PHASE.REVIEWER_ACTION_REQUIRED },
    });
    await writeAudit(client, {
      req: options.req,
      event_type: 'VERIFICATION_PDF_MANUAL_REVIEW_REQUIRED',
      actor_user_id: actorId(actor),
      actor_role: actor.role,
      actor_tenant_id: actor.tenantId,
      source_route: `/api/identity/verification-sessions/${session.id}/submit`,
      targetType: 'verification_session',
      targetId: session.id,
      new_value: {
        status: manualSession.status,
        reason_code: 'PDF_MANUAL_REVIEW_REQUIRED',
        evidence_classification: EVIDENCE_CLASSIFICATION.NOT_RUN,
        ocr_execution_status: 'not_run',
        extraction_trust_status: EXTRACTION_TRUST_STATUS.NOT_RUN,
        confidence_score: null,
      },
      reason,
    });
    return sanitizeSession(manualSession);
  }

  const storage = options.storage || { downloadFromStorage };'''
          t = rep(t,
          "  const timestamp = now();\n  const storage = options.storage || { downloadFromStorage };",
          pdf_branch,
          'PDF manual-review branch')
          write(p, t)

          # Dedicated reason code: manual reviewer may still approve after inspecting evidence.
          p = 'backend/services/identity/reasonCodes.js'; t = read(p)
          marker = "  TECHNICAL_ERROR: {"
          addition = r'''  PDF_MANUAL_REVIEW_REQUIRED: {
    code: 'PDF_MANUAL_REVIEW_REQUIRED',
    severity: 'info',
    category: 'evidence',
    approveAllowed: true,
    resubmissionAllowed: true,
    rejectionTerminal: false,
    escalateAllowed: true,
    defaultApplicantGuidance: 'Your PDF identity document is waiting for a CarUp reviewer. Automated image checks were not run.',
    internalDescription: 'PDF identity evidence is stored privately and must be inspected by a human reviewer; image classification and OCR are not run.',
  },
'''
          if 'PDF_MANUAL_REVIEW_REQUIRED' not in t:
              t = rep(t, marker, addition + marker, 'PDF reason code')
          write(p, t)

          # Journey exposes only safe MIME facts needed to render truthful controls after reload.
          p = 'backend/services/registration/registrationJourneyService.js'; t = read(p)
          t = rep(t,
          "        uploaded_sides: latestSession?.uploaded_sides || { front: false, back: false, selfie: false },\n        double_sided: latestSession?.double_sided ?? null,",
          "        uploaded_sides: latestSession?.uploaded_sides || { front: false, back: false, selfie: false },\n        uploaded_mime_types: latestSession?.uploaded_mime_types || { front: null, back: null, selfie: null },\n        double_sided: latestSession?.double_sided ?? null,",
          'journey MIME projection')
          t = t.replace("if (state === 'ready_to_submit') return 'All images are uploaded — submit them for verification.';", "if (state === 'ready_to_submit') return 'Required identity evidence and selfie are uploaded — submit them for verification.';")
          t = t.replace("if (state === 'capturing' || state === 'draft') return 'Finish uploading your document images and selfie.';", "if (state === 'capturing' || state === 'draft') return 'Finish uploading your identity document evidence and selfie.';")
          write(p, t)

          # Biometric contract: photographic document only, never reinterpret a PDF packet.
          p = 'backend/services/identity/biometrics/biometricAssessmentService.js'; t = read(p)
          t = rep(t,
          ".select('id, user_id, status, document_type, front_storage_path, selfie_storage_path')",
          ".select('id, user_id, status, document_type, front_storage_path, front_mime_type, selfie_storage_path')",
          'biometric MIME fetch')
          t = rep(t,
          "  if (!session.selfie_storage_path || !session.front_storage_path) {\n    throw new ValidationError('Biometric assessment requires the document front and a selfie to be uploaded first.');\n  }",
          "  if (!session.selfie_storage_path || !session.front_storage_path) {\n    throw new ValidationError('Biometric assessment requires the document front and a selfie to be uploaded first.');\n  }\n  if (session.front_mime_type === 'application/pdf') {\n    throw new ValidationError('Biometric face comparison requires a photo of the document front. PDF identity evidence continues through manual review.');\n  }",
          'biometric PDF refusal')
          write(p, t)

          # ------------------------------------------------------------------
          # Registration: semantic shell, compact phone composition, exact MIME UI.
          # ------------------------------------------------------------------
          p = 'web/src/pages/onboarding/RegistrationJourney.tsx'; t = read(p)
          t = rep(t,
          "        uploaded_sides: { front: boolean; back: boolean; selfie: boolean }\n        double_sided: boolean | null",
          "        uploaded_sides: { front: boolean; back: boolean; selfie: boolean }\n        uploaded_mime_types: { front: string | null; back: string | null; selfie: string | null }\n        double_sided: boolean | null",
          'registration MIME type')
          t = rep(t,
          "const fieldClass = 'w-full rounded-md border border-gray-700 bg-gray-900 px-3 py-2 text-sm text-gray-100'",
          "const fieldClass = 'min-h-11 w-full rounded-lg border border-input bg-background px-3 py-2.5 text-base text-foreground shadow-sm outline-none focus:border-primary sm:text-sm'\nconst DOCUMENT_ACCEPT = 'image/jpeg,image/png,image/webp,application/pdf'\nconst SELFIE_ACCEPT = 'image/jpeg,image/png,image/webp'\nconst MAX_UPLOAD_BYTES = 15 * 1024 * 1024",
          'registration field/MIME constants')
          t = t.replace("toast.success('Verification started — upload your document images next.')", "toast.success('Verification started — upload your identity document evidence and selfie next.')")
          upload_fn = r'''  const uploadSide = async (side: 'front' | 'back' | 'selfie', file: File | undefined) => {
    if (!file || !identity?.session_id) return
    const isSelfie = side === 'selfie'
    const mime = file.type.toLowerCase()
    const allowed = isSelfie
      ? new Set(['image/jpeg', 'image/png', 'image/webp'])
      : new Set(['image/jpeg', 'image/png', 'image/webp', 'application/pdf'])
    if (!allowed.has(mime)) {
      toast.error(isSelfie
        ? 'Unsupported selfie type. Take a photo or choose a JPG, PNG or WebP image.'
        : 'Unsupported document type. Take a photo or choose a JPG, PNG, WebP or PDF file.')
      return
    }
    if (file.size === 0) {
      toast.error(isSelfie
        ? 'This selfie file is empty or corrupt. Take a new selfie photo or choose another image.'
        : 'This identity document is empty or corrupt. Take a clear photo or choose another file.')
      return
    }
    if (file.size > MAX_UPLOAD_BYTES) {
      toast.error(`${isSelfie ? 'Selfie' : 'Identity document'} is larger than 15 MB. Choose a smaller file.`)
      return
    }
    setUploadState((current) => ({ ...current, [side]: 'uploading' }))
    try {
      const dataUri = await readFileAsDataUri(file)
      if (!dataUri.includes(';base64,') || dataUri.endsWith(';base64,')) {
        throw new Error(`The selected ${isSelfie ? 'selfie' : 'identity document'} is empty or corrupt.`)
      }
      await uploadIdentitySide(identity.session_id, side, dataUri)
      setUploadState((current) => ({ ...current, [side]: 'idle' }))
      await load()
    } catch (error) {
      setUploadState((current) => ({ ...current, [side]: 'error' }))
      const fallback = isSelfie
        ? 'Could not upload the selfie. Take a new photo or choose another JPG, PNG or WebP image.'
        : 'Could not upload the identity document. Take a clear photo or choose another supported file.'
      toast.error(error instanceof Error ? error.message : fallback)
    }
  }'''
          t = sub(t, r"  const uploadSide = async \(side: 'front' \| 'back' \| 'selfie', file: File \| undefined\) => \{.*?\n  \}\n\n  const submitIdentity", upload_fn + "\n\n  const submitIdentity", 'registration upload handler')

          # semantic token convergence without changing authority/behavior
          for old, new in [
              ('border-gray-800', 'border-border'), ('border-gray-700', 'border-input'),
              ('bg-gray-950', 'bg-background'), ('bg-gray-900', 'bg-card'),
              ('text-gray-100', 'text-foreground'), ('text-gray-300', 'text-muted-foreground'),
              ('text-gray-400', 'text-muted-foreground'), ('text-gray-600', 'text-muted-foreground')]:
              t = t.replace(old, new)
          t = t.replace('className="bg-gray-700"', 'className="bg-muted text-foreground"')
          t = rep(t,
          'if (loading) {\n    return <div className="p-8 text-muted-foreground" data-testid="journey-loading">Loading your registration status…</div>\n  }\n  if (!journey) {\n    return <div className="p-8 text-muted-foreground">Your registration status is unavailable right now.</div>\n  }',
          'if (loading) {\n    return <div className="min-h-[45vh] bg-background px-4 py-6 text-base text-muted-foreground" data-testid="journey-loading">Loading your registration status…</div>\n  }\n  if (!journey) {\n    return <div className="min-h-[45vh] bg-background px-4 py-6 text-base text-muted-foreground">Your registration status is unavailable right now.</div>\n  }',
          'registration loading states')
          t = rep(t,
          "  const showUploads = Boolean(wizardOpen && identity?.session_id)",
          "  const showUploads = Boolean(wizardOpen && identity?.session_id)\n  const pdfPacketUploaded = identity?.uploaded_mime_types?.front === 'application/pdf'",
          'registration PDF UI state')
          t = rep(t,
          '<div className="min-h-screen bg-background"><div className="mx-auto max-w-3xl space-y-6 p-4 sm:p-8 text-foreground">',
          '<div className="min-h-screen overflow-x-clip bg-background"><div className="mx-auto w-full max-w-3xl space-y-4 px-4 py-5 pb-24 text-foreground sm:space-y-6 sm:px-6 sm:py-8 lg:px-8">',
          'registration phone shell')
          t = t.replace('<h1 className="text-2xl font-semibold">Finish setting up your CarUp account</h1>', '<h1 className="text-xl font-semibold leading-tight tracking-tight sm:text-2xl">Finish setting up your CarUp account</h1>')
          t = t.replace('className="border-border bg-card"', 'className="border-border bg-card shadow-sm"')
          t = t.replace('className="p-4 space-y-3"', 'className="space-y-3 p-4 sm:p-5"')
          t = t.replace('<Button onClick={saveProfile} disabled={saving} data-testid="save-profile">', '<Button className="min-h-11 w-full sm:w-auto" onClick={saveProfile} disabled={saving} data-testid="save-profile">')
          t = rep(t,
          '<div className="flex items-center justify-between">\n            <h2 className="font-medium">Identity verification</h2>\n            {identityBadge}\n          </div>',
          '<div className="flex flex-col items-start gap-2 sm:flex-row sm:items-center sm:justify-between">\n            <h2 className="font-medium">Identity verification</h2>\n            {identityBadge}\n          </div>',
          'identity header phone layout')
          t = t.replace('<div className="flex flex-wrap items-end gap-3">\n              <label className="text-sm space-y-1">', '<div className="grid gap-3 sm:grid-cols-[minmax(0,1fr)_auto] sm:items-end">\n              <label className="w-full space-y-1 text-sm">', 1)
          t = t.replace('<Button onClick={startIdentity} disabled={starting} data-testid="start-identity">', '<Button className="min-h-11 w-full sm:w-auto" onClick={startIdentity} disabled={starting} data-testid="start-identity">')

          upload_ui = r'''          {showUploads && (
            <div className="space-y-3">
              <div className="rounded-lg border border-border bg-muted/40 p-3 text-xs leading-5 text-muted-foreground" data-testid="identity-format-guidance">
                <p><span className="font-semibold text-foreground">Identity document:</span> Accepted: JPG, PNG, WebP or PDF · Maximum 15 MB</p>
                <p><span className="font-semibold text-foreground">Selfie:</span> Accepted: JPG, PNG or WebP · Maximum 15 MB</p>
                {identity?.double_sided !== false && (
                  <p className="mt-1">A single PDF may be submitted as the document packet. CarUp has not automatically proven both sides are present; the human reviewer checks that. A selfie is still required separately.</p>
                )}
                <p className="mt-1">HEIC/HEIF are not currently supported end-to-end. On iPhone, choose a JPG/PNG/WebP photo or a PDF document instead.</p>
              </div>
              <div className="grid gap-3 sm:grid-cols-2 lg:grid-cols-3" data-testid="upload-tiles">
                {SIDES.filter(({ side }) => side !== 'back' || (identity?.double_sided !== false && !pdfPacketUploaded)).map(({ side, label }) => {
                  const uploaded = identity?.uploaded_sides?.[side]
                  const state = uploadState[side] || 'idle'
                  const isSelfie = side === 'selfie'
                  return (
                    <label key={side} className="block min-h-24 cursor-pointer rounded-lg border border-dashed border-input bg-background p-3 text-center text-sm shadow-sm"
                      data-testid={`upload-${side}`}>
                      <input type="file" accept={isSelfie ? SELFIE_ACCEPT : DOCUMENT_ACCEPT} className="hidden"
                        onChange={(e) => uploadSide(side, e.target.files?.[0])} />
                      <div className="flex flex-col items-center gap-1.5">
                        {uploaded
                          ? <CheckCircle className="h-5 w-5 text-green-600" aria-hidden />
                          : state === 'error'
                            ? <AlertTriangle className="h-5 w-5 text-amber-600" aria-hidden />
                            : <Camera className="h-5 w-5 text-muted-foreground" aria-hidden />}
                        <span className="font-medium text-foreground">{label}</span>
                        <span className="text-xs text-muted-foreground">
                          {state === 'uploading' ? 'Uploading…'
                            : uploaded ? 'Uploaded — tap to replace'
                              : state === 'error' ? 'Failed — tap to retry'
                                : isSelfie ? 'Take or choose a photo' : 'Take a photo or choose a file'}
                        </span>
                      </div>
                    </label>
                  )
                })}
              </div>
              {pdfPacketUploaded && (
                <p className="rounded-lg border border-amber-300 bg-amber-50 p-3 text-xs leading-5 text-amber-900" data-testid="pdf-manual-review-note">
                  PDF document packet uploaded. Automated image classification and OCR will not run. A CarUp reviewer must inspect the document, including whether all required sides are present.
                </p>
              )}
            </div>
          )}'''
          t = sub(t, r"          \{showUploads && \(.*?\n          \)\}\n\n          \{identity\?\.session_id", upload_ui + "\n\n          {identity?.session_id", 'registration upload tiles')
          t = t.replace("disabled={runningBiometric || !identity.uploaded_sides.front || !identity.uploaded_sides.selfie}", "disabled={runningBiometric || pdfPacketUploaded || !identity.uploaded_sides.front || !identity.uploaded_sides.selfie}")
          t = t.replace('<Button onClick={submitIdentity} disabled={submitting} data-testid="submit-identity">', '<Button className="min-h-11 w-full sm:w-auto" onClick={submitIdentity} disabled={submitting} data-testid="submit-identity">')
          t = t.replace('<Button onClick={submitIdentity} disabled={submitting} variant="outline" data-testid="resubmit-identity">', '<Button className="min-h-11 w-full sm:w-auto" onClick={submitIdentity} disabled={submitting} variant="outline" data-testid="resubmit-identity">')
          write(p, t)

          # ------------------------------------------------------------------
          # Dealer onboarding: same semantic CarUp surface, phone first.
          # ------------------------------------------------------------------
          p = 'web/src/pages/dealer/DealerOnboarding.tsx'; t = read(p)
          t = rep(t,
          "const fieldClass = 'w-full rounded-md border border-gray-700 bg-gray-900 px-3 py-2 text-sm text-gray-100'",
          "const fieldClass = 'min-h-11 w-full rounded-lg border border-input bg-background px-3 py-2.5 text-base text-foreground shadow-sm outline-none focus:border-primary sm:text-sm'",
          'dealer field class')
          for old, new in [
              ('border-gray-800', 'border-border'), ('border-gray-700', 'border-input'),
              ('bg-gray-950', 'bg-background'), ('bg-gray-900', 'bg-card'),
              ('text-gray-100', 'text-foreground'), ('text-gray-300', 'text-muted-foreground'),
              ('text-gray-400', 'text-muted-foreground')]:
              t = t.replace(old, new)
          t = t.replace('className="bg-gray-700"', 'className="bg-muted text-foreground"')
          t = rep(t,
