name: T11-CAP-LR01-R1 VEZEL SEED

# Creates the Owner-authorised real purchase on STAGING as an ADDITIONAL vehicle / order / shipment / vessel leg,
# from verified facts only (backend/scripts/data/t11-cap-r1-vezel-facts.json).
#
#   * staging only: the script refuses any database URL that is not project eoyenigwevnxwwhyhaer and refuses the
#     production ref by name — and a step below refuses it again before the script runs;
#   * INSERT only, idempotent by natural key: a second run is a read-only verify;
#   * the existing Nissan Serena is fingerprinted before and after and the run is rolled back if it differs;
#   * preflight is the WHOLE write inside a transaction that is rolled back; apply is the same, committed;
#   * this workflow adds no product code: the certification branch differs from the product commit by this file only;
#   * no events are emitted and nothing is sent.

# RETIRED after the one run that created the records (run 40161210296): the push trigger is removed so that editing
# this branch can never re-run a staging writer. A manual dispatch is an idempotent verify.
on:
  workflow_dispatch:

concurrency:
  group: t11-cap-lr01-r1-vezel-seed
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PRODUCT_SHA: fe0664658f87628e2cd4e1a00b66181f4ae526ef
      PRODUCT_BRANCH: feat/trade-os-t11-cap-lr01-journey-arrival
      EXPECTED_STAGING_PROJECT_REF: eoyenigwevnxwwhyhaer
      FORBIDDEN_PRODUCTION_PROJECT_REF: vhmnajoeicasaigiophh
      DIASPORA_STAGING_DATABASE_URL: ${{ secrets.DIASPORA_STAGING_DATABASE_URL }}
      T11_CAP_RESULTS_DIR: cert-results/t11-cap-r1-vezel

    steps:
      - name: Checkout certification branch exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Custody - exact product commit, on the product branch, workflow-only diff, reviewed bytes
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_REF_NAME" = "cert/t11-cap-lr01-r1-vezel-seed"
          git merge-base --is-ancestor "$PRODUCT_SHA" HEAD
          git merge-base --is-ancestor "$PRODUCT_SHA" "origin/$PRODUCT_BRANCH"
          mapfile -t changed < <(git diff --name-only "$PRODUCT_SHA"...HEAD)
          test "${#changed[@]}" -eq 1
          for file in "${changed[@]}"; do
            case "$file" in
              .github/workflows/t11-cap-lr01-r1-vezel-seed.yml) ;;
              *) echo "::error::Forbidden certification diff file: $file"; exit 1 ;;
            esac
          done
          # the facts and the script are exactly the reviewed bytes
          test "$(git hash-object backend/scripts/data/t11-cap-r1-vezel-facts.json)" = "4082f6ab6cc1465bb45734e7f9609f2d3442202f"
          test "$(git hash-object backend/scripts/t11-cap-r1-vezel-seed.mjs)" = "90924e2e06261c9d09b3e0b67603894f8260d3b9"
          echo "HEAD=$(git rev-parse HEAD)"
          echo "PRODUCT_SHA=$PRODUCT_SHA"

      - name: Require approved staging-only database authority
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DIASPORA_STAGING_DATABASE_URL"
          case "$DIASPORA_STAGING_DATABASE_URL" in
            *"$FORBIDDEN_PRODUCTION_PROJECT_REF"*) echo "::error::Production database reference detected"; exit 1 ;;
            *"$EXPECTED_STAGING_PROJECT_REF"*) ;;
            *) echo "::error::Database URL is not approved staging"; exit 1 ;;
          esac

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install repository dependencies
        run: npm ci

      - name: Rehearsal gate (no database access) - the seed against a staging-shaped world
        env:
          NODE_ENV: test
          SUPABASE_URL: http://localhost:54321
          SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
          SUPABASE_ANON_KEY: test-anon-key
          JWT_SECRET: test-jwt-secret
          DIASPORA_STAGING_DATABASE_URL: ''
        run: node --test backend/tests/t11-cap-r1-vezel-seed.test.js

      - name: Validate script syntax
        run: node --check backend/scripts/t11-cap-r1-vezel-seed.mjs

      - name: Preflight - the whole write inside a transaction that is ROLLED BACK
        run: node backend/scripts/t11-cap-r1-vezel-seed.mjs --mode=preflight

      - name: Apply (idempotent, INSERT only) and verify
        run: node backend/scripts/t11-cap-r1-vezel-seed.mjs --mode=apply

      - name: Verify (read-only, independent second pass)
        run: node backend/scripts/t11-cap-r1-vezel-seed.mjs --mode=verify

      - name: Evidence summary
        if: always()
        shell: bash
        run: |
          {
            echo "### T11-CAP-LR01-R1 VEZEL SEED"
            echo "product sha: \`$PRODUCT_SHA\`   target project: \`$EXPECTED_STAGING_PROJECT_REF\`   production: **not accessed**"
            for f in preflight apply verify; do
              if [ -f "$T11_CAP_RESULTS_DIR/$f.json" ]; then echo; echo "#### $f"; echo '```json'; head -c 6000 "$T11_CAP_RESULTS_DIR/$f.json"; echo; echo '```'; fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t11-cap-lr01-r1-vezel-seed
          path: cert-results/t11-cap-r1-vezel
          retention-days: 30
          if-no-files-found: warn
