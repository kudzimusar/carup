name: Marketplace One-Shot Media Hardening

on:
  push:
    branches:
      - feat/marketplace-reliability-reference-ux
    paths:
      - '.github/workflows/marketplace-one-shot-media-hardening.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch head
        uses: actions/checkout@v4
        with:
          ref: feat/marketplace-reliability-reference-ux
          fetch-depth: 0

      - name: Apply bounded Vehicle Detail media fallback
        run: python scripts/marketplace-one-shot-media-hardening.py

      - name: Validate and remove one-shot machinery
        run: |
          rm .github/workflows/marketplace-one-shot-media-hardening.yml
          rm scripts/marketplace-one-shot-media-hardening.py
          git diff --check
          git diff --stat

      - name: Commit hardened tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/src/pages/VehicleDetail.tsx .github/workflows/marketplace-one-shot-media-hardening.yml scripts/marketplace-one-shot-media-hardening.py
          git diff --cached --check
          git commit -m "fix(marketplace): fail closed on broken detail media"
          git push origin HEAD:feat/marketplace-reliability-reference-ux
