              - generic [ref=f36e46]: The CarUp Vision
              - heading "Establishing the Ledger of Trust for Southern African Vehicles" [level=2] [ref=f36e50]
              - paragraph [ref=f36e51]: "Founded in Harare in 2024, CarUp emerged to address a persistent and high-friction issue in Zimbabwe’s automotive landscape: the absolute deficit of vehicle transaction transparency and verified historical integrity."
              - paragraph [ref=f36e52]: CarUp builds one governed record per vehicle. Documents an owner supplies are reviewed before anything derived from them is published; a trust decision carries the version of the rules that produced it, the confidence behind it and its known limitations; and a fact CarUp does not hold is shown as not recorded rather than filled in. CarUp is not connected to any government registry, publishes no vehicle valuation, and claims no integration it has not built.
