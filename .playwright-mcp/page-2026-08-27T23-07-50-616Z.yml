        - generic [ref=f4e248]:
          - generic [ref=f4e249]:
            - generic [ref=f4e250]: COMMON ENQUIRIES
            - heading "Trust & Safety FAQs" [level=2] [ref=f4e251]
            - paragraph [ref=f4e252]: Have further questions regarding inspections, registration checks, or escrow policies? Read on.
          - generic [ref=f4e253]:
            - generic [ref=f4e254] [cursor=pointer]:
              - heading "Does CarUp verify import and duty clearance with ZIMRA or the CVR?" [level=3] [ref=f4e260]
              - generic: It does not. CarUp is not connected to ZIMRA, the CVR or any other authority, so it cannot confirm duty status or clearance for you. What CarUp holds is the paperwork a seller supplied and its own review of it. Confirming import liabilities remains something you should do directly with the relevant authority before you buy.
            - generic [ref=f4e264] [cursor=pointer]:
              - heading "Can CarUp detect an odometer rollback?" [level=3] [ref=f4e270]
              - generic: CarUp has no ECU scanning tooling and reads nothing from a vehicle's modules. Where a mileage reading is recorded over time and a later reading is lower than an earlier one, that inconsistency is visible in the records CarUp holds. Judging it is yours to do — CarUp does not operate a registry and cannot flag a vehicle nationally.
            - generic [ref=f4e274] [cursor=pointer]:
              - heading "How do I report a suspicious listing?" [level=3] [ref=f4e280]
              - generic: By email, to support@carup.co.zw. CarUp does not yet have an in-product reporting queue, so the form on this page cannot submit and says so rather than pretending otherwise. CarUp has no arrangement with the ZRP or any other authority to escalate on your behalf — if a vehicle may be stolen, report it to the police directly.
            - generic [ref=f4e284] [cursor=pointer]:
              - heading "Does CarUp hold my money in escrow?" [level=3] [ref=f4e290]
              - generic: "CarUp is non-custodial: it does not hold, transfer or process funds, and it has no banking partner and no trust account. Its escrow feature currently runs against a sandbox provider only — no live payment has ever been processed through CarUp, and the database itself forbids recording one. Any money you pay moves directly between you and the other party, so the safeguards below matter."
            - generic [ref=f4e294] [cursor=pointer]:
              - heading "What happens to the information in a report?" [level=3] [ref=f4e300]
              - generic: There is no in-product report to submit yet, so CarUp stores nothing from the form on this page. An email you send to support@carup.co.zw is handled by CarUp staff. CarUp makes no claim about credentialed security officers, because it does not operate such a team.
        - generic [ref=f4e306]:
          - generic [ref=f4e307]: Transact with Absolute Peace of Mind
          - heading "Ready to Experience the Secure Future of Car Trading?" [level=2] [ref=f4e308]
          - paragraph [ref=f4e309]: Whether you want to audit an imported Japanese sedan, register your mechanical garage, or search for clean-titled dealer vehicles — CarUp is your shield.
