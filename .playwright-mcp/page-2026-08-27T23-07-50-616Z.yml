                - paragraph [ref=f4e122]: A seller uploads the paperwork for their vehicle — the logbook, import and clearance documents, service history. CarUp stores what it is given. Nothing is requested from any registry, because CarUp is not connected to one.
                - generic [ref=f4e123]:
                  - heading "Detailed Inspection Checks:" [level=4] [ref=f4e124]
                  - generic [ref=f4e128]:
                    - generic [ref=f4e129]: Seller-supplied documents
                    - generic [ref=f4e132]: Stored against the vehicle
                    - generic [ref=f4e135]: Nothing is fetched from an authority
              - generic [ref=f4e138]:
                - generic [ref=f4e139]: No registry or authority integration
                - generic [ref=f4e143]: "Average Audit Time: 2-4 Hours"
        - generic [ref=f4e147]:
          - generic [ref=f4e148]:
            - generic [ref=f4e149]: GUIDES & PROTOCOLS
            - heading "Safe Trading Rules & Best Practices" [level=2] [ref=f4e150]
            - paragraph [ref=f4e151]: Whether you are purchasing a family sedan in Harare or selling a utility truck in Bulawayo, follow these mandatory secure transaction steps.
          - generic [ref=f4e153]:
            - button "🛡️ Buyer Safety Guide" [ref=f4e154] [cursor=pointer]
            - button "💼 Seller Safety Guide" [ref=f4e155] [cursor=pointer]
          - generic [ref=f4e156]:
            - generic [ref=f4e157]:
              - generic [ref=f4e158]: "1"
              - generic [ref=f4e159]: Insist on a CarUp Verification Report
              - generic [ref=f4e161]: Never buy a car without requesting its digital CarUp Trust Certificate. A verified vehicle has undergone rigorous checks for odometer tampering, registration validity, and structural integrity.
            - generic [ref=f4e162]:
              - generic [ref=f4e163]: "2"
              - generic [ref=f4e164]: Always Conduct Inspections at Designated Hubs
              - generic [ref=f4e166]: Never meet sellers in isolated or unfamiliar areas. Conduct physical meetups and test drives at CarUp hubs, ZRP stations, or verified partner garages in Harare or Bulawayo.
            - generic [ref=f4e167]:
              - generic [ref=f4e168]: "3"
              - generic [ref=f4e169]: Verify ZRP Form 94 and Logbook Authenticity
              - generic [ref=f4e171]: Ensure the seller provides a recent Zimbabwe Republic Police (ZRP) clearance certificate (Form 94) alongside a verified original logbook that matches their National Registration Card.
            - generic [ref=f4e172]:
              - generic [ref=f4e173]: "4"
              - generic [ref=f4e174]: Avoid Cash Handouts Before Title Transfer
              - generic [ref=f4e176]: Avoid paying large cash deposits or full amounts upfront prior to confirming physical title transfer at the CVR offices or through CarUp Safe Escrow Services.
        - generic [ref=f4e178]:
          - generic [ref=f4e179]:
            - generic [ref=f4e180]: REPORT SENTRY
            - heading "Encountered a Suspicious Listing or User?" [level=2] [ref=f4e181]
            - paragraph [ref=f4e182]: CarUp has no monitoring team watching the platform around the clock, and no in-product reporting queue yet. If you see a cloned listing, a rolled-back odometer, a fake dealership profile or a scam, email the details to support@carup.co.zw — and contact the police directly if you believe a vehicle is stolen.
            - generic [ref=f4e183]:
              - generic [ref=f4e188]:
                - heading "100% Anonymous & Secure" [level=4] [ref=f4e189]
                - paragraph [ref=f4e190]: Your details are never disclosed to the suspect.
              - generic [ref=f4e196]:
                - heading "2-Hour Rapid Response Action" [level=4] [ref=f4e197]
                - paragraph [ref=f4e198]: Our security agents audit verified reports immediately.
              - generic [ref=f4e203]:
                - heading "ZRP & CVR Enforcement Escalation" [level=4] [ref=f4e204]
                - paragraph [ref=f4e205]: Stolen or duty evasion vehicles are instantly escalated.
