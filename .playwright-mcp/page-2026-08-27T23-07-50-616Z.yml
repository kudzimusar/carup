      - generic [ref=f4e18]:
        - generic [ref=f4e20]:
          - generic [ref=f4e21]: 🛡️ SECURE ECOSYSTEM
          - heading "Buying a car with your eyes open" [level=1] [ref=f4e22]
          - paragraph [ref=f4e23]: CarUp records what sellers supply about a vehicle and reviews it. It is not connected to the CVR, ZINARA, ZIMRA or the police, it holds no money, and it inspects no cars — so this page is about what CarUp can genuinely tell you, and what you still need to check yourself.
          - generic [ref=f4e24]:
            - generic [ref=f4e25]:
              - paragraph [ref=f4e26]: No registry connection
              - paragraph [ref=f4e27]: CarUp cannot confirm ownership, duty or licensing with any authority.
            - generic [ref=f4e28]:
              - paragraph [ref=f4e29]: No custody of funds
              - paragraph [ref=f4e30]: CarUp never holds your money. Payment happens directly between you and the seller.
            - generic [ref=f4e31]:
              - paragraph [ref=f4e32]: No physical inspection
              - paragraph [ref=f4e33]: CarUp does not inspect vehicles. Arrange your own mechanical check before you buy.
        - generic [ref=f4e34]:
          - generic [ref=f4e35]:
            - generic [ref=f4e36]: SECURITY PILLARS
            - heading "What CarUp actually does" [level=2] [ref=f4e37]
            - paragraph [ref=f4e38]: And, just as importantly, what it does not do. CarUp is not a registry, not a custodian and not an inspector.
          - generic [ref=f4e39]:
            - generic [ref=f4e40]:
              - generic [ref=f4e41]:
                - generic [ref=f4e46]: Internal log
                - generic [ref=f4e47]: A signed internal record
              - generic [ref=f4e48]: Changes CarUp records against a vehicle are written to its own signed, append-only log, so an entry cannot be quietly altered later. It is an internal ledger — not a blockchain, and it carries no tax or ownership status from any authority.
            - generic [ref=f4e49]:
              - generic [ref=f4e50]:
                - generic [ref=f4e56]: No biometric check
                - generic [ref=f4e57]: Accounts and documents
              - generic [ref=f4e58]: Sellers hold CarUp accounts and can supply documents for a vehicle, which CarUp reviews. There is no biometric check and no physical site visit, so treat an account as an account — not as proof of who somebody is.
            - generic [ref=f4e59]:
              - generic [ref=f4e60]:
                - generic [ref=f4e65]: A person decides
                - generic [ref=f4e66]: Assisted review
              - generic [ref=f4e67]: CarUp uses automated help when reviewing documents and listings, and a person decides. It does not run reverse-image audits or price a vehicle against a market model, and it makes no claim to catch fraud before it goes live.
            - generic [ref=f4e68]:
              - generic [ref=f4e69]:
                - generic [ref=f4e76]: Holds no funds
                - generic [ref=f4e77]: Non-custodial by design
              - generic [ref=f4e78]: CarUp does not hold, transfer or process your money, and it operates no trust account. Its escrow feature runs against a sandbox provider only — no live payment has ever gone through CarUp. Money moves directly between you and the other party.
        - generic [ref=f4e80]:
          - generic [ref=f4e81]:
            - generic [ref=f4e82]: AUDITING STANDARDS
            - heading "Our 5-Stage Vehicle Verification Rigour" [level=2] [ref=f4e83]
            - paragraph [ref=f4e84]: How we construct an absolute shield of truth for every vehicle sold on CarUp.
          - generic [ref=f4e85]:
            - generic [ref=f4e86]:
              - generic [ref=f4e87] [cursor=pointer]:
                - generic [ref=f4e88]: "01"
                - generic [ref=f4e89]:
                  - heading "Documents are supplied" [level=3] [ref=f4e90]
                  - paragraph [ref=f4e91]: A seller uploads the paperwork for their vehicle — the logbook, import and clearance documents, service history. CarUp stores what it is given. Nothing is requested from any registry, because CarUp is not connected to one.
              - generic [ref=f4e92] [cursor=pointer]:
                - generic [ref=f4e93]: "02"
                - generic [ref=f4e94]:
                  - heading "CarUp reviews what it was given" [level=3] [ref=f4e95]
                  - paragraph [ref=f4e96]: A reviewer checks the supplied documents for internal consistency and completeness, and records a decision. This is CarUp's own assessment of the evidence in front of it. It is not a government verification and CarUp never describes it as one.
              - generic [ref=f4e97] [cursor=pointer]:
                - generic [ref=f4e98]: "03"
                - generic [ref=f4e99]:
                  - heading "Service and parts history is logged" [level=3] [ref=f4e100]
                  - paragraph [ref=f4e101]: Where a mechanic records a repair or a part replacement through PartSentry, that record is kept with the vehicle. A record can be marked as reviewed, and only a governed review decides whether it may be shown publicly.
              - generic [ref=f4e102] [cursor=pointer]:
                - generic [ref=f4e103]: "04"
                - generic [ref=f4e104]:
                  - heading "A Trust position is calculated" [level=3] [ref=f4e105]
                  - paragraph [ref=f4e106]: Trust states how much confidence CarUp places in the evidence it holds about a vehicle. A vehicle CarUp has not evaluated is shown as not evaluated — never as a zero, a failure, or a poor result.
              - generic [ref=f4e107] [cursor=pointer]:
                - generic [ref=f4e108]: "05"
                - generic [ref=f4e109]:
                  - heading "What Trust is not" [level=3] [ref=f4e110]
                  - paragraph [ref=f4e111]: Trust describes a vehicle's evidence. It is not a credit score, not an insurance risk rating, not a valuation, and not a judgement about the seller. A thin Trust position means CarUp holds little documentation — not that anything is wrong.
            - generic [ref=f4e113]:
              - generic [ref=f4e115]:
                - generic [ref=f4e117]:
                  - generic [ref=f4e118]: "01"
                  - generic [ref=f4e119]:
